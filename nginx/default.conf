# nginx-Konfiguration für das Self-Hosting (docker-compose.yml, Service "web").
# Ersetzt die frühere netlify.toml: dieselben Redirects, dieselbe 404-Regel.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # /tracker/ gab es bis zur Aufteilung in Übersicht/SoWi/Konzeption &
    # Administration/Netzwerke — alte Lesezeichen/Links landen auf dem Hub.
    location = /tracker { return 301 /; }
    location /tracker/ { return 301 /; }

    # Build-Eingaben und private Quellen sind keine Deploy-Artefakte. Falls
    # statt dist/ der Checkout gemountet ist, bleiben sie hier trotzdem privat.
    location ~ ^/(content|scripts|supabase|docs|knowledge-base|node_modules|\.git|\.github|\.claude|\.agents)(/|$) {
        return 404;
    }
    location ~ /(package(-lock)?\.json|docker-compose\.yml|[A-Z_]+\.md)$ {
        return 404;
    }

    # Jede Seite ist eine echte Datei (/, /uebersicht/, /netzwerke/, …).
    # Kein Catch-all-Rewrite; nur echte 404s zeigen die Startseite, mit
    # korrektem Statuscode.
    error_page 404 /index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
