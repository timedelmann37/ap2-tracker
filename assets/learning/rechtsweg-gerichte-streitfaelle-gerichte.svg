<svg class="learning-diagram diagram-layers" xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="diagram-gerichte-title diagram-gerichte-desc">
  <title id="diagram-gerichte-title">Streitgegenstand vor Gerichtsname</title>
