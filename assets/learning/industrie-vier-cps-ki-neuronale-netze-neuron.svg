<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="diagram-neuron-title diagram-neuron-desc">
  <title id="diagram-neuron-title">Ein Neuronenbaustein – keine fertige Prognose</title>
  <desc id="diagram-neuron-desc">Zwei normalisierte Eingangswerte x1 und x2 werden mit w1 und w2 gewichtet. Der Neuronenbaustein addiert den Bias b und wendet ReLU an. Seine Aktivierung h ist ein Zwischenwert für nachfolgende Verarbeitung.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Ein Neuronenbaustein – keine fertige Prognose</tspan></text>
  <g class="diagram-edge "><path d="M160 145 L480 230"/><text class="diagram-edge-label" x="320" y="179.5" text-anchor="middle">w1 = 0,5</text></g><g class="diagram-edge "><path d="M160 315 L480 230"/><text class="diagram-edge-label" x="320" y="264.5" text-anchor="middle">w2 = 0,25</text></g><g class="diagram-edge "><path d="M480 230 L800 230"/><text class="diagram-edge-label" x="640" y="222" text-anchor="middle">Aktivierung</text></g><g class="diagram-node device" transform="translate(160 145)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="160" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="160" dy="0">x1 = 0,8</tspan></text><text class="diagram-node-detail" x="160" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="160" dy="0">Vibration</tspan></text><g class="diagram-node device" transform="translate(160 315)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="160" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="160" dy="0">x2 = 0,4</tspan></text><text class="diagram-node-detail" x="160" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="160" dy="0">Temperatur</tspan></text><g class="diagram-node device" transform="translate(480 230)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Neuron h</tspan></text><text class="diagram-node-detail" x="480" y="249" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">Bias + ReLU</tspan></text><g class="diagram-node device" transform="translate(800 230)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="800" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="800" dy="0">Zwischenwert</tspan></text><text class="diagram-node-detail" x="800" y="249" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="800" dy="0">h = 0,3</tspan></text>
</svg>
