<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 820" width="360" height="820" role="img" aria-labelledby="title desc">
<title id="title">Farbe und Form: Grundprinzipien</title>
<desc id="desc">Eigene Lehrgrafik ohne vollständige Symbole. Fünf Sicherheitszeichengruppen und separat die Gefahrstoff-Raute; keine betriebliche Beschilderungsvorlage.</desc>
<rect width="360" height="820" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#111827">
<text x="18" y="30" font-size="19" font-weight="700">Formprinzipien, keine Schilder</text>
<text x="18" y="53" font-size="14">Das konkrete Symbol fehlt hier absichtlich.</text>
<g transform="translate(0 78)"><circle cx="64" cy="55" r="34" fill="white" stroke="#c42026" stroke-width="9"/><path d="M40 31 88 79" stroke="#c42026" stroke-width="9"/><text x="128" y="35" font-size="19" font-weight="700">Verbot</text><text x="128" y="61" font-size="15">Kreis + Schrägbalken</text><text x="128" y="85" font-size="15">Rot / Weiß / Schwarz</text></g>
<g transform="translate(0 193)"><circle cx="64" cy="55" r="38" fill="#005aab"/><text x="128" y="35" font-size="19" font-weight="700">Gebot</text><text x="128" y="61" font-size="15">Kreis</text><text x="128" y="85" font-size="15">Blau / Weiß</text></g>
<g transform="translate(0 308)"><path d="M64 15 106 88 22 88Z" fill="#ffe000" stroke="#111827" stroke-width="6" stroke-linejoin="round"/><text x="128" y="35" font-size="19" font-weight="700">Warnung</text><text x="128" y="61" font-size="15">Dreieck</text><text x="128" y="85" font-size="15">Gelb / Schwarz</text></g>
<g transform="translate(0 423)"><rect x="27" y="18" width="74" height="74" fill="#007a3d"/><text x="128" y="35" font-size="19" font-weight="700">Rettung</text><text x="128" y="61" font-size="15">Quadrat</text><text x="128" y="85" font-size="15">Grün / Weiß</text></g>
<g transform="translate(0 538)"><rect x="27" y="18" width="74" height="74" fill="#c42026"/><text x="128" y="35" font-size="19" font-weight="700">Brandschutz</text><text x="128" y="61" font-size="15">Quadrat</text><text x="128" y="85" font-size="15">Rot / Weiß</text></g>
<g transform="translate(0 653)"><path d="M64 9 110 55 64 101 18 55Z" fill="white" stroke="#c42026" stroke-width="6"/><text x="128" y="35" font-size="19" font-weight="700">Gefahrstoff</text><text x="128" y="61" font-size="15">Raute, eigene Gruppe</text><text x="128" y="85" font-size="15">Rot / Weiß / Schwarz</text></g>
<text x="18" y="795" font-size="14">Textalternative: Zuordnungstabelle im Lerntext.</text>
</g></svg>
