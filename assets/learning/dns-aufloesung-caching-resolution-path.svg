<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="diagram-resolution-path-title diagram-resolution-path-desc">
  <title id="diagram-resolution-path-title">Wer fragt wen?</title>
  <desc id="diagram-resolution-path-desc">Der Client stellt eine rekursive Anfrage an seinen Resolver. Dieser folgt bei einem Cache-Miss iterativen Verweisen bis zum autoritativen Server.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Wer fragt wen?</tspan></text>
  <g class="diagram-zone collision"><rect x="24" y="82" width="250" height="350" rx="18"/><text x="40" y="109">Clientseite</text></g><g class="diagram-zone broadcast"><rect x="310" y="82" width="250" height="350" rx="18"/><text x="326" y="109">Rekursive Auflösung</text></g><g class="diagram-zone collision"><rect x="596" y="82" width="340" height="350" rx="18"/><text x="612" y="109">Autoritative Hierarchie</text></g><g class="diagram-edge "><path d="M150 250 L435 250"/><text class="diagram-edge-label" x="292.5" y="242" text-anchor="middle">rekursiv</text></g><g class="diagram-edge "><path d="M435 250 L690 145"/><text class="diagram-edge-label" x="562.5" y="189.5" text-anchor="middle">iterativ</text></g><g class="diagram-edge "><path d="M690 145 L840 250"/><text class="diagram-edge-label" x="765" y="189.5" text-anchor="middle">Delegation</text></g><g class="diagram-edge "><path d="M840 250 L690 355"/><text class="diagram-edge-label" x="765" y="294.5" text-anchor="middle">Delegation</text></g><g class="diagram-edge "><path d="M690 355 L435 250"/><text class="diagram-edge-label" x="562.5" y="294.5" text-anchor="middle">Antwort</text></g><g class="diagram-node client" transform="translate(150 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Stub-Resolver</tspan></text><text class="diagram-node-detail" x="150" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">fragt rekursiv</tspan></text><g class="diagram-node router" transform="translate(435 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="435" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="435" dy="0">Resolver</tspan></text><text class="diagram-node-detail" x="435" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="435" dy="0">rekursiv + Cache</tspan></text><g class="diagram-node server" transform="translate(690 145)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="690" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="690" dy="0">Root</tspan></text><text class="diagram-node-detail" x="690" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="690" dy="0">Verweis zur TLD</tspan></text><g class="diagram-node server" transform="translate(840 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="840" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="840" dy="0">TLD</tspan></text><text class="diagram-node-detail" x="840" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="840" dy="0">Verweis zur Zone</tspan></text><g class="diagram-node server" transform="translate(690 355)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="690" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="690" dy="0">Autoritativ</tspan></text><text class="diagram-node-detail" x="690" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="690" dy="0">liefert Datensatz</tspan></text>
