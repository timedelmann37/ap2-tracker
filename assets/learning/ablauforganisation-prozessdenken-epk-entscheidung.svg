<svg class="learning-diagram diagram-epk" xmlns="http://www.w3.org/2000/svg" width="870" height="860" viewBox="0 0 870 860" role="img" aria-labelledby="diagram-entscheidung-title diagram-entscheidung-desc">
  <title id="diagram-entscheidung-title">XOR: genau ein Ergebnisweg</title>
  <desc id="diagram-entscheidung-desc">Von Antrag liegt vor über Freigabe prüfen und XOR entweder zu Antrag ist freigegeben, Zugang einrichten, Zugang ist eingerichtet; oder Antrag ist abgelehnt, Ablehnung mitteilen, Ablehnung ist mitgeteilt. Genau ein Zweig pro Durchlauf.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">XOR: genau ein Ergebnisweg</tspan></text>
  <defs><marker id="epk-entscheidung-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--diagram-muted, #c8c1d2)"/></marker></defs><path class="epk-edge" d="M480 174 V205 H480 V236" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M480 304 V332 H480 V360" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M480 420 V448 H250 V476" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M480 420 V448 H710 V476" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M250 544 V575 H250 V606" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M710 544 V575 H710 V606" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M250 674 V705 H250 V736" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><path class="epk-edge" d="M710 674 V705 H710 V736" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-entscheidung-arrow)"/><g class="epk-node epk-event" data-node-id="start" transform="translate(480 140)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Antrag liegt vor</tspan></text></g><g class="epk-node epk-function" data-node-id="pruefen" transform="translate(480 270)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><rect x="-140" y="-34" width="280" height="68" rx="12"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Freigabe prüfen</tspan></text></g><g class="epk-node epk-xor" data-node-id="wahl" transform="translate(480 390)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><circle r="30"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">XOR</tspan></text></g><g class="epk-node epk-event" data-node-id="ja" transform="translate(250 510)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Antrag ist freigegeben</tspan></text></g><g class="epk-node epk-event" data-node-id="nein" transform="translate(710 510)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Antrag ist abgelehnt</tspan></text></g><g class="epk-node epk-function" data-node-id="zugang" transform="translate(250 640)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><rect x="-140" y="-34" width="280" height="68" rx="12"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Zugang einrichten</tspan></text></g><g class="epk-node epk-function" data-node-id="mitteilen" transform="translate(710 640)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><rect x="-140" y="-34" width="280" height="68" rx="12"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Ablehnung mitteilen</tspan></text></g><g class="epk-node epk-event" data-node-id="fertig" transform="translate(250 770)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Zugang ist eingerichtet</tspan></text></g><g class="epk-node epk-event" data-node-id="abgelehnt" transform="translate(710 770)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="-5">Ablehnung ist</tspan><tspan x="0" y="17">mitgeteilt</tspan></text></g>
