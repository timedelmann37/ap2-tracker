<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="diagram-ablauf-title diagram-ablauf-desc">
  <title id="diagram-ablauf-title">Originalpfad und separate Analysekopie</title>
  <desc id="diagram-ablauf-desc">Client A an Port 3 kommuniziert über den Switch mit dem Server. Der Switch liefert zusätzlich eine Kopie beider Richtungen über Port 8 zum Analysator; dieser liegt nicht im Originalpfad.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Originalpfad und separate Analysekopie</tspan></text>
  <g class="diagram-edge allowed"><path d="M130 170 L460 170"/><text class="diagram-edge-label" x="295" y="162" text-anchor="middle">Originaldialog</text></g><g class="diagram-edge allowed"><path d="M460 170 L790 170"/><text class="diagram-edge-label" x="625" y="162" text-anchor="middle">Originaldialog</text></g><g class="diagram-edge allowed"><path d="M460 170 L460 370"/><text class="diagram-edge-label" x="460" y="262" text-anchor="middle">Kopie beider Richtungen</text></g><g class="diagram-node client" transform="translate(130 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="130" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="130" dy="0">Client A</tspan></text><text class="diagram-node-detail" x="130" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="130" dy="0">Quelle: Port 3</tspan></text><g class="diagram-node switch" transform="translate(460 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="460" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="460" dy="0">Switch</tspan></text><text class="diagram-node-detail" x="460" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="460" dy="0">spiegelt Port 3</tspan></text><g class="diagram-node server" transform="translate(790 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="790" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="790" dy="0">Server</tspan></text><text class="diagram-node-detail" x="790" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="790" dy="0">Originaldialog</tspan></text><g class="diagram-node server" transform="translate(460 370)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="460" y="365" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="460" dy="0">Analysator</tspan></text><text class="diagram-node-detail" x="460" y="389" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="460" dy="0">Ziel: Port 8</tspan></text>
</svg>
