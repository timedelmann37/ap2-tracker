<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-zwei-schichten-title diagram-zwei-schichten-desc">
  <title id="diagram-zwei-schichten-title">Zwei Lizenzschichten, zwei Fragen</title>
  <desc id="diagram-zwei-schichten-desc">Windows Server 2025 Standard/Datacenter bei physischer Core-Lizenzierung.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Lizenzschichten, zwei Fragen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">1 · Server-/Core-Lizenzen</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Physische Kerne des Hosts</tspan><tspan x="64" dy="30">abdecken: mindestens 8 je</tspan><tspan x="64" dy="30">Prozessor und 16 je Server;</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">2 · Zugriffslizenzen</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Für zugreifende Nutzende</tspan><tspan x="362" dy="30">oder Geräte grundsätzlich</tspan><tspan x="362" dy="30">passende Windows-Server-CALs</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Nicht austauschbar</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Eine CAL lizenziert keine</tspan><tspan x="660" dy="30">Host-Kerne. Voll lizenzierte</tspan><tspan x="660" dy="30">Kerne ersetzen nicht</tspan></text></g>
</svg>
