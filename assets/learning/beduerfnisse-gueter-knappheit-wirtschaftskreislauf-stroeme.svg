<svg class="learning-diagram diagram-economic-cycle" xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="diagram-stroeme-title diagram-stroeme-desc">
  <title id="diagram-stroeme-title">Vier Ströme im einfachen Wirtschaftskreislauf</title>
  <desc id="diagram-stroeme-desc">Haushalte liefern Arbeitsleistung an Unternehmen und zahlen Konsumausgaben. Unternehmen zahlen Einkommen an Haushalte und liefern Konsumgüter. Reale Leistung und jeweilige Geldzahlung fließen gegenläufig.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Vier Ströme im einfachen Wirtschaftskreislauf</tspan></text>
  <defs><marker id="economic-arrow-stroeme" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--diagram-line, #b997ff)"/></marker></defs><g class="economic-sector" data-sector="households"><rect x="42" y="98" width="180" height="350" rx="18" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="132" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Private</text><text x="132" y="290" text-anchor="middle" font-size="22" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Haushalte</text></g><g class="economic-sector" data-sector="companies"><rect x="738" y="98" width="180" height="350" rx="18" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="828" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Unternehmen</text></g><g class="economic-flow" data-from="households" data-to="companies" data-flow="real"><text x="480" y="142" text-anchor="middle" font-size="21" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Arbeitsleistung · Realstrom</text><path d="M232 156H728" fill="none" stroke="var(--diagram-line, #b997ff)" stroke-width="3" marker-end="url(#economic-arrow-stroeme)"/><text x="480" y="182" text-anchor="middle" font-size="18" fill="var(--diagram-muted, #c8c1d2)">Haushalte stellen ihre Arbeit bereit</text></g><g class="economic-flow" data-from="companies" data-to="households" data-flow="money"><text x="480" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Einkommen · Geldstrom</text><path d="M728 236H232" fill="none" stroke="var(--diagram-line, #b997ff)" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#economic-arrow-stroeme)"/><text x="480" y="262" text-anchor="middle" font-size="18" fill="var(--diagram-muted, #c8c1d2)">Unternehmen zahlen für die Arbeitsleistung</text></g><g class="economic-flow" data-from="companies" data-to="households" data-flow="real"><text x="480" y="302" text-anchor="middle" font-size="21" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Konsumgüter · Realstrom</text><path d="M728 316H232" fill="none" stroke="var(--diagram-line, #b997ff)" stroke-width="3" marker-end="url(#economic-arrow-stroeme)"/><text x="480" y="342" text-anchor="middle" font-size="18" fill="var(--diagram-muted, #c8c1d2)">Unternehmen liefern Waren und Dienste</text></g><g class="economic-flow" data-from="households" data-to="companies" data-flow="money"><text x="480" y="382" text-anchor="middle" font-size="21" font-weight="700" fill="var(--diagram-text, #f1f0ec)">Konsumausgaben · Geldstrom</text><path d="M232 396H728" fill="none" stroke="var(--diagram-line, #b997ff)" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#economic-arrow-stroeme)"/><text x="480" y="422" text-anchor="middle" font-size="18" fill="var(--diagram-muted, #c8c1d2)">Haushalte bezahlen die erworbenen Güter</text></g><text x="480" y="497" text-anchor="middle" font-size="18" fill="var(--diagram-muted, #c8c1d2)">Modell ohne Staat, Banken und Ausland</text>
</svg>
