<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="diagram-beziehungen-title diagram-beziehungen-desc">
  <title id="diagram-beziehungen-title">Leiharbeit: Vertrag und Einsatz sind getrennt</title>
  <desc id="diagram-beziehungen-desc">Jaro hat den Arbeitsvertrag mit Tivora. Tivora vereinbart Überlassung mit Navira. Navira bindet Jaro in die Arbeitsorganisation ein und erteilt Einsatzweisungen.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Leiharbeit: Vertrag und Einsatz sind getrennt</tspan></text>
  <g class="diagram-edge "><path d="M220 175 L740 175"/><text class="diagram-edge-label" x="480" y="167" text-anchor="middle">Überlassungsvertrag</text></g><g class="diagram-edge "><path d="M220 175 L480 390"/><text class="diagram-edge-label" x="350" y="274.5" text-anchor="middle">Arbeitsvertrag</text></g><g class="diagram-edge "><path d="M740 175 L480 390"/><text class="diagram-edge-label" x="610" y="274.5" text-anchor="middle">Einsatz / Weisungen</text></g><g class="diagram-node device" transform="translate(220 175)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="220" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="220" dy="0">Tivora</tspan></text><text class="diagram-node-detail" x="220" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="220" dy="0">Verleiher</tspan></text><g class="diagram-node device" transform="translate(740 175)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="740" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="740" dy="0">Navira</tspan></text><text class="diagram-node-detail" x="740" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="740" dy="0">Entleiher</tspan></text><g class="diagram-node device" transform="translate(480 390)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Jaro</tspan></text><text class="diagram-node-detail" x="480" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">Arbeitnehmer</tspan></text>
</svg>
