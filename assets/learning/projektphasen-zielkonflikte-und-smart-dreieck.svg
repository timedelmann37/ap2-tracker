<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="diagram-dreieck-title diagram-dreieck-desc">
  <title id="diagram-dreieck-title">Magisches Dreieck: konkurrierende Grenzen</title>
  <desc id="diagram-dreieck-desc">Zeit, Kosten und Leistungsumfang beeinflussen die erreichbare Qualität. Verbindungen sind Zielkonflikte, keine Netzwerkkabel und keine Rechenformel.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Magisches Dreieck: konkurrierende Grenzen</tspan></text>
  <g class="diagram-edge "><path d="M480 105 L245 365"/></g><g class="diagram-edge "><path d="M245 365 L715 365"/></g><g class="diagram-edge "><path d="M715 365 L480 105"/></g><g class="diagram-node device" transform="translate(480 105)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Zeit</tspan></text><text class="diagram-node-detail" x="480" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">30. Oktober</tspan></text><g class="diagram-node device" transform="translate(245 365)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="245" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="245" dy="0">Kosten</tspan></text><text class="diagram-node-detail" x="245" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="245" dy="0">6.000 Euro</tspan></text><g class="diagram-node device" transform="translate(715 365)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="715" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="715" dy="0">Leistungsumfang</tspan></text><text class="diagram-node-detail" x="715" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="715" dy="0">12 Pilotgeräte</tspan></text>
</svg>
