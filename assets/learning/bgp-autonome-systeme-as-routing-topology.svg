  <title id="diagram-as-routing-topology-title">IGP innerhalb, BGP zwischen autonomen Systemen</title>
  <desc id="diagram-as-routing-topology-desc">Autonome Systeme bilden administrative Routingdomänen; ihre Randrouter tauschen Präfixerreichbarkeit aus.</desc>
