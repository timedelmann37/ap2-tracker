<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-dora-observation-title diagram-dora-observation-desc">
  <title id="diagram-dora-observation-title">Paketbeobachtung und fachliche Aussage trennen</title>
  <desc id="diagram-dora-observation-desc">Die Zieladresse im Mitschnitt hängt nicht nur vom Nachrichtennamen ab, sondern auch von Phase, Flags und Netzaufbau.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Paketbeobachtung und fachliche Aussage trennen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Discover ·</tspan><tspan x="64" dy="25">typischer Start</tspan><tspan x="64" dy="25">als Broadcast</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Der Client kennt den</tspan><tspan x="64" dy="30">Server noch nicht</tspan><tspan x="64" dy="30">und besitzt zu</tspan></text></g><g><rect class="diagram-row" x="265" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="287" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="287" dy="0">Initialer Request</tspan><tspan x="287" dy="25">· typischerweise</tspan><tspan x="287" dy="25">Broadcast</tspan></text><text x="287" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="287" dy="0">Bei der Auswahl</tspan><tspan x="287" dy="30">eines Offers können</tspan><tspan x="287" dy="30">auch andere</tspan></text></g><g><rect class="diagram-row" x="488" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="510" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="510" dy="0">Offer und ACK ·</tspan><tspan x="510" dy="25">Zustellung</tspan><tspan x="510" dy="25">variabel</tspan></text><text x="510" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="510" dy="0">Broadcast oder</tspan><tspan x="510" dy="30">Unicast hängt unter</tspan><tspan x="510" dy="30">anderem von</tspan></text></g><g><rect class="diagram-row" x="711" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="733" dy="0">Renewal · nicht</tspan><tspan x="733" dy="25">erneut</tspan><tspan x="733" dy="25">vollständiges DORA</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="733" dy="0">Ein Client versucht</tspan><tspan x="733" dy="30">die Verlängerung</tspan><tspan x="733" dy="30">zunächst direkt beim</tspan></text></g>
</svg>
