<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-einlinie-title diagram-einlinie-desc">
  <title id="diagram-einlinie-title">Einlinie: eindeutige Unterstellung</title>
