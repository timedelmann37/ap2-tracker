<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="diagram-vfi-weg-title diagram-vfi-weg-desc">
  <title id="diagram-vfi-weg-title">VFI: Doppelwandlung im Normalweg</title>
  <desc id="diagram-vfi-weg-desc">Funktionsmodell: Der Gleichrichter speist den DC-Zwischenkreis, der Wechselrichter erzeugt im Doppelwandlungsmodus die Ausgangsspannung. Die Batterie hängt am DC-Zwischenkreis.</desc>
