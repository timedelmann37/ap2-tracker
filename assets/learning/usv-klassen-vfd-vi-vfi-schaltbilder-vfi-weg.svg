  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">VFI: Doppelwandlung im Normalweg</tspan></text>
  <g class="diagram-edge "><path d="M95 220 L275 220"/></g><g class="diagram-edge "><path d="M275 220 L465 220"/></g><g class="diagram-edge "><path d="M465 220 L655 220"/><text class="diagram-edge-label" x="560" y="212" text-anchor="middle">normal</text></g><g class="diagram-edge "><path d="M655 220 L850 220"/></g><g class="diagram-edge "><path d="M465 395 L465 220"/><text class="diagram-edge-label" x="465" y="299.5" text-anchor="middle">Ausfall</text></g><g class="diagram-node provider" transform="translate(95 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="95" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="95" dy="0">Netz</tspan></text><text class="diagram-node-detail" x="95" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="95" dy="0">AC-Eingang</tspan></text><g class="diagram-node router" transform="translate(275 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="275" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="275" dy="0">Gleichrichter</tspan></text><text class="diagram-node-detail" x="275" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="275" dy="0">AC zu DC</tspan></text><g class="diagram-node storage" transform="translate(465 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="465" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="465" dy="0">DC-Zwischenkreis</tspan></text><text class="diagram-node-detail" x="465" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="465" dy="0">mit Batterie</tspan></text><g class="diagram-node router" transform="translate(655 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="655" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="655" dy="0">Wechselrichter</tspan></text><text class="diagram-node-detail" x="655" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="655" dy="0">DC zu AC</tspan></text><g class="diagram-node server" transform="translate(850 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="850" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="850" dy="0">Last</tspan></text><text class="diagram-node-detail" x="850" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="850" dy="0">AC-Ausgang</tspan></text><g class="diagram-node storage" transform="translate(465 395)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="465" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="465" dy="0">Batterie</tspan></text><text class="diagram-node-detail" x="465" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="465" dy="0">Energiespeicher</tspan></text>
