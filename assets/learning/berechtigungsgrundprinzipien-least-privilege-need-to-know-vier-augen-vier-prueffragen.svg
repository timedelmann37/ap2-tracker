<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-vier-prueffragen-title diagram-vier-prueffragen-desc">
  <title id="diagram-vier-prueffragen-title">Vier Fragen an denselben Zugriff</title>
  <desc id="diagram-vier-prueffragen-desc">Least Privilege begrenzt die Fähigkeit zum erforderlichen Handeln; Need-to-know begrenzt die dafür erforderliche Information. Funktionstrennung verteilt unvereinbare Aufgaben. Ein Vier-Augen-Schritt prüft eine konkrete Handlung unabhängig; nach BSI ORP.4.A24 SOLLTE eine administrative Tätigkeit bei erhöhtem Schutzbedarf nur mit zwei Personen ausführbar sein. Die Prinzipien können gemeinsam gelten.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Vier Fragen an denselben Zugriff</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Least Privilege</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Welche Aktion und</tspan><tspan x="64" dy="30">Reichweite sind</tspan><tspan x="64" dy="30">nötig?</tspan></text></g><g><rect class="diagram-row" x="265" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="287" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="287" dy="0">Need-to-know</tspan></text><text x="287" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="287" dy="0">Welche Information</tspan><tspan x="287" dy="30">ist für die Aufgabe</tspan><tspan x="287" dy="30">nötig?</tspan></text></g><g><rect class="diagram-row" x="488" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="510" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="510" dy="0">Trennung</tspan></text><text x="510" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="510" dy="0">Welche Aufgaben</tspan><tspan x="510" dy="30">dürfen nicht bei</tspan><tspan x="510" dy="30">einer Person liegen?</tspan></text></g><g><rect class="diagram-row" x="711" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="733" dy="0">Vier Augen</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="733" dy="0">Wer wirkt an dieser</tspan><tspan x="733" dy="30">Handlung unabhängig</tspan><tspan x="733" dy="30">mit?</tspan></text></g>
</svg>
