<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-stablinie-title diagram-stablinie-desc">
  <title id="diagram-stablinie-title">Stablinie: Beratung ergänzt Leitung</title>
  <desc id="diagram-stablinie-desc">Weisung von Leitung über Serviceleitung zur Fachkraft. Der Stab berät die Leitung; seine Verbindung ist keine Weisung an die Fachkraft.</desc>
