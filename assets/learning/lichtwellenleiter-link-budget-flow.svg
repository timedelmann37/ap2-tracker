<svg xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="title desc">
  <title id="title">Vom Datenblatt zur belastbaren LWL-Entscheidung</title>
  <desc id="desc">Zuerst werden Schnittstellen und PHY festgelegt, dann Faser und Steckweg geprüft, anschließend alle Verluste addiert und schließlich eine Reserve bewertet.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Vom Datenblatt zur belastbaren LWL-Entscheidung</tspan></text>
  <g><rect x="150" y="80" width="660" height="72" rx="14" fill="#dce8df" stroke="#c3cec5"/><text x="178" y="109" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Endpunkte und PHY</tspan></text><text x="178" y="136" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Datenrate, Transceiverfamilie, Wellenlänge und</tspan><tspan x="178" dy="25">Sender-Empfänger-Paar müssen zusammenpassen</tspan></text><path d="M480 148v30" stroke="#7f9183" stroke-width="3"/><path d="m470 170 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="188" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="217" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Faser und Steckerweg</tspan></text><text x="178" y="244" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Faserklasse, Länge, Steckertyp, Schliffe, Kupplungen, Spleiße</tspan><tspan x="178" dy="25">und Polarität erfassen</tspan></text><path d="M480 256v30" stroke="#7f9183" stroke-width="3"/><path d="m470 278 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="296" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="325" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Gesamtverlust</tspan></text><text x="178" y="352" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Faserdämpfung plus Einfügeverluste aller Stecker und Spleiße</tspan><tspan x="178" dy="25">berechnen</tspan></text><path d="M480 364v30" stroke="#7f9183" stroke-width="3"/><path d="m470 386 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="404" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="433" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Reserve bewerten</tspan></text><text x="178" y="460" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Gesamtverlust muss unter dem vorgegebenen Budget liegen;</tspan><tspan x="178" dy="25">verbleibende Marge dokumentieren</tspan></text></g>
</svg>
