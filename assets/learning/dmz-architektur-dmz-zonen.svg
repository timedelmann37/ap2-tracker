<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="diagram-dmz-zonen-title diagram-dmz-zonen-desc">
  <title id="diagram-dmz-zonen-title">Zwei kontrollierte Übergänge</title>
  <desc id="diagram-dmz-zonen-desc">Internet, äußere Firewall, Webserver in der DMZ, innere Firewall und internes Backend liegen in einem Pfad. Jede Grenze besitzt eigene Regeln.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei kontrollierte Übergänge</tspan></text>
  <g class="diagram-edge allowed"><path d="M120 160 L360 160"/><text class="diagram-edge-label" x="240" y="152" text-anchor="middle">TCP/443</text></g><g class="diagram-edge allowed"><path d="M360 160 L620 160"/><text class="diagram-edge-label" x="490" y="152" text-anchor="middle">HTTPS</text></g><g class="diagram-edge allowed"><path d="M620 160 L620 350"/><text class="diagram-edge-label" x="620" y="247" text-anchor="middle">TCP/5432</text></g><g class="diagram-edge allowed"><path d="M620 350 L300 350"/><text class="diagram-edge-label" x="460" y="342" text-anchor="middle">enges Ziel</text></g><g class="diagram-node client" transform="translate(120 160)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="120" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="120" dy="0">Internet</tspan></text><text class="diagram-node-detail" x="120" y="179" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="120" dy="0">öffentliche Clients</tspan></text><g class="diagram-node router" transform="translate(360 160)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="360" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="360" dy="0">Äußere FW</tspan></text><text class="diagram-node-detail" x="360" y="179" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="360" dy="0">nur HTTPS</tspan></text><g class="diagram-node server" transform="translate(620 160)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="620" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="620" dy="0">DMZ-Web</tspan></text><text class="diagram-node-detail" x="620" y="179" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="620" dy="0">192.0.2.40</tspan></text><g class="diagram-node router" transform="translate(620 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="620" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="620" dy="0">Innere FW</tspan></text><text class="diagram-node-detail" x="620" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="620" dy="0">nur Backenddienst</tspan></text><g class="diagram-node server" transform="translate(300 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="300" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="300" dy="0">Internes Backend</tspan></text><text class="diagram-node-detail" x="300" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="300" dy="0">10.30.0.10</tspan></text>
</svg>
