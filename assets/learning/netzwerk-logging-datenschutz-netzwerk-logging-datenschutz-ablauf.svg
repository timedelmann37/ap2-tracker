<svg class="learning-diagram diagram-flow" xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="diagram-netzwerk-logging-datenschutz-ablauf-title diagram-netzwerk-logging-datenschutz-ablauf-desc">
  <title id="diagram-netzwerk-logging-datenschutz-ablauf-title">Vor dem Sammeln entscheiden</title>
  <desc id="diagram-netzwerk-logging-datenschutz-ablauf-desc">Zweck und Beteiligung werden geklärt, der Umfang minimiert, Rechte begrenzt und der Löschlauf geprüft.</desc>
