<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-nutzerkreis-title diagram-nutzerkreis-desc">
  <title id="diagram-nutzerkreis-title">Wer darf die Infrastruktur nutzen?</title>
  <desc id="diagram-nutzerkreis-desc">Eigene Vergleichsgrafik zu den drei NIST-Nutzerkreisen. Standort ist ein anderes Merkmal.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Wer darf die Infrastruktur nutzen?</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Public · grundsätzlich</tspan><tspan x="64" dy="25">offenes Angebot</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Cloud-Infrastruktur steht</tspan><tspan x="64" dy="30">dem allgemeinen Markt zur</tspan><tspan x="64" dy="30">Nutzung offen. Mandanten und</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">Private · genau eine</tspan><tspan x="362" dy="25">Organisation</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Ausschließliche Nutzung</tspan><tspan x="362" dy="30">durch eine Organisation.</tspan><tspan x="362" dy="30">Betrieb durch eigene IT oder</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Community · definierte</tspan><tspan x="660" dy="25">Gemeinschaft</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Exklusive Nutzung durch</tspan><tspan x="660" dy="30">mehrere Organisationen mit</tspan><tspan x="660" dy="30">gemeinsamen Anforderungen,</tspan></text></g>
</svg>
