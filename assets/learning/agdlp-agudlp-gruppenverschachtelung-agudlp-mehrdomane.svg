<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-agudlp-mehrdomane-title diagram-agudlp-mehrdomane-desc">
  <title id="diagram-agudlp-mehrdomane-title">AGUDLP: gemeinsame Auswertung, zwei Ressourcen</title>
  <desc id="diagram-agudlp-mehrdomane-desc">Miras Konto führt über die globale Laborgruppe, Samis Konto über die globale Außendienstgruppe zur universellen Gruppe U_AUSWERTUNG im selben Forest. Von U zweigen zwei domänenlokale Ressourcengruppen in daten.hafenwald.example ab. Jede D-Gruppe hat nur auf ihrem zugeordneten Ordner das NTFS-Leserecht.</desc>
