<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Anwendungsprotokolle nach Dienstfamilie</title>
  <desc id="desc">Die Auswahl beginnt beim fachlichen Zweck: Web, Datei, E-Mail, Administration, Verzeichnis oder Betriebstechnik.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Anwendungsprotokolle nach Dienstfamilie</tspan></text>
  <g><rect x="42" y="92" width="205" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="64" dy="0">Web und Datei</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="64" dy="0">HTTP/HTTPS für</tspan><tspan x="64" dy="30">Webinhalte; FTP als</tspan><tspan x="64" dy="30">ungeschützter</tspan></text></g><g><rect x="265" y="92" width="205" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="287" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="287" dy="0">E-Mail</tspan></text><text x="287" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="287" dy="0">SMTP überträgt</tspan><tspan x="287" dy="30">Nachrichten; IMAP</tspan><tspan x="287" dy="30">synchronisiert</tspan></text></g><g><rect x="488" y="92" width="205" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="510" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="510" dy="0">Administration und</tspan><tspan x="510" dy="25">Zugriff</tspan></text><text x="510" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="510" dy="0">SSH für sichere</tspan><tspan x="510" dy="30">Shell und Tunnel,</tspan><tspan x="510" dy="30">RDP für grafische</tspan></text></g><g><rect x="711" y="92" width="205" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="733" dy="0">Verzeichnis und</tspan><tspan x="733" dy="25">Betrieb</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="733" dy="0">LDAP mit TLS für</tspan><tspan x="733" dy="30">Verzeichniszugriffe,</tspan><tspan x="733" dy="30">SNMP für Management,</tspan></text></g>
</svg>
