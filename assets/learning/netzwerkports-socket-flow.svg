<svg xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="title desc">
  <title id="title">Eine Verbindung, zwei Richtungen</title>
  <desc id="desc">Die Anfrage läuft vom dynamischen Clientport zum bekannten Serverport. In der Antwort tauschen Quell- und Zielendpunkt ihre Rollen.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Eine Verbindung, zwei Richtungen</tspan></text>
  <g><rect x="150" y="80" width="660" height="72" rx="14" fill="#dce8df" stroke="#c3cec5"/><text x="178" y="109" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Client öffnet lokalen Endpunkt</tspan></text><text x="178" y="136" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">10.20.30.44:53142; die dynamische Portnummer unterscheidet</tspan><tspan x="178" dy="25">diese Verbindung von weiteren Verbindungen desselben Clients</tspan></text><path d="M480 148v30" stroke="#7f9183" stroke-width="3"/><path d="m470 170 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="188" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="217" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Anfrage</tspan></text><text x="178" y="244" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">TCP 10.20.30.44:53142 → 10.20.30.10:443</tspan></text><path d="M480 256v30" stroke="#7f9183" stroke-width="3"/><path d="m470 278 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="296" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="325" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Server lauscht</tspan></text><text x="178" y="352" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">10.20.30.10:443; der bekannte Port verweist auf den erwarteten</tspan><tspan x="178" dy="25">HTTPS-Dienst</tspan></text><path d="M480 364v30" stroke="#7f9183" stroke-width="3"/><path d="m470 386 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="404" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="433" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Antwort</tspan></text><text x="178" y="460" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">TCP 10.20.30.10:443 → 10.20.30.44:53142</tspan></text></g>
</svg>
