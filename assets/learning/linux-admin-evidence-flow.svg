<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1060" viewBox="0 0 600 1060" role="img" aria-labelledby="title description">
  <title id="title">Linux-Dienststörung: vom Befund zur Verifikation</title>
  <desc id="description">Technisches Ablaufdiagramm: Dienststatus lesen, Journal im aktuellen Boot filtern, bei fehlendem Hinweis weitere Daten erfassen, konkrete Spur prüfen, gezielt korrigieren und die Wirkung verifizieren.</desc>
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#38dfff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#a8b8c9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="600" height="1060" fill="#101724"/>
  <rect x="1" y="1" width="598" height="1058" fill="none" stroke="#475568" stroke-width="2"/>

  <text x="32" y="50" fill="#a8b8c9" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1.4">LINUX / DEBIAN + SYSTEMD</text>
  <text x="32" y="99" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="600">nginx antwortet nicht</text>
  <text x="32" y="139" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="27">Nach Neustart: Befund vor Eingriff</text>
  <path d="M 32 165 H 568" stroke="#475568" stroke-width="2"/>

  <path d="M 58 215 V 814" stroke="#38dfff" stroke-width="3"/>
  <circle cx="58" cy="218" r="23" fill="#101724" stroke="#38dfff" stroke-width="3"/>
  <text x="58" y="227" fill="#e7faff" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">1</text>
  <text x="105" y="211" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="600">Laufzustand</text>
  <text x="105" y="254" fill="#a9cfea" font-family="Consolas, monospace" font-size="24">systemctl status nginx.service</text>
  <text x="105" y="291" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="27">active, inactive oder failed?</text>

  <circle cx="58" cy="356" r="23" fill="#101724" stroke="#38dfff" stroke-width="3"/>
  <text x="58" y="365" fill="#e7faff" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">2</text>
  <text x="105" y="349" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="600">Journal filtern</text>
  <text x="105" y="391" fill="#a9cfea" font-family="Consolas, monospace" font-size="24">journalctl -u nginx.service -b</text>
  <text x="105" y="428" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="27">Unit und aktuellen Boot ansehen.</text>

  <path d="M 58 474 L 84 500 L 58 526 L 32 500 Z" fill="#101724" stroke="#edbd72" stroke-width="3"/>
  <text x="105" y="504" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Fehlerhinweis?</text>
  <text x="105" y="543" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="26">Nein: weitere Daten erfassen.</text>
  <path d="M 497 532 H 565 V 349 H 537" fill="none" stroke="#a8b8c9" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#return)"/>
  <text x="105" y="583" fill="#65d9a0" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">Ja: Hypothese gezielt prüfen.</text>

  <circle cx="58" cy="638" r="23" fill="#101724" stroke="#38dfff" stroke-width="3"/>
  <text x="58" y="647" fill="#e7faff" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">3</text>
  <text x="105" y="631" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="600">Spur prüfen</text>
  <text x="105" y="673" fill="#b997ff" font-family="Consolas, monospace" font-size="24">/etc/nginx/</text>
  <text x="317" y="673" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="24">Konfiguration</text>
  <text x="105" y="713" fill="#b997ff" font-family="Consolas, monospace" font-size="24">/var/log/</text>
  <text x="317" y="713" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="24">Dateilog, falls genutzt</text>
  <text x="105" y="753" fill="#b997ff" font-family="Consolas, monospace" font-size="24">apt policy nginx</text>
  <text x="372" y="753" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="24">Version prüfen</text>

  <circle cx="58" cy="824" r="23" fill="#101724" stroke="#38dfff" stroke-width="3"/>
  <text x="58" y="833" fill="#e7faff" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">4</text>
  <text x="105" y="817" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="600">Gezielte Korrektur</text>
  <text x="105" y="856" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="27">Befund und Freigabe zuerst.</text>

  <path d="M 58 847 V 910" stroke="#38dfff" stroke-width="3" marker-end="url(#next)"/>
  <path d="M 88 895 H 568" stroke="#475568" stroke-width="2"/>
  <circle cx="58" cy="953" r="23" fill="#101724" stroke="#65d9a0" stroke-width="3"/>
  <path d="m 48 952 7 7 14 -16" fill="none" stroke="#65d9a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="105" y="945" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="600">Wirkung prüfen</text>
  <text x="105" y="987" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="27">Dienst + HTTP + neue Logs</text>
  <text x="32" y="1034" fill="#a8b8c9" font-family="Inter, Arial, sans-serif" font-size="24">Status allein beweist keine Ursache.</text>
</svg>
