<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-secured-access-port-title diagram-secured-access-port-desc">
  <title id="diagram-secured-access-port-title">Die Regel gehört an den definierten Access-Port</title>
  <desc id="diagram-secured-access-port-desc">Ein Arbeitsplatz mit Telefon und PC verwendet zwei erlaubte Quell-MAC-Adressen am Access-Port. Ein unbekanntes Ersatzgerät löst die konfigurierte Reaktion aus. Der Uplink wird nicht mit derselben Endgeräte-Höchstzahl behandelt.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Die Regel gehört an den definierten Access-Port</tspan></text>
  <g class="diagram-zone zone-access"><rect x="25" y="85" width="275" height="335" rx="18"/><text x="41" y="112">Arbeitsplatz</text></g><g class="diagram-zone zone-switch"><rect x="350" y="85" width="270" height="335" rx="18"/><text x="366" y="112">Access-Switch</text></g><g class="diagram-zone zone-uplink"><rect x="670" y="85" width="260" height="335" rx="18"/><text x="686" y="112">Verteilnetz</text></g><g class="diagram-edge allowed"><path d="M150 165 L485 245"/><text class="diagram-edge-label" x="317.5" y="197" text-anchor="middle">zulässig</text></g><g class="diagram-edge allowed"><path d="M150 285 L485 245"/><text class="diagram-edge-label" x="317.5" y="257" text-anchor="middle">zulässig</text></g><g class="diagram-edge blocked"><path d="M150 380 L485 245"/><text class="diagram-edge-label" x="317.5" y="304.5" text-anchor="middle">Verstoß</text></g><g class="diagram-edge trunk"><path d="M485 245 L800 245"/><text class="diagram-edge-label" x="642.5" y="237" text-anchor="middle">Weiterleitung</text></g><g class="diagram-node phone" transform="translate(150 165)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">IP-Telefon</tspan></text><text class="diagram-node-detail" x="150" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">MAC …:10</tspan></text><g class="diagram-node client" transform="translate(150 285)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Arbeitsplatz-PC</tspan></text><text class="diagram-node-detail" x="150" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">MAC …:20</tspan></text><g class="diagram-node warning" transform="translate(150 380)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="375" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Unbekanntes Gerät</tspan></text><text class="diagram-node-detail" x="150" y="399" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">MAC …:99</tspan></text><g class="diagram-node switch" transform="translate(485 245)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="485" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="485" dy="0">Port 7</tspan></text><text class="diagram-node-detail" x="485" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="485" dy="0">maximal 2 · …:10 und</tspan><tspan x="485" dy="25">…:20</tspan></text><g class="diagram-node router" transform="translate(800 245)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="800" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="800" dy="0">Uplink</tspan></text><text class="diagram-node-detail" x="800" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="800" dy="0">führt viele</tspan><tspan x="800" dy="25">Quell-MACs</tspan></text>
</svg>
