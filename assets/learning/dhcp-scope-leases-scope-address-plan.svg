<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-scope-address-plan-title diagram-scope-address-plan-desc">
  <title id="diagram-scope-address-plan-title">Ein Scope enthält mehrere Adressrollen</title>
  <desc id="diagram-scope-address-plan-desc">Beispiel für 192.168.50.0/24 mit einem konfigurierten Poolrahmen von .50 bis .220.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Ein Scope enthält mehrere Adressrollen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Scope ·</tspan><tspan x="64" dy="25">192.168.50.0/24</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Ordnet Pool und</tspan><tspan x="64" dy="30">Optionen genau</tspan><tspan x="64" dy="30">diesem Subnetz zu;</tspan></text></g><g><rect class="diagram-row" x="265" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="287" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="287" dy="0">Ausschluss · .50</tspan><tspan x="287" dy="25">bis .79</tspan></text><text x="287" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="287" dy="0">Liegt im geplanten</tspan><tspan x="287" dy="30">Poolrahmen, wird</tspan><tspan x="287" dy="30">aber nicht dynamisch</tspan></text></g><g><rect class="diagram-row" x="488" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="510" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="510" dy="0">Reservierung ·</tspan><tspan x="510" dy="25">.150</tspan></text><text x="510" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="510" dy="0">Der Drucker erhält</tspan><tspan x="510" dy="30">über DHCP anhand</tspan><tspan x="510" dy="30">seiner Clientkennung</tspan></text></g><g><rect class="diagram-row" x="711" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="733" dy="0">Freie Dynamik ·</tspan><tspan x="733" dy="25">.80–.149 und</tspan><tspan x="733" dy="25">.151–.220</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="733" dy="0">Nur diese 140</tspan><tspan x="733" dy="30">Adressen stehen</tspan><tspan x="733" dy="30">normalen dynamischen</tspan></text></g>
</svg>
