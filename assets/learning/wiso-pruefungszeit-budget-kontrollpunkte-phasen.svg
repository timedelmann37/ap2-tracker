  <title id="diagram-phasen-title">Eigener 60-Minuten-Übungsplan</title>
  <desc id="diagram-phasen-desc">Zeitfenster sind ein Beispiel und dürfen nach dem Kontrollpunkt angepasst werden.</desc>
