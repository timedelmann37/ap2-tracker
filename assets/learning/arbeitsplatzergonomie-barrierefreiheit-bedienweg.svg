<svg class="learning-diagram diagram-flow" xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="diagram-bedienweg-title diagram-bedienweg-desc">
  <title id="diagram-bedienweg-title">Den gesamten Bedienweg testen</title>
  <desc id="diagram-bedienweg-desc">Eigener Testfall zur Buchung, keine vollständige WCAG-Prüfung.</desc>
