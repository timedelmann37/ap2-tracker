<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-end-to-end-mtu-path-title diagram-end-to-end-mtu-path-desc">
  <title id="diagram-end-to-end-mtu-path-title">Die kleinste MTU im Pfad setzt die Grenze</title>
  <desc id="diagram-end-to-end-mtu-path-desc">Storage-Host und Server sind auf 9000 Byte eingestellt, doch der Firewallpfad unterstützt nur 1500 Byte. Die wirksame Path MTU ist deshalb 1500 Byte; eine große lokale Konfiguration an den Endpunkten reicht nicht.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Die kleinste MTU im Pfad setzt die Grenze</tspan></text>
  <g class="diagram-zone zone-source"><rect x="25" y="80" width="285" height="350" rx="18"/><text x="41" y="107">Quellseite</text></g><g class="diagram-zone zone-transit"><rect x="350" y="80" width="280" height="350" rx="18"/><text x="366" y="107">Transit</text></g><g class="diagram-zone zone-target"><rect x="670" y="80" width="260" height="350" rx="18"/><text x="686" y="107">Zielseite</text></g><g class="diagram-edge jumbo"><path d="M120 170 L220 330"/><text class="diagram-edge-label" x="170" y="242" text-anchor="middle">9000</text></g><g class="diagram-edge jumbo"><path d="M220 330 L440 170"/><text class="diagram-edge-label" x="330" y="242" text-anchor="middle">9000</text></g><g class="diagram-edge blocked"><path d="M440 170 L540 330"/><text class="diagram-edge-label" x="490" y="242" text-anchor="middle">nur 1500</text></g><g class="diagram-edge default"><path d="M540 330 L800 250"/><text class="diagram-edge-label" x="670" y="282" text-anchor="middle">Path MTU 1500</text></g><g class="diagram-node server" transform="translate(120 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="120" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="120" dy="0">Storage-Host</tspan></text><text class="diagram-node-detail" x="120" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="120" dy="0">IP-MTU 9000</tspan></text><g class="diagram-node switch" transform="translate(220 330)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="220" y="325" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="220" dy="0">vSwitch/NIC</tspan></text><text class="diagram-node-detail" x="220" y="349" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="220" dy="0">MTU 9000 geprüft</tspan></text><g class="diagram-node switch" transform="translate(440 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="440" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="440" dy="0">Access/LAG</tspan></text><text class="diagram-node-detail" x="440" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="440" dy="0">MTU 9000 geprüft</tspan></text><g class="diagram-node warning" transform="translate(540 330)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="540" y="325" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="540" dy="0">Firewallpfad</tspan></text><text class="diagram-node-detail" x="540" y="349" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="540" dy="0">MTU 1500 · Engstelle</tspan></text><g class="diagram-node server" transform="translate(800 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="800" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="800" dy="0">Storage-Ziel</tspan></text><text class="diagram-node-detail" x="800" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="800" dy="0">IP-MTU 9000</tspan></text>
</svg>
