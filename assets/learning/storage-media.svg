<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">HDD, SATA-SSD und NVMe-SSD im Vergleich</title>
  <desc id="desc">Drei Speicherpfade zeigen das Medium, den Controller und die Verbindung zum Host. Eine HDD speichert magnetisch und besitzt einen mechanischen Zugriffspfad. SATA-SSD und NVMe-SSD speichern beide in NAND-Flash; sie unterscheiden sich vor allem durch Protokoll und Verbindung. Unten werden kleine zufällige Zugriffe einem NVMe-SSD-Pfad und große sequenzielle Archivdaten einem HDD-Pfad zugeordnet.</desc>
  <defs>
    <style>
      .bg{fill:#f4f4f1}.panel{fill:#fff;stroke:#c8cbc7;stroke-width:2}.head{fill:#183c42}.headtext{fill:#fff;font:700 22px system-ui,sans-serif}.label{fill:#1d2220;font:700 18px system-ui,sans-serif}.copy{fill:#3f4743;font:500 16px system-ui,sans-serif}.small{fill:#59615d;font:500 15px system-ui,sans-serif}.chip{fill:#dcefee;stroke:#72aaa7;stroke-width:2}.nand{fill:#d9e7f6;stroke:#7194b8;stroke-width:2}.mechanic{fill:#f3d795;stroke:#ad7d27;stroke-width:2}.link{fill:#f7ead0;stroke:#c49a45;stroke-width:2}.path{fill:none;stroke:#127a86;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#6f7873;stroke-width:2;stroke-linecap:round}.route{fill:#fff;stroke:#c8cbc7;stroke-width:2}.accent{fill:#127a86}.accenttext{fill:#127a86;font:700 17px system-ui,sans-serif}.routeTitle{fill:#1d2220;font:700 17px system-ui,sans-serif}.routeCopy{fill:#4d5551;font:500 15px system-ui,sans-serif}.badge{fill:#e7efec}.badgeText{fill:#29433e;font:700 14px system-ui,sans-serif}
      @media (prefers-color-scheme:dark){.bg{fill:#191b1a}.panel,.route{fill:#242725;stroke:#4c514e}.label,.routeTitle{fill:#f2f4f2}.copy,.routeCopy{fill:#d0d4d1}.small{fill:#b8bfbb}.chip{fill:#23413f;stroke:#68a7a3}.nand{fill:#263c52;stroke:#7299c0}.mechanic{fill:#493d22;stroke:#c79b46}.link{fill:#453a25;stroke:#bd9445}.badge{fill:#2a3430}.badgeText{fill:#cce2d9}}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" class="accent"/></marker>
  </defs>

  <rect class="bg" width="1100" height="680" rx="20"/>
  <text class="accenttext" x="42" y="38">Warum können SATA und NVMe beide SSD sein – aber verschieden reagieren?</text>

  <g transform="translate(42 62)">
    <rect class="panel" width="322" height="395" rx="16"/>
    <path class="head" d="M16 0h290a16 16 0 0 1 16 16v48H0V16A16 16 0 0 1 16 0Z"/>
    <text class="headtext" x="161" y="40" text-anchor="middle">HDD</text>
    <g transform="translate(26 88)">
      <rect class="mechanic" x="0" y="0" width="130" height="130" rx="16"/>
      <circle cx="65" cy="65" r="43" fill="none" stroke="#ad7d27" stroke-width="7"/>
      <circle cx="65" cy="65" r="8" fill="#ad7d27"/>
      <path d="M108 31 75 63" stroke="#ad7d27" stroke-width="7" stroke-linecap="round"/>
      <text class="small" x="65" y="155" text-anchor="middle">magnetische Scheiben</text>
    </g>
    <path class="path" d="M164 153h29" marker-end="url(#arrow)"/>
    <g transform="translate(200 108)">
      <rect class="link" width="94" height="90" rx="12"/>
      <text class="label" x="47" y="39" text-anchor="middle">SATA</text>
      <text class="small" x="47" y="63" text-anchor="middle">/ SAS</text>
    </g>
    <text class="label" x="26" y="277">Mechanischer Zugriff</text>
    <text class="copy" x="26" y="306">Kopf positionieren + Rotation</text>
    <text class="copy" x="26" y="333">→ Millisekunden-Latenz</text>
    <text class="copy" x="26" y="360">→ stark bei Kapazität und Kosten</text>
  </g>

  <g transform="translate(389 62)">
    <rect class="panel" width="322" height="395" rx="16"/>
    <path class="head" d="M16 0h290a16 16 0 0 1 16 16v48H0V16A16 16 0 0 1 16 0Z"/>
    <text class="headtext" x="161" y="40" text-anchor="middle">SATA-SSD</text>
    <g transform="translate(24 98)">
      <rect class="nand" x="0" y="0" width="67" height="45" rx="7"/><rect class="nand" x="0" y="57" width="67" height="45" rx="7"/>
      <rect class="nand" x="79" y="0" width="67" height="45" rx="7"/><rect class="nand" x="79" y="57" width="67" height="45" rx="7"/>
      <text class="small" x="73" y="127" text-anchor="middle">NAND-Flash</text>
    </g>
    <path class="path" d="M179 153h27" marker-end="url(#arrow)"/>
    <g transform="translate(213 108)">
      <rect class="link" width="84" height="90" rx="12"/>
      <text class="label" x="42" y="39" text-anchor="middle">SATA</text>
      <text class="small" x="42" y="63" text-anchor="middle">AHCI</text>
    </g>
    <text class="label" x="24" y="277">Elektronischer Zugriff</text>
    <text class="copy" x="24" y="306">keine beweglichen Teile</text>
    <text class="copy" x="24" y="333">→ geringe Latenz, viele Random-I/Os</text>
    <text class="copy" x="24" y="360">→ SATA begrenzt den Host-Pfad</text>
  </g>

  <g transform="translate(736 62)">
    <rect class="panel" width="322" height="395" rx="16"/>
    <path class="head" d="M16 0h290a16 16 0 0 1 16 16v48H0V16A16 16 0 0 1 16 0Z"/>
    <text class="headtext" x="161" y="40" text-anchor="middle">NVMe-SSD</text>
    <g transform="translate(24 98)">
      <rect class="nand" x="0" y="0" width="67" height="45" rx="7"/><rect class="nand" x="0" y="57" width="67" height="45" rx="7"/>
      <rect class="nand" x="79" y="0" width="67" height="45" rx="7"/><rect class="nand" x="79" y="57" width="67" height="45" rx="7"/>
      <text class="small" x="73" y="127" text-anchor="middle">NAND-Flash</text>
    </g>
    <path class="path" d="M179 153h27" marker-end="url(#arrow)"/>
    <g transform="translate(213 98)">
      <rect class="chip" width="84" height="110" rx="12"/>
      <text class="label" x="42" y="42" text-anchor="middle">PCIe</text>
      <text class="small" x="42" y="67" text-anchor="middle">NVMe</text>
      <path class="thin" d="M18 84h48M18 94h48"/>
    </g>
    <text class="label" x="24" y="277">Paralleler Host-Pfad</text>
    <text class="copy" x="24" y="306">NVMe-Kommandos über PCIe</text>
    <text class="copy" x="24" y="333">→ viele parallele Warteschlangen</text>
    <text class="copy" x="24" y="360">→ Potenzial für sehr kleine Latenz</text>
  </g>

  <g transform="translate(42 481)">
    <rect class="route" width="492" height="154" rx="15"/>
    <circle class="accent" cx="36" cy="36" r="13"/>
    <path d="m30 36 5 5 9-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="routeTitle" x="62" y="42">Viele kleine, zufällige Zugriffe</text>
    <text class="routeCopy" x="26" y="75">VMs, Datenbank, Build-Cache: Latenz und IOPS prüfen.</text>
    <path class="path" d="M28 104h254" marker-end="url(#arrow)"/>
    <rect class="badge" x="300" y="87" width="166" height="38" rx="19"/>
    <text class="badgeText" x="383" y="111" text-anchor="middle">NVMe-SSD prüfen</text>
  </g>
  <g transform="translate(566 481)">
    <rect class="route" width="492" height="154" rx="15"/>
    <circle class="accent" cx="36" cy="36" r="13"/>
    <path d="m30 36 5 5 9-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="routeTitle" x="62" y="42">Große, sequenzielle Datenmengen</text>
    <text class="routeCopy" x="26" y="75">Archiv, Backup-Ziel: Kapazität und Kosten prüfen.</text>
    <path class="path" d="M28 104h254" marker-end="url(#arrow)"/>
    <rect class="badge" x="300" y="87" width="166" height="38" rx="19"/>
    <text class="badgeText" x="383" y="111" text-anchor="middle">HDD prüfen</text>
  </g>

  <text class="small" x="550" y="661" text-anchor="middle">M.2 beschreibt die Bauform. Erst Protokoll und Verbindung zeigen, ob ein M.2-Laufwerk SATA oder NVMe nutzt.</text>
</svg>
