<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Engpass einer Backup-Pipeline</title>
  <desc id="desc">Vier Stationen zeigen Quellspeicher mit 180 Megabyte pro Sekunde, Backupserver mit 140 Megabyte pro Sekunde, Netzwerk mit 125 Megabyte pro Sekunde und Zielmedium mit 95 Megabyte pro Sekunde. Das Zielmedium ist als Engpass hervorgehoben.</desc>
  <defs>
    <style>
      .bg{fill:#f7f6f2}.station{fill:#fff;stroke:#e8e6e0;stroke-width:2}.bottleneck{fill:#fbffc2;stroke:#16794c;stroke-width:3}.title{fill:#25241f;font:700 24px Inter,system-ui,sans-serif}.label{fill:#25241f;font:700 16px Inter,system-ui,sans-serif}.meta{fill:#67645d;font:500 13px Inter,system-ui,sans-serif}.rate{fill:#25241f;font:700 22px Inter,system-ui,sans-serif}.flow{fill:none;stroke:#67645d;stroke-width:3;stroke-linecap:round}.tag{fill:#16794c}.tagtext{fill:#fff;font:700 11px Inter,system-ui,sans-serif;letter-spacing:.08em}.meterbg{fill:#e8e6e0}.meter{fill:#16794c}
      @media(prefers-color-scheme:dark){.bg{fill:#191917}.station{fill:#22221f;stroke:#3c3b36}.bottleneck{fill:#343522;stroke:#52c98b}.title,.label,.rate{fill:#f2f0e8}.meta{fill:#c4c0b5}.flow{stroke:#a39f94}.tag,.meter{fill:#52c98b}.meterbg{fill:#3c3b36}.tagtext{fill:#191917}}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#67645d"/></marker>
  </defs>
  <rect class="bg" width="1040" height="430" rx="18"/>
  <text class="title" x="36" y="50">Der langsamste Abschnitt bestimmt die Obergrenze</text>
  <text class="meta" x="36" y="76">Illustrative Messwerte einer seriellen Sicherungskette</text>
  <g transform="translate(35 115)">
    <g><rect class="station" width="205" height="180" rx="12"/><text class="label" x="20" y="36">Quellspeicher</text><text class="meta" x="20" y="60">liest Daten</text><text class="rate" x="20" y="104">180 MB/s</text><rect class="meterbg" x="20" y="132" width="165" height="10" rx="5"/><rect class="meter" x="20" y="132" width="165" height="10" rx="5"/></g>
    <path class="flow" d="M216 90h42" marker-end="url(#arrow)"/>
    <g transform="translate(270)"><rect class="station" width="205" height="180" rx="12"/><text class="label" x="20" y="36">Backupserver</text><text class="meta" x="20" y="60">prüft · komprimiert</text><text class="rate" x="20" y="104">140 MB/s</text><rect class="meterbg" x="20" y="132" width="165" height="10" rx="5"/><rect class="meter" x="20" y="132" width="128" height="10" rx="5"/></g>
    <path class="flow" d="M486 90h42" marker-end="url(#arrow)"/>
    <g transform="translate(540)"><rect class="station" width="205" height="180" rx="12"/><text class="label" x="20" y="36">Netzwerk</text><text class="meta" x="20" y="60">transportiert</text><text class="rate" x="20" y="104">125 MB/s</text><rect class="meterbg" x="20" y="132" width="165" height="10" rx="5"/><rect class="meter" x="20" y="132" width="115" height="10" rx="5"/></g>
    <path class="flow" d="M756 90h42" marker-end="url(#arrow)"/>
    <g transform="translate(810)"><rect class="bottleneck" width="165" height="180" rx="12"/><rect class="tag" x="20" y="18" width="84" height="24" rx="6"/><text class="tagtext" x="62" y="34" text-anchor="middle">ENGPASS</text><text class="label" x="20" y="70">Zielmedium</text><text class="meta" x="20" y="92">schreibt Daten</text><text class="rate" x="20" y="128">95 MB/s</text><rect class="meterbg" x="20" y="148" width="125" height="10" rx="5"/><rect class="meter" x="20" y="148" width="83" height="10" rx="5"/></g>
  </g>
  <text class="label" x="520" y="344" text-anchor="middle">Gesamtdurchsatz ≤ 95 MB/s</text>
  <text class="meta" x="520" y="371" text-anchor="middle">Mehr Netzwerkbandbreite allein beschleunigt diese Kette nicht.</text>
</svg>
