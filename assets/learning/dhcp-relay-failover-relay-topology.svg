<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-relay-topology-title diagram-relay-topology-desc">
  <title id="diagram-relay-topology-title">Relay verbindet Clientnetz und zentralen DHCP-Dienst</title>
  <desc id="diagram-relay-topology-desc">Der lokale Broadcast erreicht das Routerinterface. Der dort konfigurierte Relay-Agent leitet die Anfrage gezielt an die Server weiter und kennzeichnet das Ursprungsnetz.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Relay verbindet Clientnetz und zentralen DHCP-Dienst</tspan></text>
  <g class="diagram-zone client-net"><rect x="30" y="55" width="300" height="420" rx="18"/><text x="46" y="82">VLAN 20 · 192.168.20.0/24</text></g><g class="diagram-zone server-net"><rect x="620" y="55" width="310" height="420" rx="18"/><text x="636" y="82">Servernetz · 192.168.10.0/24</text></g><g class="diagram-edge broadcast"><path d="M165 250 L475 250"/><text class="diagram-edge-label" x="320" y="242" text-anchor="middle">lokaler Broadcast</text></g><g class="diagram-edge relay"><path d="M475 250 L775 170"/><text class="diagram-edge-label" x="625" y="202" text-anchor="middle">weitergeleitete Anfrage + Ursprungsnetz</text></g><g class="diagram-edge relay"><path d="M475 250 L775 335"/><text class="diagram-edge-label" x="625" y="284.5" text-anchor="middle">optional zweites Ziel</text></g><g class="diagram-node endpoint" transform="translate(165 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="165" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="165" dy="0">DHCP-Client</tspan></text><text class="diagram-node-detail" x="165" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="165" dy="0">startet mit lokalem</tspan><tspan x="165" dy="25">Discover</tspan></text><g class="diagram-node router" transform="translate(475 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="475" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="475" dy="0">Router mit Relay</tspan></text><text class="diagram-node-detail" x="475" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="475" dy="0">Relay am Interface</tspan><tspan x="475" dy="25">von VLAN 20</tspan></text><g class="diagram-node server" transform="translate(775 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="775" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="775" dy="0">DHCP-Server A</tspan></text><text class="diagram-node-detail" x="775" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="775" dy="0">besitzt Scope für</tspan><tspan x="775" dy="25">192.168.20.0/24</tspan></text><g class="diagram-node server" transform="translate(775 335)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="775" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="775" dy="0">DHCP-Server B</tspan></text><text class="diagram-node-detail" x="775" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="775" dy="0">Redundanzpartner je</tspan><tspan x="775" dy="25">nach Modell</tspan></text>
</svg>
