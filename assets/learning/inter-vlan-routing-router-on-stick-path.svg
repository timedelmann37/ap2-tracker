<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-router-on-stick-path-title diagram-router-on-stick-path-desc">
  <title id="diagram-router-on-stick-path-title">Router-on-a-Stick führt beide Richtungen über einen Trunk</title>
  <desc id="diagram-router-on-stick-path-desc">Client und Server liegen an Access-Ports in verschiedenen VLANs. Der Layer-2-Switch sendet den Verkehr getaggt zum Router. Dessen Subinterfaces sind die Gateways; der geroutete Verkehr läuft über denselben Trunk zurück.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Router-on-a-Stick führt beide Richtungen über einen Trunk</tspan></text>
  <g class="diagram-zone zone-vlan10"><rect x="30" y="85" width="255" height="175" rx="18"/><text x="46" y="112">VLAN 10 · Clients</text></g><g class="diagram-zone zone-vlan20"><rect x="30" y="315" width="255" height="175" rx="18"/><text x="46" y="342">VLAN 20 · Server</text></g><g class="diagram-zone zone-switching"><rect x="340" y="85" width="250" height="405" rx="18"/><text x="356" y="112">Layer 2</text></g><g class="diagram-zone zone-routing"><rect x="650" y="85" width="275" height="405" rx="18"/><text x="666" y="112">Layer 3</text></g><g class="diagram-edge access"><path d="M155 175 L465 290"/><text class="diagram-edge-label" x="310" y="224.5" text-anchor="middle">Access VLAN 10</text></g><g class="diagram-edge access"><path d="M155 405 L465 290"/><text class="diagram-edge-label" x="310" y="339.5" text-anchor="middle">Access VLAN 20</text></g><g class="diagram-edge trunk"><path d="M465 290 L785 290"/><text class="diagram-edge-label" x="625" y="282" text-anchor="middle">802.1Q-Trunk</text></g><g class="diagram-node client" transform="translate(155 175)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="155" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="155" dy="0">Client VLAN 10</tspan></text><text class="diagram-node-detail" x="155" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="155" dy="0">10.20.10.20</tspan></text><g class="diagram-node server" transform="translate(155 405)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="155" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="155" dy="0">Server VLAN 20</tspan></text><text class="diagram-node-detail" x="155" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="155" dy="0">10.20.20.50</tspan></text><g class="diagram-node switch" transform="translate(465 290)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="465" y="285" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="465" dy="0">L2-Switch</tspan></text><text class="diagram-node-detail" x="465" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="465" dy="0">Access + Trunk</tspan></text><g class="diagram-node router" transform="translate(785 290)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="785" y="285" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="785" dy="0">Router</tspan></text><text class="diagram-node-detail" x="785" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="785" dy="0">Subinterfaces</tspan><tspan x="785" dy="25">.10/.20</tspan></text>
</svg>
