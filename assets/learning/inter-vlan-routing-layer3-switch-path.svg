<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-layer3-switch-path-title diagram-layer3-switch-path-desc">
  <title id="diagram-layer3-switch-path-title">Beim Layer-3-Switch liegen die VLAN-Gateways auf SVIs</title>
  <desc id="diagram-layer3-switch-path-desc">Client und Server verwenden die SVI-Adressen des Layer-3-Switches als Default Gateways. Das Routing zwischen den VLANs bleibt im zentralen Switch; eine separate Firewall oder ein Router übernimmt den WAN- und Schutzübergang.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Beim Layer-3-Switch liegen die VLAN-Gateways auf SVIs</tspan></text>
  <g class="diagram-zone zone-vlan10"><rect x="30" y="85" width="255" height="175" rx="18"/><text x="46" y="112">VLAN 10 · Clients</text></g><g class="diagram-zone zone-vlan20"><rect x="30" y="315" width="255" height="175" rx="18"/><text x="46" y="342">VLAN 20 · Server</text></g><g class="diagram-zone zone-core"><rect x="350" y="85" width="260" height="405" rx="18"/><text x="366" y="112">LAN-Core</text></g><g class="diagram-zone zone-edge"><rect x="675" y="85" width="250" height="405" rx="18"/><text x="691" y="112">WAN-/Security-Übergang</text></g><g class="diagram-edge access"><path d="M155 175 L480 290"/><text class="diagram-edge-label" x="317.5" y="224.5" text-anchor="middle">VLAN 10</text></g><g class="diagram-edge access"><path d="M155 405 L480 290"/><text class="diagram-edge-label" x="317.5" y="339.5" text-anchor="middle">VLAN 20</text></g><g class="diagram-edge routed"><path d="M480 290 L800 290"/><text class="diagram-edge-label" x="640" y="282" text-anchor="middle">gerouteter Uplink</text></g><g class="diagram-node client" transform="translate(155 175)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="155" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="155" dy="0">Client VLAN 10</tspan></text><text class="diagram-node-detail" x="155" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="155" dy="0">GW 10.20.10.1</tspan></text><g class="diagram-node server" transform="translate(155 405)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="155" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="155" dy="0">Server VLAN 20</tspan></text><text class="diagram-node-detail" x="155" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="155" dy="0">GW 10.20.20.1</tspan></text><g class="diagram-node layer3-switch" transform="translate(480 290)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="285" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">L3-Switch</tspan></text><text class="diagram-node-detail" x="480" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">SVI 10 + SVI 20</tspan></text><g class="diagram-node firewall" transform="translate(800 290)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="800" y="285" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="800" dy="0">Firewall/Router</tspan></text><text class="diagram-node-detail" x="800" y="309" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="800" dy="0">WAN + Security</tspan></text>
</svg>
