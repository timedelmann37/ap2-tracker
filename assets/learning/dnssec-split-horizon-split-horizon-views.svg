<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-split-horizon-views-title diagram-split-horizon-views-desc">
  <title id="diagram-split-horizon-views-title">Ein Name, zwei kontrollierte Sichten</title>
  <desc id="diagram-split-horizon-views-desc">Interne Clients erhalten interne Ziele; externe Clients sehen ausschließlich öffentlich vorgesehene Datensätze.</desc>
