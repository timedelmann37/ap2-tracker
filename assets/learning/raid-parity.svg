<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">RAID-5-Daten und verteilte Parität</title>
  <desc id="desc">Vier Laufwerke enthalten Datenblöcke und jeweils an anderer Stelle einen Paritätsblock. Ein ausgefallenes drittes Laufwerk wird aus den übrigen drei rekonstruiert.</desc>
  <defs>
    <style>
      .bg{fill:#f4f4f2}.disk{fill:#fff;stroke:#c9cbc8;stroke-width:2}.head{fill:#183c42}.headText{fill:#fff;font:700 16px system-ui,sans-serif}.block{stroke:#fff;stroke-width:2}.dataA{fill:#9dd9df}.dataB{fill:#bed7f6}.dataC{fill:#d7c7f3}.parity{fill:#f3cf87}.label{fill:#1c1c1b;font:700 15px ui-monospace,monospace}.small{fill:#56554f;font:500 14px system-ui,sans-serif}.arrow{stroke:#127a86;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.fail{fill:#fff3f1;stroke:#c33f39;stroke-width:2;stroke-dasharray:7 5}.failText{fill:#a52f2a;font:700 14px system-ui,sans-serif}.note{fill:#127a86;font:700 15px system-ui,sans-serif}
      @media (prefers-color-scheme:dark){.bg{fill:#191b1a}.disk{fill:#242726;stroke:#4b504d}.label{fill:#f4f4f2}.small{fill:#c8cbc8}}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#127a86"/></marker>
  </defs>
  <rect class="bg" width="880" height="340" rx="18"/>
  <text class="note" x="32" y="34">RAID 5 · Parität wandert zwischen den Laufwerken</text>

  <g transform="translate(32 58)">
    <g><rect class="disk" width="150" height="224" rx="12"/><path class="head" d="M12 0h126a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0Z"/><text class="headText" x="75" y="30" text-anchor="middle">Laufwerk 1</text><rect class="block dataA" x="16" y="65" width="118" height="38" rx="5"/><text class="label" x="75" y="89" text-anchor="middle">A1</text><rect class="block dataB" x="16" y="111" width="118" height="38" rx="5"/><text class="label" x="75" y="135" text-anchor="middle">B1</text><rect class="block dataC" x="16" y="157" width="118" height="38" rx="5"/><text class="label" x="75" y="181" text-anchor="middle">C1</text></g>
    <g transform="translate(166)"><rect class="disk" width="150" height="224" rx="12"/><path class="head" d="M12 0h126a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0Z"/><text class="headText" x="75" y="30" text-anchor="middle">Laufwerk 2</text><rect class="block dataA" x="16" y="65" width="118" height="38" rx="5"/><text class="label" x="75" y="89" text-anchor="middle">A2</text><rect class="block dataB" x="16" y="111" width="118" height="38" rx="5"/><text class="label" x="75" y="135" text-anchor="middle">B2</text><rect class="block parity" x="16" y="157" width="118" height="38" rx="5"/><text class="label" x="75" y="181" text-anchor="middle">CP</text></g>
    <g transform="translate(332)"><rect class="fail" width="150" height="224" rx="12"/><path fill="#c33f39" d="M12 0h126a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0Z"/><text class="headText" x="75" y="30" text-anchor="middle">Laufwerk 3</text><path d="m54 91 42 42m0-42-42 42" stroke="#c33f39" stroke-width="7" stroke-linecap="round"/><text class="failText" x="75" y="181" text-anchor="middle">ausgefallen</text></g>
    <g transform="translate(498)"><rect class="disk" width="150" height="224" rx="12"/><path class="head" d="M12 0h126a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0Z"/><text class="headText" x="75" y="30" text-anchor="middle">Laufwerk 4</text><rect class="block parity" x="16" y="65" width="118" height="38" rx="5"/><text class="label" x="75" y="89" text-anchor="middle">AP</text><rect class="block dataB" x="16" y="111" width="118" height="38" rx="5"/><text class="label" x="75" y="135" text-anchor="middle">B3</text><rect class="block dataC" x="16" y="157" width="118" height="38" rx="5"/><text class="label" x="75" y="181" text-anchor="middle">C3</text></g>
  </g>

  <path class="arrow" d="M690 150h82" marker-end="url(#arrow)"/>
  <g transform="translate(784 104)"><rect class="disk" width="72" height="112" rx="10"/><text class="label" x="36" y="42" text-anchor="middle">A3</text><text class="label" x="36" y="67" text-anchor="middle">BP</text><text class="label" x="36" y="92" text-anchor="middle">C2</text></g>
  <text class="small" x="820" y="239" text-anchor="middle">Rebuild</text>
  <text class="small" x="32" y="315">Datenblöcke: A/B/C · P: Parität · Rekonstruktion aus den verbleibenden Blöcken</text>
</svg>
