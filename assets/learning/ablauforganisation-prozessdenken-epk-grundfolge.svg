<svg class="learning-diagram diagram-epk" xmlns="http://www.w3.org/2000/svg" width="560" height="490" viewBox="0 0 560 490" role="img" aria-labelledby="diagram-grundfolge-title diagram-grundfolge-desc">
  <title id="diagram-grundfolge-title">EPK: Zustand, Tätigkeit, Ergebnis</title>
  <desc id="diagram-grundfolge-desc">Anfrage ist eingegangen als Ereignis; Anfrage erfassen als Funktion; Anfrage ist erfasst als Ergebnisereignis. Pfeile weisen nach unten.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">EPK: Zustand, Tätigkeit, Ergebnis</tspan></text>
  <defs><marker id="epk-grundfolge-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--diagram-muted, #c8c1d2)"/></marker></defs><path class="epk-edge" d="M280 174 V205 H280 V236" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-grundfolge-arrow)"/><path class="epk-edge" d="M280 304 V335 H280 V366" fill="none" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2" marker-end="url(#epk-grundfolge-arrow)"/><g class="epk-node epk-event" data-node-id="eingang" transform="translate(280 140)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Anfrage ist eingegangen</tspan></text></g><g class="epk-node epk-function" data-node-id="erfassen" transform="translate(280 270)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><rect x="-140" y="-34" width="280" height="68" rx="12"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Anfrage erfassen</tspan></text></g><g class="epk-node epk-event" data-node-id="erfasst" transform="translate(280 400)"><g fill="var(--diagram-key, #342c40)" stroke="var(--diagram-muted, #c8c1d2)" stroke-width="2"><polygon points="-140,0 -118,-34 118,-34 140,0 118,34 -118,34"/></g><text fill="var(--diagram-text, #f1f0ec)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="0" y="6">Anfrage ist erfasst</tspan></text></g>
</svg>
