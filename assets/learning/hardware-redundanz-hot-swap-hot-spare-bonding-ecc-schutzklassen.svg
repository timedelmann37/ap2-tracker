rder, #5f526e)"/><text x="598" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="598" dy="0">ECC</tspan></text><text x="598" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="598" dy="0">Erkennt und</tspan><tspan x="598" dy="30">korrigiert bestimmte</tspan><tspan x="598" dy="30">Speicher-Bitfehler;</tspan></text></g><g><rect class="diagram-row" x="754" y="92" width="160" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="776" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="776" dy="0">NIC-Bond</tspan></text><text x="776" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="776" dy="0">Mehrere</tspan><tspan x="776" dy="30">Schnittstellen</tspan><tspan x="776" dy="30">bilden einen</tspan></text></g>
