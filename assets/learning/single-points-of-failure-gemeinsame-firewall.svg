<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="diagram-gemeinsame-firewall-title diagram-gemeinsame-firewall-desc">
  <title id="diagram-gemeinsame-firewall-title">Zwei Router, eine gemeinsame Firewall</title>
  <desc id="diagram-gemeinsame-firewall-desc">Router A und B führen beide durch eine einzelne Firewall zum Portal. Ihr Ausfall stoppt beide Wege.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Router, eine gemeinsame Firewall</tspan></text>
  <g class="diagram-edge allowed"><path d="M150 150 L460 250"/><text class="diagram-edge-label" x="305" y="192" text-anchor="middle">Pfad A</text></g><g class="diagram-edge allowed"><path d="M150 350 L460 250"/><text class="diagram-edge-label" x="305" y="292" text-anchor="middle">Pfad B</text></g><g class="diagram-edge allowed"><path d="M460 250 L780 250"/><text class="diagram-edge-label" x="620" y="242" text-anchor="middle">einziger Übergang</text></g><g class="diagram-node router" transform="translate(150 150)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Router A</tspan></text><text class="diagram-node-detail" x="150" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">Weg A</tspan></text><g class="diagram-node router" transform="translate(150 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Router B</tspan></text><text class="diagram-node-detail" x="150" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">Weg B</tspan></text><g class="diagram-node router" transform="translate(460 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="460" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="460" dy="0">Firewall</tspan></text><text class="diagram-node-detail" x="460" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="460" dy="0">gemeinsamer SPOF</tspan></text><g class="diagram-node server" transform="translate(780 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="780" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="780" dy="0">Portal</tspan></text><text class="diagram-node-detail" x="780" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="780" dy="0">benötigter Dienst</tspan></text>
</svg>
