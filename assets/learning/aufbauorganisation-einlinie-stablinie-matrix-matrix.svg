<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-matrix-title diagram-matrix-desc">
  <title id="diagram-matrix-title">Matrix: zwei Kompetenzachsen</title>
  <desc id="diagram-matrix-desc">Im eigenen Modell erhält die Fachkraft funktionale Vorgaben durch die Fachleitung sowie Projektvorgaben durch die Projektleitung. Zuständigkeiten und Konfliktlösung sind festzulegen.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Matrix: zwei Kompetenzachsen</tspan></text>
  <g class="diagram-edge "><path d="M240 150 L480 430"/><text class="diagram-edge-label" x="360" y="282" text-anchor="middle">Fachvorgaben</text></g><g class="diagram-edge "><path d="M720 150 L480 430"/><text class="diagram-edge-label" x="600" y="282" text-anchor="middle">Projektvorgaben</text></g><g class="diagram-node device" transform="translate(240 150)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="240" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="240" dy="0">Fachleitung</tspan></text><text class="diagram-node-detail" x="240" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="240" dy="0">Standards</tspan></text><g class="diagram-node device" transform="translate(720 150)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="720" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="720" dy="0">Projektleitung</tspan></text><text class="diagram-node-detail" x="720" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="720" dy="0">Projektziele</tspan></text><g class="diagram-node device" transform="translate(480 430)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Fachkraft</tspan></text><text class="diagram-node-detail" x="480" y="449" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">beide Achsen</tspan></text>
</svg>
