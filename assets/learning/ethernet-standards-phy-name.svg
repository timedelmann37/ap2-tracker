<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-labelledby="title desc">
  <title id="title">Eine PHY-Bezeichnung liefert drei erste Hinweise</title>
  <desc id="desc">Der vordere Teil bezeichnet die nominale Datenrate, BASE steht für Basisband und der Suffix kennzeichnet eine konkrete Medien- oder Reichweitenfamilie innerhalb von Ethernet.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Eine PHY-Bezeichnung liefert drei erste Hinweise</tspan></text>
  <g><rect x="42" y="82" width="876" height="82" rx="12" fill="#f8faf6" stroke="#cfd8d0"/><rect x="42" y="82" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">10G</tspan></text><text x="194" y="116" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">nominale PHY-Datenrate: 10 Gigabit pro Sekunde</tspan></text></g><g><rect x="42" y="182" width="876" height="82" rx="12" fill="#eef2ed" stroke="#cfd8d0"/><rect x="42" y="182" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">BASE</tspan></text><text x="194" y="216" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">Basisbandübertragung statt einer älteren</tspan><tspan x="194" dy="25">BROAD-Kennzeichnung</tspan></text></g><g><rect x="42" y="282" width="876" height="82" rx="12" fill="#f8faf6" stroke="#cfd8d0"/><rect x="42" y="282" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">T / SR / LR</tspan></text><text x="194" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">konkrete PHY-Familie: etwa Twisted Pair, Short Reach oder</tspan><tspan x="194" dy="25">Long Reach; Details stehen in der Spezifikation</tspan></text></g>
</svg>
