<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-ipv6-config-modes-title diagram-ipv6-config-modes-desc">
  <title id="diagram-ipv6-config-modes-title">Drei typische Konfigurationsmodelle</title>
  <desc id="diagram-ipv6-config-modes-desc">Router Advertisement bleibt in allen drei Modellen zentral; DHCPv6 übernimmt je nach Modus keine, ergänzende oder verwaltete Adressinformationen.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Drei typische Konfigurationsmodelle</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">SLAAC mit</tspan><tspan x="64" dy="25">RA-Optionen</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Adresse aus</tspan><tspan x="64" dy="30">angekündigtem /64;</tspan><tspan x="64" dy="30">Default Router aus</tspan></text></g><g><rect class="diagram-row" x="265" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="287" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="287" dy="0">SLAAC plus</tspan><tspan x="287" dy="25">stateless DHCPv6</tspan></text><text x="287" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="287" dy="0">Adresse per SLAAC;</tspan><tspan x="287" dy="30">weitere Angaben wie</tspan><tspan x="287" dy="30">DNS oder</tspan></text></g><g><rect class="diagram-row" x="488" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="510" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="510" dy="0">Stateful DHCPv6</tspan><tspan x="510" dy="25">plus RA</tspan></text><text x="510" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="510" dy="0">verwaltete Adresse</tspan><tspan x="510" dy="30">über DHCPv6 nach</tspan><tspan x="510" dy="30">M-Flag; Default</tspan></text></g><g><rect class="diagram-row" x="711" y="92" width="205" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="733" dy="0">NDP als Grundlage</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="733" dy="0">RS, RA, NS und NA</tspan><tspan x="733" dy="30">ermöglichen Router-</tspan><tspan x="733" dy="30">und Nachbarerkennung</tspan></text></g>
</svg>
