<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
  <title id="title">Sicherungs- und Restore-Ketten im Vergleich</title>
  <desc id="desc">Drei Zeilen vergleichen Vollsicherung, differenzielle und inkrementelle Sicherung von Montag bis Freitag. Pfeile kennzeichnen die Bezugsbasis, farbige Klammern die für einen Freitag-Restore benötigten Sätze.</desc>
  <defs>
    <style>
      .bg{fill:#f7f6f2}.panel{fill:#fff;stroke:#d2cfc7;stroke-width:1.5}.title{fill:#25241f;font:700 22px Inter,system-ui,sans-serif}.label{fill:#25241f;font:650 15px Inter,system-ui,sans-serif}.small{fill:#67645d;font:500 13px Inter,system-ui,sans-serif}.day{fill:#757169;font:650 12px Inter,system-ui,sans-serif;letter-spacing:.08em}.full{fill:#183c42}.diff{fill:#d7e7fa;stroke:#4478a9;stroke-width:1.5}.inc{fill:#f6e6be;stroke:#a06d16;stroke-width:1.5}.blocktext{fill:#fff;font:700 13px Inter,system-ui,sans-serif}.darktext{fill:#25241f;font:700 13px Inter,system-ui,sans-serif}.arrow{fill:none;stroke:#757169;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.restore{fill:none;stroke:#16794c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.restoreText{fill:#16794c;font:700 13px Inter,system-ui,sans-serif}
      @media(prefers-color-scheme:dark){.bg{fill:#191917}.panel{fill:#22221f;stroke:#4b4942}.title,.label{fill:#f2f0e8}.small,.day{fill:#c4c0b5}.diff{fill:#253747}.inc{fill:#46391e}.darktext{fill:#f2f0e8}.restoreText{fill:#52c98b}.restore{stroke:#52c98b}}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#757169"/></marker>
  </defs>
  <rect class="bg" width="1040" height="690" rx="18"/>
  <text class="title" x="36" y="46">Worauf bezieht sich der nächste Sicherungssatz?</text>
  <text class="small" x="36" y="72">Beispiel: Wiederherstellung des Stands von Freitagabend</text>
  <g transform="translate(250 95)">
    <text class="day" x="45" y="0" text-anchor="middle">MO</text><text class="day" x="185" y="0" text-anchor="middle">DI</text><text class="day" x="325" y="0" text-anchor="middle">MI</text><text class="day" x="465" y="0" text-anchor="middle">DO</text><text class="day" x="605" y="0" text-anchor="middle">FR</text>
  </g>

  <g transform="translate(28 118)">
    <rect class="panel" width="984" height="150" rx="12"/>
    <text class="label" x="24" y="34">Voll</text><text class="small" x="24" y="56">jeder Satz steht allein</text>
    <g transform="translate(222 24)">
      <rect class="full" width="90" height="58" rx="8"/><text class="blocktext" x="45" y="35" text-anchor="middle">ALLE</text>
      <rect class="full" x="140" width="90" height="58" rx="8"/><text class="blocktext" x="185" y="35" text-anchor="middle">ALLE</text>
      <rect class="full" x="280" width="90" height="58" rx="8"/><text class="blocktext" x="325" y="35" text-anchor="middle">ALLE</text>
      <rect class="full" x="420" width="90" height="58" rx="8"/><text class="blocktext" x="465" y="35" text-anchor="middle">ALLE</text>
      <rect class="full" x="560" width="90" height="58" rx="8"/><text class="blocktext" x="605" y="35" text-anchor="middle">ALLE</text>
      <path class="restore" d="M560 102v15h90v-15"/><text class="restoreText" x="605" y="139" text-anchor="middle">1 Satz laden</text>
    </g>
  </g>

  <g transform="translate(28 284)">
    <rect class="panel" width="984" height="176" rx="12"/>
    <text class="label" x="24" y="34">Differenziell</text><text class="small" x="24" y="56">seit letzter Vollsicherung</text>
    <g transform="translate(222 24)">
      <rect class="full" width="90" height="58" rx="8"/><text class="blocktext" x="45" y="35" text-anchor="middle">ALLE</text>
      <rect class="diff" x="140" width="90" height="58" rx="8"/><text class="darktext" x="185" y="35" text-anchor="middle">Δ DI</text>
      <rect class="diff" x="280" width="90" height="58" rx="8"/><text class="darktext" x="325" y="28" text-anchor="middle">Δ DI</text><text class="darktext" x="325" y="45" text-anchor="middle">+ MI</text>
      <rect class="diff" x="420" width="90" height="58" rx="8"/><text class="darktext" x="465" y="28" text-anchor="middle">Δ DI–DO</text>
      <rect class="diff" x="560" width="90" height="58" rx="8"/><text class="darktext" x="605" y="28" text-anchor="middle">Δ DI–FR</text>
      <path class="arrow" d="M140 92C110 120 70 120 48 63" marker-end="url(#arrow)"/><path class="arrow" d="M280 92C220 136 90 136 48 63" marker-end="url(#arrow)"/><path class="arrow" d="M420 92C330 150 110 150 48 63" marker-end="url(#arrow)"/><path class="arrow" d="M560 92C440 164 130 164 48 63" marker-end="url(#arrow)"/>
      <path class="restore" d="M0 130v16h650v-16M94 146h422"/><text class="restoreText" x="325" y="168" text-anchor="middle">Voll + letztes Differenzial</text>
    </g>
  </g>

  <g transform="translate(28 476)">
    <rect class="panel" width="984" height="184" rx="12"/>
    <text class="label" x="24" y="34">Inkrementell</text><text class="small" x="24" y="56">seit vorherigem Satz</text>
    <g transform="translate(222 24)">
      <rect class="full" width="90" height="58" rx="8"/><text class="blocktext" x="45" y="35" text-anchor="middle">ALLE</text>
      <rect class="inc" x="140" width="90" height="58" rx="8"/><text class="darktext" x="185" y="35" text-anchor="middle">Δ DI</text>
      <rect class="inc" x="280" width="90" height="58" rx="8"/><text class="darktext" x="325" y="35" text-anchor="middle">Δ MI</text>
      <rect class="inc" x="420" width="90" height="58" rx="8"/><text class="darktext" x="465" y="35" text-anchor="middle">Δ DO</text>
      <rect class="inc" x="560" width="90" height="58" rx="8"/><text class="darktext" x="605" y="35" text-anchor="middle">Δ FR</text>
      <path class="arrow" d="M137 29H96" marker-end="url(#arrow)"/><path class="arrow" d="M277 29H236" marker-end="url(#arrow)"/><path class="arrow" d="M417 29H376" marker-end="url(#arrow)"/><path class="arrow" d="M557 29H516" marker-end="url(#arrow)"/>
      <path class="restore" d="M0 104v18h650v-18"/><text class="restoreText" x="325" y="148" text-anchor="middle">Voll + alle folgenden Inkremente</text>
    </g>
  </g>
</svg>
