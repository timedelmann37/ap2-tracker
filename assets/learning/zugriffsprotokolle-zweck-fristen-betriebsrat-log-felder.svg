<svg class="learning-diagram diagram-layers" xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-labelledby="diagram-log-felder-title diagram-log-felder-desc">
  <title id="diagram-log-felder-title">Ein Ereignis, fünf Prüffragen</title>
  <desc id="diagram-log-felder-desc">Erfundenes Ereignis mit Zeit und Zeitzone, Konto, Ziel, Aktion und verweigertem Ergebnis; kein Nachweis eines erfolgreichen Exports.</desc>
