<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-schwellen-title diagram-schwellen-desc">
  <title id="diagram-schwellen-title">200 und 201 verändern nicht dasselbe</title>
