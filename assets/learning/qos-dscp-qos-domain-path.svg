<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-qos-domain-path-title diagram-qos-domain-path-desc">
  <title id="diagram-qos-domain-path-title">Jede administrative Grenze kann DSCP neu bewerten</title>
  <desc id="diagram-qos-domain-path-desc">Ein Telefon und ein Backup-Client senden zum Unternehmensrand. Im eigenen Netz gilt eine bekannte Policy. Der Provider übernimmt, ändert oder ignoriert die Markierung nur nach seinem Vertrag; das Internet verspricht kein identisches Verhalten.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Jede administrative Grenze kann DSCP neu bewerten</tspan></text>
  <g class="diagram-zone zone-customer"><rect x="25" y="80" width="535" height="350" rx="18"/><text x="41" y="107">Eigene QoS-Domäne</text></g><g class="diagram-zone zone-provider"><rect x="610" y="80" width="320" height="350" rx="18"/><text x="626" y="107">Provider-Domäne</text></g><g class="diagram-edge priority"><path d="M135 165 L385 250"/><text class="diagram-edge-label" x="260" y="199.5" text-anchor="middle">Sprache</text></g><g class="diagram-edge default"><path d="M135 335 L385 250"/><text class="diagram-edge-label" x="260" y="284.5" text-anchor="middle">Best Effort</text></g><g class="diagram-edge boundary"><path d="M385 250 L750 190"/><text class="diagram-edge-label" x="567.5" y="212" text-anchor="middle">vertragliche Klasse?</text></g><g class="diagram-edge boundary"><path d="M385 250 L750 345"/><text class="diagram-edge-label" x="567.5" y="289.5" text-anchor="middle">Markierung ohne Garantie</text></g><g class="diagram-node phone" transform="translate(135 165)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="135" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="135" dy="0">VoIP-Telefon</tspan></text><text class="diagram-node-detail" x="135" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="135" dy="0">latenz- und</tspan><tspan x="135" dy="25">jitterempfindlich</tspan></text><g class="diagram-node client" transform="translate(135 335)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="135" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="135" dy="0">Backup-Client</tspan></text><text class="diagram-node-detail" x="135" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="135" dy="0">durchsatzorientiert</tspan></text><g class="diagram-node switch" transform="translate(385 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="385" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="385" dy="0">Policy-Grenze</tspan></text><text class="diagram-node-detail" x="385" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="385" dy="0">klassifizieren und</tspan><tspan x="385" dy="25">markieren</tspan></text><g class="diagram-node router" transform="translate(750 190)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="750" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="750" dy="0">Provider Edge</tspan></text><text class="diagram-node-detail" x="750" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="750" dy="0">SLA/Policy</tspan><tspan x="750" dy="25">entscheidet</tspan></text><g class="diagram-node cloud" transform="translate(750 345)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="750" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="750" dy="0">Internetpfad</tspan></text><text class="diagram-node-detail" x="750" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="750" dy="0">keine eigene</tspan><tspan x="750" dy="25">Zusicherung</tspan></text>
</svg>
