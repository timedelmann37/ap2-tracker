<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-dmz-publication-path-title diagram-dmz-publication-path-desc">
  <title id="diagram-dmz-publication-path-title">DNAT führt nur den ausgewählten Dienst in die DMZ</title>
  <desc id="diagram-dmz-publication-path-desc">Ein Internetclient erreicht die öffentliche Zielkombination der Firewall. Diese übersetzt sie auf den HTTPS-Dienst des Webservers in der DMZ. Das interne Netz bleibt ein getrenntes Segment ohne diese Veröffentlichung.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">DNAT führt nur den ausgewählten Dienst in die DMZ</tspan></text>
  <g class="diagram-zone zone-external"><rect x="24" y="90" width="235" height="360" rx="18"/><text x="40" y="117">Internet</text></g><g class="diagram-zone zone-edge"><rect x="300" y="90" width="280" height="360" rx="18"/><text x="316" y="117">Netzübergang</text></g><g class="diagram-zone zone-dmz"><rect x="625" y="90" width="305" height="205" rx="18"/><text x="641" y="117">DMZ</text></g><g class="diagram-zone zone-internal"><rect x="625" y="325" width="305" height="125" rx="18"/><text x="641" y="352">Internes Netz</text></g><g class="diagram-edge public-request"><path d="M140 235 L440 235"/><text class="diagram-edge-label" x="290" y="227" text-anchor="middle">TCP 8443</text></g><g class="diagram-edge translated-request"><path d="M440 235 L775 200"/><text class="diagram-edge-label" x="607.5" y="209.5" text-anchor="middle">DNAT auf 443</text></g><g class="diagram-edge segmented"><path d="M775 390 L440 235"/><text class="diagram-edge-label" x="607.5" y="304.5" text-anchor="middle">separates Segment</text></g><g class="diagram-node client" transform="translate(140 235)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="140" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="140" dy="0">Internetclient</tspan></text><text class="diagram-node-detail" x="140" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="140" dy="0">198.51.100.44</tspan></text><g class="diagram-node firewall" transform="translate(440 235)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="440" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="440" dy="0">Firewall/NAT</tspan></text><text class="diagram-node-detail" x="440" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="440" dy="0">203.0.113.10</tspan></text><g class="diagram-node server" transform="translate(775 200)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="775" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="775" dy="0">DMZ-Webserver</tspan></text><text class="diagram-node-detail" x="775" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="775" dy="0">10.20.30.10:443</tspan></text><g class="diagram-node client" transform="translate(775 390)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="775" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="775" dy="0">Interner Client</tspan></text><text class="diagram-node-detail" x="775" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="775" dy="0">nicht veröffentlicht</tspan></text>
</svg>
