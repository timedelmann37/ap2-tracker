<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-rollenweg-und-direktgrant-title diagram-rollenweg-und-direktgrant-desc">
  <title id="diagram-rollenweg-und-direktgrant-title">Zwei Wege zum Recht im angenommenen System</title>
  <desc id="diagram-rollenweg-und-direktgrant-desc">Oben erhält Lea Lesen auf Prüfprotokolle über die zugewiesene Rolle Prüfteam. Unten besitzt dasselbe Konto zusätzlich einen individuellen Grant zum Lesen des Projektarchivs. Der untere Weg gehört nicht zum reinen RBAC-Modell und muss im Review separat erfasst werden.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Wege zum Recht im angenommenen System</tspan></text>
  <g class="diagram-zone "><rect x="42" y="88" width="876" height="164" rx="18"/><text x="58" y="115">RBAC-Rollenpfad</text></g><g class="diagram-zone "><rect x="42" y="273" width="876" height="164" rx="18"/><text x="58" y="300">Zusätzlicher direkter Vergabeweg</text></g><g class="diagram-edge "><path d="M140 170 L455 170"/><text class="diagram-edge-label" x="297.5" y="162" text-anchor="middle">zugewiesen</text></g><g class="diagram-edge "><path d="M455 170 L780 170"/><text class="diagram-edge-label" x="617.5" y="162" text-anchor="middle">Rollenrecht</text></g><g class="diagram-edge "><path d="M140 355 L455 355"/><text class="diagram-edge-label" x="297.5" y="347" text-anchor="middle">individuell</text></g><g class="diagram-edge "><path d="M455 355 L780 355"/><text class="diagram-edge-label" x="617.5" y="347" text-anchor="middle">Zusatzrecht</text></g><g class="diagram-node client" transform="translate(140 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="140" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="140" dy="0">Lea</tspan></text><text class="diagram-node-detail" x="140" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="140" dy="0">Konto</tspan></text><g class="diagram-node server" transform="translate(455 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="455" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="455" dy="0">Prüfteam</tspan></text><text class="diagram-node-detail" x="455" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="455" dy="0">Rolle</tspan></text><g class="diagram-node allowed" transform="translate(780 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="780" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="780" dy="0">Lesen</tspan></text><text class="diagram-node-detail" x="780" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="780" dy="0">Prüfprotokoll</tspan></text><g class="diagram-node client" transform="translate(140 355)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="140" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="140" dy="0">Lea</tspan></text><text class="diagram-node-detail" x="140" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="140" dy="0">dasselbe Konto</tspan></text><g class="diagram-node server" transform="translate(455 355)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="455" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="455" dy="0">Einzelgrant</tspan></text><text class="diagram-node-detail" x="455" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="455" dy="0">direkt am Konto</tspan></text><g class="diagram-node allowed" transform="translate(780 355)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="780" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="780" dy="0">Lesen</tspan></text><text class="diagram-node-detail" x="780" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="780" dy="0">Projektarchiv</tspan></text>
