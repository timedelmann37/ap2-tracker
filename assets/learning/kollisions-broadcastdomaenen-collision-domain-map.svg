  <title id="diagram-collision-domain-map-title">Drei Kollisionsdomänen im Prüfungsmodell</title>
  <desc id="diagram-collision-domain-map-desc">PC A und PC B teilen sich mit dem Hub und seinem Uplink die Kollisionsdomäne C1. Der Direktlink von PC C zum Switch ist C2, der Link zwischen Switch und Router ist C3.</desc>
