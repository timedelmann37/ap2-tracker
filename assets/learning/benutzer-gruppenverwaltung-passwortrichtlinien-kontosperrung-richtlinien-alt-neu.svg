<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-richtlinien-alt-neu-title diagram-richtlinien-alt-neu-desc">
  <title id="diagram-richtlinien-alt-neu-title">Passwortpolitik: Altregel und Zielvorgabe</title>
  <desc id="diagram-richtlinien-alt-neu-desc">Vergleich einer fiktiven älteren Richtlinie mit einer an NIST SP 800-63B-4 orientierten Ein-Faktor-Zielvorgabe. Das Diagramm behauptet keine Linux-Standardeinstellung.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Passwortpolitik: Altregel und Zielvorgabe</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="429" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Altregel</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">8 Zeichen · vier Zeichentypen · Wechsel</tspan><tspan x="64" dy="30">alle 90 Tage</tspan></text></g><g><rect class="diagram-row" x="489" y="92" width="429" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="511" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="511" dy="0">NIST-orientiert</tspan></text><text x="511" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="511" dy="0">Ab 15 Zeichen · Blocklist · Rate-Limit ·</tspan><tspan x="511" dy="30">Wechsel bei Kompromittierung</tspan></text></g>
</svg>
