<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-link-variants-title diagram-link-variants-desc">
  <title id="diagram-link-variants-title">Gleicher Modulsteckplatz, unterschiedliche Strecken</title>
