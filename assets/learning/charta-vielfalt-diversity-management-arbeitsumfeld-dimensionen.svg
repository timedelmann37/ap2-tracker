<svg class="learning-diagram diagram-layers" xmlns="http://www.w3.org/2000/svg" width="960" height="812" viewBox="0 0 960 812" role="img" aria-labelledby="diagram-dimensionen-title diagram-dimensionen-desc">
  <title id="diagram-dimensionen-title">Sieben Dimensionen — keine Schubladen</title>
  <desc id="diagram-dimensionen-desc">Die Dimensionen sensibilisieren für Barrieren. Sie bestimmen nicht die Kompetenz einer einzelnen Person.</desc>
