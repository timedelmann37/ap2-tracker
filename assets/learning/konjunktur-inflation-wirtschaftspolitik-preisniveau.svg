<svg class="learning-diagram diagram-layers" xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-labelledby="diagram-preisniveau-title diagram-preisniveau-desc">
  <title id="diagram-preisniveau-title">Preisniveau steigt, Inflationsrate sinkt</title>
