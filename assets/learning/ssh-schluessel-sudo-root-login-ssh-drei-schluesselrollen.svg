<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-ssh-drei-schluesselrollen-title diagram-ssh-drei-schluesselrollen-desc">
  <title id="diagram-ssh-drei-schluesselrollen-title">Drei Rollen von SSH-Schlüsseln</title>
  <desc id="diagram-ssh-drei-schluesselrollen-desc">Technische Gegenüberstellung: Der private Benutzerschlüssel bleibt beim Client, der öffentliche Benutzerschlüssel wird dem Konto auf dem Server zugeordnet und ein separater Hostschlüssel weist die Serveridentität nach.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Drei Rollen von SSH-Schlüsseln</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Benutzer: privat</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Bleibt auf dem Client.</tspan><tspan x="64" dy="30">Signiert die Anmeldung;</tspan><tspan x="64" dy="30">Passphrase schützt Datei.</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">Benutzer: öffentlich</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Liegt beim Zielkonto in</tspan><tspan x="362" dy="30">authorized_keys. Server</tspan><tspan x="362" dy="30">prüft damit die Signatur.</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Server: Hostkey</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Identifiziert die</tspan><tspan x="660" dy="30">Gegenstelle. Fingerprint vor</tspan><tspan x="660" dy="30">Vertrauen unabhängig prüfen.</tspan></text></g>
</svg>
