<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-verfuegbarkeitsstufen-title diagram-verfuegbarkeitsstufen-desc">
  <title id="diagram-verfuegbarkeitsstufen-title">Drei Ziele, ein Jahr mit 365 Tagen</title>
  <desc id="diagram-verfuegbarkeitsstufen-desc">Je höher die Zielverfügbarkeit, desto kleiner der erlaubte Zeitanteil ohne Dienst.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Drei Ziele, ein Jahr mit 365 Tagen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">99,9 %</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">0,1 % Ausfallanteil: 525,6</tspan><tspan x="64" dy="30">Minuten im Jahr (8 h 45 min</tspan><tspan x="64" dy="30">36 s); 43,2 Minuten in einem</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">99,95 %</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">0,05 % Ausfallanteil: 262,8</tspan><tspan x="362" dy="30">Minuten im Jahr (4 h 22 min</tspan><tspan x="362" dy="30">48 s); 21,6 Minuten in einem</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">99,99 %</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">0,01 % Ausfallanteil: 52,56</tspan><tspan x="660" dy="30">Minuten im Jahr (52 min 33,6</tspan><tspan x="660" dy="30">s); 4,32 Minuten in einem</tspan></text></g>
</svg>
