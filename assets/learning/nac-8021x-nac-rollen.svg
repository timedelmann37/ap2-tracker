<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="diagram-nac-rollen-title diagram-nac-rollen-desc">
  <title id="diagram-nac-rollen-title">Nachweis und Durchsetzung</title>
  <desc id="diagram-nac-rollen-desc">EAPOL verbindet Notebook und Switch; RADIUS verbindet Switch und Prüfserver. Der Switch setzt die eingeschränkte Rolle um.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Nachweis und Durchsetzung</tspan></text>
  <g class="diagram-edge allowed"><path d="M130 170 L430 170"/><text class="diagram-edge-label" x="280" y="162" text-anchor="middle">EAPOL</text></g><g class="diagram-edge allowed"><path d="M430 170 L750 170"/><text class="diagram-edge-label" x="590" y="162" text-anchor="middle">RADIUS</text></g><g class="diagram-edge allowed"><path d="M430 170 L430 350"/><text class="diagram-edge-label" x="430" y="252" text-anchor="middle">Rolle / ACL</text></g><g class="diagram-node client" transform="translate(130 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="130" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="130" dy="0">Notebook</tspan></text><text class="diagram-node-detail" x="130" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="130" dy="0">Supplicant</tspan></text><g class="diagram-node switch" transform="translate(430 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="430" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="430" dy="0">Switch</tspan></text><text class="diagram-node-detail" x="430" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="430" dy="0">Authenticator</tspan></text><g class="diagram-node server" transform="translate(750 170)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="750" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="750" dy="0">RADIUS</tspan></text><text class="diagram-node-detail" x="750" y="189" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="750" dy="0">Prüfserver</tspan></text><g class="diagram-node server" transform="translate(430 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="430" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="430" dy="0">Reparatur</tspan></text><text class="diagram-node-detail" x="430" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="430" dy="0">begrenzte Ziele</tspan></text>
</svg>
