<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-broadcast-domain-map-title diagram-broadcast-domain-map-desc">
  <title id="diagram-broadcast-domain-map-title">Zwei VLANs bleiben über den Trunk getrennt</title>
  <desc id="diagram-broadcast-domain-map-desc">Die logische Sicht zeigt VLAN 10 als Broadcastdomäne B1 und VLAN 20 als Broadcastdomäne B2. Der Trunk transportiert beide VLANs, verschmilzt sie aber nicht. Das Layer-3-Gateway routet zwischen ihnen und begrenzt Layer-2-Broadcasts.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei VLANs bleiben über den Trunk getrennt</tspan></text>
  <g class="diagram-zone broadcast"><rect x="42" y="82" width="876" height="178" rx="18"/><text x="58" y="109">B1 · VLAN 10</text></g><g class="diagram-zone broadcast"><rect x="42" y="292" width="876" height="178" rx="18"/><text x="58" y="319">B2 · VLAN 20</text></g><g class="diagram-edge "><path d="M135 180 L365 180"/></g><g class="diagram-edge trunk"><path d="M365 180 L595 180"/><text class="diagram-edge-label" x="480" y="172" text-anchor="middle">Trunk · VLAN 10</text></g><g class="diagram-edge "><path d="M595 180 L825 180"/></g><g class="diagram-edge "><path d="M135 390 L365 390"/></g><g class="diagram-edge trunk"><path d="M365 390 L595 390"/><text class="diagram-edge-label" x="480" y="382" text-anchor="middle">Trunk · VLAN 20</text></g><g class="diagram-edge "><path d="M595 390 L825 390"/></g><g class="diagram-edge trunk"><path d="M365 180 L480 520"/></g><g class="diagram-edge trunk"><path d="M365 390 L480 520"/></g><g class="diagram-node endpoint" transform="translate(135 180)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="135" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="135" dy="0">Host A</tspan></text><text class="diagram-node-detail" x="135" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="135" dy="0">VLAN 10</tspan></text><g class="diagram-node switch" transform="translate(365 180)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="365" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="365" dy="0">Switch 1</tspan></text><text class="diagram-node-detail" x="365" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="365" dy="0">VLAN 10</tspan></text><g class="diagram-node switch" transform="translate(595 180)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="595" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="595" dy="0">Switch 2</tspan></text><text class="diagram-node-detail" x="595" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="595" dy="0">VLAN 10</tspan></text><g class="diagram-node endpoint" transform="translate(825 180)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="825" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="825" dy="0">Host B</tspan></text><text class="diagram-node-detail" x="825" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="825" dy="0">VLAN 10</tspan></text><g class="diagram-node endpoint" transform="translate(135 390)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="135" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="135" dy="0">Host C</tspan></text><text class="diagram-node-detail" x="135" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="135" dy="0">VLAN 20</tspan></text><g class="diagram-node switch" transform="translate(365 390)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="365" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="365" dy="0">Switch 1</tspan></text><text class="diagram-node-detail" x="365" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="365" dy="0">VLAN 20</tspan></text><g class="diagram-node switch" transform="translate(595 390)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="595" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="595" dy="0">Switch 2</tspan></text><text class="diagram-node-detail" x="595" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="595" dy="0">VLAN 20</tspan></text><g class="diagram-node endpoint" transform="translate(825 390)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="825" y="385" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="825" dy="0">Host D</tspan></text><text class="diagram-node-detail" x="825" y="409" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="825" dy="0">VLAN 20</tspan></text><g class="diagram-node router" transform="translate(480 520)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="515" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">L3-Gateway</tspan></text><text class="diagram-node-detail" x="480" y="539" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1