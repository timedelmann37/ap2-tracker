<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Entscheidungsraum für Unternehmensziele und Zielkonflikte</title>
  <desc id="desc">Eine betriebliche Maßnahme wird durch drei Prüflinsen betrachtet: wirtschaftliche Tragfähigkeit, ökologische Wirkung und soziale Wirkung. Erst werden Wirkungen und Betroffene benannt, dann Zielbeziehungen geprüft und schließlich eine Alternative mit Ausgleich und Prüfkriterium festgelegt.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#26342e"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #1f2925; }
      .eyebrow { font-size: 17px; font-weight: 750; letter-spacing: 1.8px; fill: #997220; }
      .title { font-size: 34px; font-weight: 760; }
      .lead { font-size: 18px; fill: #52605a; }
      .card-title { font-size: 23px; font-weight: 750; }
      .card-copy { font-size: 17px; fill: #3d4b45; }
      .step { font-size: 18px; font-weight: 730; }
      .step-copy { font-size: 15px; fill: #52605a; }
      .tag { font-size: 14px; font-weight: 760; letter-spacing: .5px; }
      .measure-eyebrow { font-size: 15px; font-weight: 750; letter-spacing: 1.4px; fill: #f3cf78; }
      .measure-title { font-size: 21px; font-weight: 720; fill: #ffffff; }
      .circle-number { font-size: 17px; font-weight: 760; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="30" fill="#f7f4ec"/>
  <text class="eyebrow" x="70" y="64" fill="#997220">ZIELKONFLIKTE PRÜFEN</text>
  <text class="title" x="70" y="108">Eine Maßnahme – drei Wirkungen</text>
  <text class="lead" x="70" y="140">Nicht die Zielart entscheidet über Harmonie oder Konflikt, sondern die konkrete Wirkung im Szenario.</text>

  <rect x="56" y="181" width="326" height="232" rx="22" fill="#fffdf8" stroke="#c8ae70" stroke-width="2"/>
  <circle cx="96" cy="224" r="18" fill="#e4b854"/>
  <path d="M88 230 L96 216 L104 230 Z" fill="#4a3816"/>
  <text class="card-title" x="126" y="232">Ökonomisch</text>
  <text class="card-copy" x="84" y="278">Tragfähigkeit sichern:</text>
  <text class="card-copy" x="84" y="310">Kosten, Erlöse, Liquidität,</text>
  <text class="card-copy" x="84" y="342">Produktivität, Qualität und</text>
  <text class="card-copy" x="84" y="374">dauerhafte Wettbewerbsfähigkeit.</text>

  <rect x="437" y="181" width="326" height="232" rx="22" fill="#fffdf8" stroke="#86a98e" stroke-width="2"/>
  <circle cx="477" cy="224" r="18" fill="#9bc4a3"/>
  <path d="M468 228 C474 211 487 211 486 228 C481 223 475 224 468 228 Z" fill="#244f35"/>
  <text class="card-title" x="507" y="232">Ökologisch</text>
  <text class="card-copy" x="465" y="278">Umweltwirkungen senken:</text>
  <text class="card-copy" x="465" y="310">Energie, Material, Emissionen,</text>
  <text class="card-copy" x="465" y="342">Abfall und Lebenszyklus von</text>
  <text class="card-copy" x="465" y="374">Produkten und Infrastruktur.</text>

  <rect x="818" y="181" width="326" height="232" rx="22" fill="#fffdf8" stroke="#92aab5" stroke-width="2"/>
  <circle cx="858" cy="224" r="18" fill="#abc7d3"/>
  <circle cx="858" cy="219" r="5" fill="#284653"/>
  <path d="M849 233 C850 225 866 225 867 233" fill="none" stroke="#284653" stroke-width="4" stroke-linecap="round"/>
  <text class="card-title" x="888" y="232">Sozial</text>
  <text class="card-copy" x="846" y="278">Menschen berücksichtigen:</text>
  <text class="card-copy" x="846" y="310">Gesundheit, Sicherheit, faire</text>
  <text class="card-copy" x="846" y="342">Chancen, gute Arbeit, Lernen</text>
  <text class="card-copy" x="846" y="374">und Auswirkungen auf Betroffene.</text>

  <path d="M219 413 C235 456 314 462 392 475" fill="none" stroke="#26342e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 413 L600 470" fill="none" stroke="#26342e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M981 413 C965 456 886 462 808 475" fill="none" stroke="#26342e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="405" y="456" width="390" height="92" rx="46" fill="#26342e"/>
  <text class="measure-eyebrow" x="600" y="491" text-anchor="middle">KONKRETE MASSNAHME</text>
  <text class="measure-title" x="600" y="524" text-anchor="middle">Wirkung je Dimension benennen</text>

  <rect x="56" y="590" width="326" height="112" rx="18" fill="#ffffff" stroke="#d8d2c4"/>
  <circle cx="92" cy="626" r="18" fill="#26342e"/>
  <text class="circle-number" x="92" y="632" text-anchor="middle">1</text>
  <text class="step" x="122" y="631">Wirkung prüfen</text>
  <text class="step-copy" x="84" y="665">Was wird gefördert oder belastet?</text>
  <text class="step-copy" x="84" y="688">Kurzfristig und langfristig trennen.</text>

  <rect x="437" y="590" width="326" height="112" rx="18" fill="#ffffff" stroke="#d8d2c4"/>
  <circle cx="473" cy="626" r="18" fill="#26342e"/>
  <text class="circle-number" x="473" y="632" text-anchor="middle">2</text>
  <text class="step" x="503" y="631">Beziehung benennen</text>
  <text class="step-copy" x="465" y="665">Harmonie, Konflikt oder im Fall</text>
  <text class="step-copy" x="465" y="688">keine relevante Wechselwirkung?</text>

  <rect x="818" y="590" width="326" height="112" rx="18" fill="#ffffff" stroke="#d8d2c4"/>
  <circle cx="854" cy="626" r="18" fill="#26342e"/>
  <text class="circle-number" x="854" y="632" text-anchor="middle">3</text>
  <text class="step" x="884" y="631">Ausgleich festlegen</text>
  <text class="step-copy" x="846" y="665">Alternative, Schutzmaßnahme und</text>
  <text class="step-copy" x="846" y="688">beobachtbares Prüfkriterium nennen.</text>

  <path d="M382 646 L425 646" stroke="#26342e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M763 646 L806 646" stroke="#26342e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="461" y="718" width="278" height="28" rx="14" fill="#efe3c2"/>
  <text class="tag" x="600" y="737" text-anchor="middle" fill="#604816">BEGRÜNDEN STATT NUR ZUORDNEN</text>
</svg>
