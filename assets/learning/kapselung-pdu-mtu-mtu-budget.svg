<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">1500 Byte MTU sind ein Größenbudget für das IP-Paket</title>
  <desc id="desc">Bei IPv4 und TCP ohne Optionen bleiben von 1500 Byte IP-Paketgröße nach 20 Byte IPv4-Header und 20 Byte TCP-Header höchstens 1460 Byte für Anwendungsdaten.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">1500 Byte MTU sind ein Größenbudget für das IP-Paket</tspan></text>
  <g><rect x="42" y="92" width="280" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="64" dy="0">IPv4-Header</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="64" dy="0">20 Byte Mindestgröße ohne</tspan><tspan x="64" dy="30">IPv4-Optionen</tspan></text></g><g><rect x="340" y="92" width="280" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="362" dy="0">TCP-Header</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="362" dy="0">20 Byte Mindestgröße ohne</tspan><tspan x="362" dy="30">TCP-Optionen</tspan></text></g><g><rect x="638" y="92" width="280" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="660" dy="0">Anwendungsdaten</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="660" dy="0">1460 Byte verbleiben im</tspan><tspan x="660" dy="30">vereinfachten Beispiel</tspan></text></g>
</svg>
