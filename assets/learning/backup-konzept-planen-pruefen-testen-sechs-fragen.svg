<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-sechs-fragen-title diagram-sechs-fragen-desc">
  <title id="diagram-sechs-fragen-title">Sechs Fragen, die im schriftlichen Plan stehen müssen</title>
  <desc id="diagram-sechs-fragen-desc">Eigene Prüfgrafik. Eine Antwort ohne überprüfbare Details ist noch kein ausführbarer Plan.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Sechs Fragen, die im schriftlichen Plan stehen müssen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="131" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Was?</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Systeme, Daten,</tspan><tspan x="64" dy="30">Konfiguration,</tspan><tspan x="64" dy="30">Schlüssel und</tspan></text></g><g><rect class="diagram-row" x="191" y="92" width="131" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="213" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="213" dy="0">Wie oft?</tspan></text><text x="213" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="213" dy="0">Art und Zeitplan aus</tspan><tspan x="213" dy="30">RPO, Änderungsrate</tspan><tspan x="213" dy="30">und gemessenem</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="131" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">Wohin?</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Getrennte</tspan><tspan x="362" dy="30">Speicherziele,</tspan><tspan x="362" dy="30">Standort, Schutz</tspan></text></g><g><rect class="diagram-row" x="489" y="92" width="131" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="511" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="511" dy="0">Wie lange?</tspan></text><text x="511" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="511" dy="0">Versionen,</tspan><tspan x="511" dy="30">Aufbewahrungsfristen,</tspan><tspan x="511" dy="30">Ablauf, Löschung und</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="131" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Wer?</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Fachfreigabe,</tspan><tspan x="660" dy="30">Jobkontrolle,</tspan><tspan x="660" dy="30">Alarmierung,</tspan></text></g><g><rect class="diagram-row" x="787" y="92" width="131" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="809" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="809" dy="0">Wie</tspan><tspan x="809" dy="25">getestet?</tspan></text><text x="809" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="809" dy="0">Zeitpunkt, isolierte</tspan><tspan x="809" dy="30">Umgebung, Daten- und</tspan><tspan x="809" dy="30">Prozessprüfung,</tspan></text></g>
</svg>
