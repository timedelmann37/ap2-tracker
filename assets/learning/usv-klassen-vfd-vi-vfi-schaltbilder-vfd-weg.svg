t-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="850" dy="0">AC-Ausgang</tspan></text><g class="diagram-node storage" transform="translate(230 395)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="230" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="230" dy="0">Batterie</tspan></text><text class="diagram-node-detail" x="230" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="230" dy="0">Energiespeicher</tspan></text><g class="diagram-node router" transform="translate(500 395)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="500" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="500" dy="0">Wechselrichter</tspan></text><text class="diagram-node-detail" x="500" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="500" dy="0">DC zu AC</tspan></text>
