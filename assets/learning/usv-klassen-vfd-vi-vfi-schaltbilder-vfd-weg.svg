<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="diagram-vfd-weg-title diagram-vfd-weg-desc">
  <title id="diagram-vfd-weg-title">VFD: Netzweg im Normalbetrieb</title>
  <desc id="diagram-vfd-weg-desc">Funktionsmodell: Netz erreicht die Last über einen Umschalter; Batterie und Wechselrichter übernehmen bei Ausfall. Der Normal-Ausgang folgt Netzspannung und Netzfrequenz.</desc>
