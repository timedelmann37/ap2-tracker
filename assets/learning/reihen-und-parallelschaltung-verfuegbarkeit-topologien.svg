<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-topologien-title diagram-topologien-desc">
  <title id="diagram-topologien-title">Zwei Knoten, zwei verschiedene Logiken</title>
  <desc id="diagram-topologien-desc">Entscheidend ist, welche Komponenten für dieselbe Nutzerfunktion gleichzeitig gebraucht werden.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Knoten, zwei verschiedene Logiken</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Reihe: Web → Datenbank</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Die Nutzerfunktion braucht</tspan><tspan x="64" dy="30">beide Komponenten. Fällt</tspan><tspan x="64" dy="30">eine aus, steht der Dienst;</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">Parallel: Web A oder Web</tspan><tspan x="362" dy="25">B</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Jeder Pfad kann dieselbe</tspan><tspan x="362" dy="30">Nutzerfunktion vollständig</tspan><tspan x="362" dy="30">tragen. Bei unabhängigen</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Gemeinsame Datenbank</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Zwei Webserver bleiben an</tspan><tspan x="660" dy="30">einer einzigen Datenbank</tspan><tspan x="660" dy="30">hängen. Der Webteil ist</tspan></text></g>
</svg>
