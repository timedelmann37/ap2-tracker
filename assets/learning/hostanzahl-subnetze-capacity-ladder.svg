<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-capacity-ladder-title diagram-capacity-ladder-desc">
  <title id="diagram-capacity-ladder-title">Kapazitätsleiter für klassische IPv4-Subnetze</title>
  <desc id="diagram-capacity-ladder-desc">Jedes zusätzliche Hostbit verdoppelt den gesamten Adressblock; zwei Adressen bleiben für Netz und Broadcast reserviert.</desc>
