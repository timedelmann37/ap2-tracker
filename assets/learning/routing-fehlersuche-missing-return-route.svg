<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-missing-return-route-title diagram-missing-return-route-desc">
  <title id="diagram-missing-return-route-title">Die Anfrage kommt an, die Antwort nimmt den falschen Ausgang</title>
  <desc id="diagram-missing-return-route-desc">Router A kennt das Servernetz über Router B. Router B kennt jedoch das Clientnetz nicht und sendet die Antwort über seine Default Route zum ISP. Die fehlende Rückroute unterbricht die Verbindung trotz erfolgreicher Hinroute.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Die Anfrage kommt an, die Antwort nimmt den falschen Ausgang</tspan></text>
  <g class="diagram-zone zone-source"><rect x="25" y="90" width="345" height="360" rx="18"/><text x="41" y="117">Standort A</text></g><g class="diagram-zone zone-target"><rect x="430" y="90" width="505" height="220" rx="18"/><text x="446" y="117">Standort B</text></g><g class="diagram-zone zone-error"><rect x="680" y="345" width="255" height="105" rx="18"/><text x="696" y="372">Falscher Rückweg</text></g><g class="diagram-edge forward"><path d="M120 220 L315 220"/><text class="diagram-edge-label" x="217.5" y="212" text-anchor="middle">Gateway</text></g><g class="diagram-edge forward"><path d="M315 220 L555 220"/><text class="diagram-edge-label" x="435" y="212" text-anchor="middle">Hinweg korrekt</text></g><g class="diagram-edge local"><path d="M555 220 L815 220"/><text class="diagram-edge-label" x="685" y="212" text-anchor="middle">Anfrage + Antwort</text></g><g class="diagram-edge error"><path d="M555 220 L815 395"/><text class="diagram-edge-label" x="685" y="299.5" text-anchor="middle">Antwort fehlgeleitet</text></g><g class="diagram-node client" transform="translate(120 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="120" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="120" dy="0">Client A</tspan></text><text class="diagram-node-detail" x="120" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="120" dy="0">10.10.10.20/24</tspan></text><g class="diagram-node router" transform="translate(315 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="315" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="315" dy="0">Router A</tspan></text><text class="diagram-node-detail" x="315" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="315" dy="0">Hinroute vorhanden</tspan></text><g class="diagram-node router" transform="translate(555 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="555" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="555" dy="0">Router B</tspan></text><text class="diagram-node-detail" x="555" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="555" dy="0">Rückroute fehlt</tspan></text><g class="diagram-node server" transform="translate(815 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="815" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="815" dy="0">Server B</tspan></text><text class="diagram-node-detail" x="815" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="815" dy="0">10.20.20.50/24</tspan></text><g class="diagram-node internet" transform="translate(815 395)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="815" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="815" dy="0">ISP-Next-Hop</tspan></text><text class="diagram-node-detail" x="815" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="815" dy="0">Default Route</tspan></text>
</svg>
