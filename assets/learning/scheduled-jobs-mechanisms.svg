<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1110" viewBox="0 0 600 1110" role="img" aria-labelledby="title description">
  <title id="title">Drei Mechanismen für einen täglichen Auftrag</title>
  <desc id="description">Cron verbindet fünf Zeitfelder und den Befehl in einem Eintrag. Ein systemd-Timer aktiviert einen Service. Die Windows-Aufgabenplanung verbindet einen täglichen Trigger mit einer Aktion. Erfolg muss getrennt geprüft werden.</desc>
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#38dfff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="600" height="1110" fill="#101724"/>
  <rect x="1" y="1" width="598" height="1108" fill="none" stroke="#475568" stroke-width="2"/>
  <text x="32" y="50" fill="#a8b8c9" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1.4">ZEITPLAN / 07:15 UHR</text>
  <text x="32" y="101" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="37" font-weight="600">Drei Planer, ein Auftrag</text>
  <text x="32" y="141" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="27">Auslöser ist nicht Ergebnis.</text>
  <path d="M 32 165 H 568" stroke="#475568" stroke-width="2"/>

  <text x="32" y="211" fill="#38dfff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.2">01 / CRON</text>
  <text x="32" y="248" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="26">Zeit und Befehl in einer Zeile</text>
  <text x="32" y="300" fill="#f1f0ec" font-family="Consolas, monospace" font-size="30">15 7 * * *</text>
  <text x="318" y="300" fill="#a8b8c9" font-family="Inter, Arial, sans-serif" font-size="25">täglich 07:15</text>
  <path d="M 70 315 V 346" stroke="#38dfff" stroke-width="3" marker-end="url(#next)"/>
  <text x="32" y="388" fill="#d4c7f2" font-family="Consolas, monospace" font-size="29">/opt/ops/report.sh</text>
  <path d="M 32 425 H 568" stroke="#475568" stroke-width="2"/>

  <text x="32" y="471" fill="#38dfff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.2">02 / SYSTEMD</text>
  <text x="32" y="508" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="26">Timer aktiviert gleichnamigen Service</text>
  <text x="32" y="555" fill="#f1f0ec" font-family="Consolas, monospace" font-size="29">report.timer</text>
  <text x="32" y="591" fill="#a9cfea" font-family="Consolas, monospace" font-size="25">OnCalendar=*-*-* 07:15:00</text>
  <path d="M 70 605 V 636" stroke="#38dfff" stroke-width="3" marker-end="url(#next)"/>
  <text x="32" y="677" fill="#d4c7f2" font-family="Consolas, monospace" font-size="29">report.service</text>
  <text x="32" y="713" fill="#d4c7f2" font-family="Consolas, monospace" font-size="25">ExecStart=/opt/ops/report.sh</text>
  <path d="M 32 750 H 568" stroke="#475568" stroke-width="2"/>

  <text x="32" y="796" fill="#38dfff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1.2">03 / WINDOWS</text>
  <text x="32" y="833" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="26">Task DailyReport: Trigger und Aktion</text>
  <text x="32" y="881" fill="#a9cfea" font-family="Consolas, monospace" font-size="27">/sc DAILY  /st 07:15</text>
  <path d="M 70 896 V 927" stroke="#38dfff" stroke-width="3" marker-end="url(#next)"/>
  <text x="32" y="968" fill="#d4c7f2" font-family="Consolas, monospace" font-size="27">/tr C:\Ops\report.cmd</text>

  <path d="M 32 1001 H 568" stroke="#475568" stroke-width="2"/>
  <circle cx="48" cy="1040" r="14" fill="none" stroke="#65d9a0" stroke-width="3"/>
  <path d="m 41 1039 5 5 9 -10" fill="none" stroke="#65d9a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="1048" fill="#f1f0ec" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">Erfolg getrennt prüfen</text>
  <text x="80" y="1084" fill="#c4cbd4" font-family="Inter, Arial, sans-serif" font-size="25">Service-/Task-Log + Bericht</text>
</svg>
