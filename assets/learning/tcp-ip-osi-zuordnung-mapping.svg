<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="title desc">
  <title id="title">Vier TCP/IP-Schichten bündeln sieben OSI-Schichten</title>
  <desc id="desc">Von oben nach unten: Anwendung bündelt OSI 5 bis 7, Transport entspricht OSI 4, Internet entspricht OSI 3 und Netzzugang bündelt OSI 1 und 2.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Vier TCP/IP-Schichten bündeln sieben OSI-Schichten</tspan></text>
  <g><rect x="42" y="82" width="876" height="82" rx="12" fill="#f8faf6" stroke="#cfd8d0"/><rect x="42" y="82" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">Anwendung</tspan></text><text x="194" y="116" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">OSI 7 Anwendung, 6 Darstellung und 5 Sitzung; zum Beispiel</tspan><tspan x="194" dy="25">HTTP, DNS und SMTP</tspan></text></g><g><rect x="42" y="182" width="876" height="82" rx="12" fill="#eef2ed" stroke="#cfd8d0"/><rect x="42" y="182" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">Transport</tspan></text><text x="194" y="216" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">OSI 4; Ende-zu-Ende-Transport zwischen Prozessen, Ports,</tspan><tspan x="194" dy="25">TCP und UDP</tspan></text></g><g><rect x="42" y="282" width="876" height="82" rx="12" fill="#f8faf6" stroke="#cfd8d0"/><rect x="42" y="282" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">Internet</tspan></text><text x="194" y="316" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">OSI 3; logische Adressierung und Weiterleitung zwischen</tspan><tspan x="194" dy="25">Netzen mit IP</tspan></text></g><g><rect x="42" y="382" width="876" height="82" rx="12" fill="#eef2ed" stroke="#cfd8d0"/><rect x="42" y="382" width="126" height="82" rx="12" fill="#dce8df"/><text x="105" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#17211b"><tspan x="105" dy="0">Netzzugang</tspan></text><text x="194" y="416" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#17211b"><tspan x="194" dy="0">OSI 2 Sicherung und 1 Bitübertragung; lokaler Frame,</tspan><tspan x="194" dy="25">Medium und Signal</tspan></text></g>
</svg>
