  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Vela: zwei Wege zum gemeinsamen Pilottest</tspan></text>
  <g class="diagram-edge "><path d="M120 235 L480 115"/><text class="diagram-edge-label" x="300" y="167" text-anchor="middle">A → B · kritisch</text></g><g class="diagram-edge "><path d="M480 115 L840 235"/><text class="diagram-edge-label" x="660" y="167" text-anchor="middle">B → E · kritisch</text></g><g class="diagram-edge "><path d="M120 235 L345 355"/><text class="diagram-edge-label" x="232.5" y="287" text-anchor="middle">A → C</text></g><g class="diagram-edge "><path d="M345 355 L590 355"/><text class="diagram-edge-label" x="467.5" y="347" text-anchor="middle">C → D</text></g><g class="diagram-edge "><path d="M590 355 L840 235"/><text class="diagram-edge-label" x="715" y="287" text-anchor="middle">D → E</text></g><g class="diagram-node device" transform="translate(120 235)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="120" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="120" dy="0">A · Auftrag</tspan></text><text class="diagram-node-detail" x="120" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="120" dy="0">2 Arbeitstage</tspan></text><g class="diagram-node device" transform="translate(480 115)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">B · Server</tspan></text><text class="diagram-node-detail" x="480" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">5 Arbeitstage</tspan></text><g class="diagram-node device" transform="translate(345 355)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="345" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="345" dy="0">C · Testfälle</tspan></text><text class="diagram-node-detail" x="345" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="345" dy="0">2 Arbeitstage</tspan></text><g class="diagram-node device" transform="translate(590 355)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="590" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="590" dy="0">D · Prüfdaten</tspan></text><text class="diagram-node-detail" x="590" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="590" dy="0">1 Arbeitstag</tspan></text><g class="diagram-node device" transform="translate(840 235)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="840" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="840" dy="0">E · Pilottest</tspan></text><text class="diagram-node-detail" x="840" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="840" dy="0">2 Arbeitstage</tspan></text>
