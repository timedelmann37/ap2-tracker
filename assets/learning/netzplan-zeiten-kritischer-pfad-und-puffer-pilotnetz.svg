<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="diagram-pilotnetz-title diagram-pilotnetz-desc">
  <title id="diagram-pilotnetz-title">Vela: zwei Wege zum gemeinsamen Pilottest</title>
  <desc id="diagram-pilotnetz-desc">Leserichtung links nach rechts. Kanten nennen Vorgänger und Nachfolger; ihre Länge steht nicht für Dauer. Kritischer Weg A–B–E, kürzerer Weg A–C–D–E.</desc>
