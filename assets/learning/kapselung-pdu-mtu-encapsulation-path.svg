<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Beim Senden wächst die Hülle schichtweise</title>
  <desc id="desc">Anwendungsdaten werden zuerst zur Transport-PDU, dann zum IP-Paket, anschließend zum Ethernet-Frame und zuletzt als Bits beziehungsweise Signale übertragen.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Beim Senden wächst die Hülle schichtweise</tspan></text>
  <g><rect x="150" y="80" width="660" height="72" rx="14" fill="#dce8df" stroke="#c3cec5"/><text x="178" y="109" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Anwendungsdaten</tspan></text><text x="178" y="136" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">fachlicher Inhalt, zum Beispiel eine HTTP-Anfrage</tspan></text><path d="M480 148v30" stroke="#7f9183" stroke-width="3"/><path d="m470 170 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="188" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="217" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">TCP-Segment oder UDP-Datagramm</tspan></text><text x="178" y="244" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Transport-Header ergänzt unter anderem Quell- und Zielport</tspan></text><path d="M480 256v30" stroke="#7f9183" stroke-width="3"/><path d="m470 278 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="296" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="325" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">IP-Paket</tspan></text><text x="178" y="352" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">IP-Header ergänzt logische Quell- und Zieladresse</tspan></text><path d="M480 364v30" stroke="#7f9183" stroke-width="3"/><path d="m470 386 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="404" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="433" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Ethernet-Frame</tspan></text><text x="178" y="460" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Link-Header und Prüfinformationen gelten für den nächsten</tspan><tspan x="178" dy="25">lokalen Abschnitt</tspan></text><path d="M480 472v30" stroke="#7f9183" stroke-width="3"/><path d="m470 494 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="512" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="541" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Bits und Signale</tspan></text><text x="178" y="568" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">das Medium überträgt die codierten Werte zum nächsten Gerät</tspan></text></g>
</svg>
