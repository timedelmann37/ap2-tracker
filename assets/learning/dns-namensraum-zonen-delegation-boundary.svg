  <title id="diagram-delegation-boundary-title">Eine Delegation schneidet eine Kindzone aus der Elternzone</title>
  <desc id="diagram-delegation-boundary-desc">Die Elternzone firma.example verweist mit einer NS-Delegation auf den autoritativen Server der Kindzone lab.firma.example. Die eigentlichen Hostdaten der Kindzone liegen dort.</desc>
