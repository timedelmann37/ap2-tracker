<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Struktogramm: Temperatur prüfen</title><desc id="desc">Eigene Lernzeichnung. Der Ablauf und die Zahlen werden im benachbarten Lerntext vollständig erklärt.</desc><style>text{font:16px Arial,sans-serif;fill:#241e2e} .title{font-weight:bold;font-size:19px} .shape{fill:#f3effa;stroke:#65547f;stroke-width:1.8} .line{fill:none;stroke:#65547f;stroke-width:1.8} .small{font-size:14px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#65547f" stroke-width="1.5"/></marker></defs><rect width="360" height="330" fill="#fff"/><text x="180" y="32" text-anchor="middle" class="title">Struktogramm</text><rect class="shape" x="20" y="60" width="320" height="235"/><path class="line" d="M20 105H340M20 185H340M180 185V250M20 250H340M20 105L180 185L340 105" /><text x="180" y="88" text-anchor="middle" class="">Temperatur einlesen</text><text x="180" y="134" text-anchor="middle" class="">Temperatur ≥ 30?</text><text x="58" y="174" text-anchor="middle" class="">ja</text><text x="302" y="174" text-anchor="middle" class="">nein</text><text x="100" y="222" text-anchor="middle" class="">Ausgabe „Warnung“</text><text x="260" y="222" text-anchor="middle" class="">Ausgabe „OK“</text><text x="180" y="280" text-anchor="middle" class="">Ausgabe „Ende“</text></svg>
