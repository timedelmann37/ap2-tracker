<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">OSI-Schichten und Sichtweite typischer Netzwerkgeräte</title>
  <desc id="desc">Sieben übereinanderliegende Schichten von Bitübertragung bis Anwendung. Jede Zeile nennt Aufgabe, Dateneinheit und Beispiele. Rechts zeigen Klammern, dass Repeater bis Schicht eins, Switches bis Schicht zwei, Router bis Schicht drei und Endsysteme bis Schicht sieben auswerten.</desc>
  <style>
    .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d9d6ce;stroke-width:2}.head{font:700 28px Inter,Arial,sans-serif;fill:#1d2520}.sub{font:400 16px Inter,Arial,sans-serif;fill:#59625c}.n{font:800 23px Inter,Arial,sans-serif;fill:#17201a}.de{font:700 18px Inter,Arial,sans-serif;fill:#17201a}.en{font:400 13px Inter,Arial,sans-serif;fill:#66706a}.body{font:500 14px Inter,Arial,sans-serif;fill:#26312b}.tag{font:700 12px Inter,Arial,sans-serif;fill:#37433c}.device{font:700 14px Inter,Arial,sans-serif;fill:#1f2b24}.note{font:500 13px Inter,Arial,sans-serif;fill:#59625c}.rule{stroke:#d9d6ce;stroke-width:1.5}.scope{fill:none;stroke:#717a74;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.scope-hi{fill:none;stroke:#c89a16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#c89a16}.l7{fill:#f2eee5}.l6{fill:#f6f1e7}.l5{fill:#faf3df}.l4{fill:#fff0c5}.l3{fill:#f0f5ed}.l2{fill:#e7f1e8}.l1{fill:#dcebdd}.pill{fill:#fff;stroke:#d5d2c9;stroke-width:1.2}.smallcap{font:800 11px Inter,Arial,sans-serif;letter-spacing:1.2px;fill:#717a74}
  </style>
  <rect class="bg" width="1200" height="820" rx="28"/>
  <rect class="panel" x="28" y="28" width="1144" height="764" rx="22"/>
  <text class="head" x="64" y="78">Welche Information ist auf welcher Schicht sichtbar?</text>
  <text class="sub" x="64" y="108">Von unten nach oben: Signal → lokaler Rahmen → geroutetes Paket → Prozess-zu-Prozess-Transport → Anwendungsdaten</text>

  <text class="smallcap" x="64" y="145">SCHICHT</text>
  <text class="smallcap" x="322" y="145">HAUPTAUFGABE</text>
  <text class="smallcap" x="700" y="145">DATENEINHEIT · BEISPIELE</text>
  <text class="smallcap" x="998" y="145">GERÄTESICHT</text>

  <g transform="translate(58 158)">
    <rect class="l7" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">7</text><text class="de" x="58" y="29">Anwendung</text><text class="en" x="58" y="51">Application</text>
    <text class="body" x="264" y="31">Netzdienste für Anwendungen</text><text class="body" x="264" y="53">und fachliche Nachrichten</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Daten</text>
    <text class="body" x="748" y="35">HTTP · DNS · SMTP · SSH</text>
  </g>
  <g transform="translate(58 238)">
    <rect class="l6" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">6</text><text class="de" x="58" y="29">Darstellung</text><text class="en" x="58" y="51">Presentation</text>
    <text class="body" x="264" y="31">Format, Kodierung, Kompression</text><text class="body" x="264" y="53">und konzeptionell Verschlüsselung</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Daten</text>
    <text class="body" x="748" y="35">UTF-8 · JSON · JPEG</text>
  </g>
  <g transform="translate(58 318)">
    <rect class="l5" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">5</text><text class="de" x="58" y="29">Sitzung</text><text class="en" x="58" y="51">Session</text>
    <text class="body" x="264" y="31">Dialoge aufbauen, steuern</text><text class="body" x="264" y="53">und geordnet beenden</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Daten</text>
    <text class="body" x="748" y="35">Sitzungszustand · Dialog</text>
  </g>
  <g transform="translate(58 398)">
    <rect class="l4" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">4</text><text class="de" x="58" y="29">Transport</text><text class="en" x="58" y="51">Transport</text>
    <text class="body" x="264" y="31">Ende-zu-Ende zwischen Prozessen,</text><text class="body" x="264" y="53">Ports, Zuverlässigkeit, Flusskontrolle</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Segment</text>
    <text class="body" x="748" y="35">TCP · UDP</text>
  </g>
  <g transform="translate(58 478)">
    <rect class="l3" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">3</text><text class="de" x="58" y="29">Vermittlung</text><text class="en" x="58" y="51">Network</text>
    <text class="body" x="264" y="31">Logische Adressierung und</text><text class="body" x="264" y="53">Weiterleitung zwischen Netzen</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Paket</text>
    <text class="body" x="748" y="35">IPv4/IPv6 · ICMP</text>
  </g>
  <g transform="translate(58 558)">
    <rect class="l2" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">2</text><text class="de" x="58" y="29">Sicherung</text><text class="en" x="58" y="51">Data Link</text>
    <text class="body" x="264" y="31">Rahmen, MAC-Adressen, Medienzugriff</text><text class="body" x="264" y="53">und Fehlererkennung auf einem Link</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Frame</text>
    <text class="body" x="748" y="35">Ethernet · WLAN</text>
  </g>
  <g transform="translate(58 638)">
    <rect class="l1" width="900" height="76" rx="10"/>
    <text class="n" x="18" y="34">1</text><text class="de" x="58" y="29">Bitübertragung</text><text class="en" x="58" y="51">Physical</text>
    <text class="body" x="264" y="31">Bits als elektrische, optische</text><text class="body" x="264" y="53">oder Funksignale übertragen</text>
    <rect class="pill" x="635" y="16" width="100" height="28" rx="14"/><text class="tag" x="685" y="35" text-anchor="middle">Bits</text>
    <text class="body" x="748" y="35">Kabel · Funk · Transceiver</text>
  </g>

  <path class="scope-hi" d="M982 164h18v544h-18"/><text class="device" x="1012" y="430">Endsystem</text><text class="note" x="1012" y="450">bis Schicht 7</text>
  <path class="scope" d="M982 484h14v224h-14"/><text class="device" x="1012" y="531">Router</text><text class="note" x="1012" y="551">bis Schicht 3</text>
  <path class="scope" d="M982 564h10v144h-10"/><text class="device" x="1012" y="611">Switch</text><text class="note" x="1012" y="631">bis Schicht 2</text>
  <path class="scope" d="M982 644h7v64h-7"/><text class="device" x="1012" y="683">Repeater</text><text class="note" x="1012" y="703">bis Schicht 1</text>

  <path class="scope-hi" d="M82 747h814"/><path class="arrow" d="M896 739l18 8-18 8z"/>
  <text class="note" x="64" y="775">Merke: „arbeitet bis Schicht n“ beschreibt die höchste ausgewertete Information – nicht die einzige Funktion des Geräts.</text>
</svg>
