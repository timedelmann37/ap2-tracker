<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="diagram-vi-weg-title diagram-vi-weg-desc">
  <title id="diagram-vi-weg-title">VI: Spannungsregelung im Normalweg</title>
  <desc id="diagram-vi-weg-desc">Funktionsmodell: eine Regelstufe hält die Ausgangsspannung innerhalb ihrer Grenzen, während die Ausgangsfrequenz vom Netz abhängt. Bei Netzausfall übernimmt der Batteriepfad.</desc>
