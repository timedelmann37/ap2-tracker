<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-redundancy-domains-map-title diagram-redundancy-domains-map-desc">
  <title id="diagram-redundancy-domains-map-title">Redundanzebenen im Vergleich</title>
  <desc id="diagram-redundancy-domains-map-desc">Jede Karte zeigt eine mögliche gemeinsame Ursache.</desc>
