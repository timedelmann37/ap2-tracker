agram-border, #5f526e)"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="733" dy="0">Abhängige Dienste</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="733" dy="0">DNS,</tspan><tspan x="733" dy="30">Authentisierung,</tspan><tspan x="733" dy="30">Tunnelcontroller und</tspan></text></g>
