<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="diagram-arp-resolution-path-title diagram-arp-resolution-path-desc">
  <title id="diagram-arp-resolution-path-title">ARP bleibt im lokalen Segment</title>
  <desc id="diagram-arp-resolution-path-desc">Der Client sendet einen Broadcast Request. Nur der Host mit der gesuchten IPv4-Adresse antwortet mit seiner MAC-Adresse; für entfernte Ziele wird die MAC des Gateways gesucht.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">ARP bleibt im lokalen Segment</tspan></text>
  <g class="diagram-zone broadcast"><rect x="35" y="82" width="890" height="350" rx="18"/><text x="51" y="109">Layer-2-Segment / VLAN 20</text></g><g class="diagram-edge "><path d="M170 255 L480 255"/><text class="diagram-edge-label" x="325" y="247" text-anchor="middle">ARP Request</text></g><g class="diagram-edge "><path d="M480 255 L790 165"/><text class="diagram-edge-label" x="635" y="202" text-anchor="middle">Broadcast</text></g><g class="diagram-edge "><path d="M480 255 L790 350"/><text class="diagram-edge-label" x="635" y="294.5" text-anchor="middle">Broadcast</text></g><g class="diagram-edge "><path d="M790 165 L170 255"/><text class="diagram-edge-label" x="480" y="202" text-anchor="middle">ARP Reply</text></g><g class="diagram-node client" transform="translate(170 255)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="170" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="170" dy="0">Client A</tspan></text><text class="diagram-node-detail" x="170" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="170" dy="0">192.168.20.10</tspan></text><g class="diagram-node switch" transform="translate(480 255)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Switch</tspan></text><text class="diagram-node-detail" x="480" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">flutet Broadcast</tspan></text><g class="diagram-node client" transform="translate(790 165)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="790" y="160" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="790" dy="0">Client B</tspan></text><text class="diagram-node-detail" x="790" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="790" dy="0">192.168.20.25</tspan></text><g class="diagram-node router" transform="translate(790 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="790" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="790" dy="0">Gateway</tspan></text><text class="diagram-node-detail" x="790" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="790" dy="0">192.168.20.1</tspan></text>
</svg>
