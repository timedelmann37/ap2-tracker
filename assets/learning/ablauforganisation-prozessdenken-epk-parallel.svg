<svg class="learning-diagram diagram-epk" xmlns="http://www.w3.org/2000/svg" width="870" height="960" viewBox="0 0 870 960" role="img" aria-labelledby="diagram-parallel-title diagram-parallel-desc">
  <title id="diagram-parallel-title">UND: beide Ergebnisse abwarten</title>
  <desc id="diagram-parallel-desc">Auftrag ist freigegeben löst über UND Gerät vorbereiten und Konto anlegen aus. Die Ergebnisereignisse Gerät ist vorbereitet und Konto ist angelegt laufen in einem UND-Join zusammen. Erst danach Arbeitsplatz übergeben; Arbeitsplatz ist übergeben.</desc>
