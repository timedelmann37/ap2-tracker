<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-ipv6-prefix-families-title diagram-ipv6-prefix-families-desc">
  <title id="diagram-ipv6-prefix-families-title">Stabile Präfixanker für die Prüfung</title>
  <desc id="diagram-ipv6-prefix-families-desc">Die Präfixe grenzen typische Rollen ein, ohne jede einzelne Betriebs- oder Routingentscheidung vorwegzunehmen.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Stabile Präfixanker für die Prüfung</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="160" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">2000::/3</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Global Unicast;</tspan><tspan x="64" dy="30">global eindeutiger</tspan><tspan x="64" dy="30">Adressraum,</tspan></text></g><g><rect class="diagram-row" x="220" y="92" width="160" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="242" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="242" dy="0">fc00::/7</tspan></text><text x="242" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="242" dy="0">Unique Local</tspan><tspan x="242" dy="30">Address; für interne</tspan><tspan x="242" dy="30">Kommunikation, nicht</tspan></text></g><g><rect class="diagram-row" x="398" y="92" width="160" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="420" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="420" dy="0">fe80::/10</tspan></text><text x="420" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="420" dy="0">Link-Local Unicast;</tspan><tspan x="420" dy="30">nur auf dem</tspan><tspan x="420" dy="30">jeweiligen Link</tspan></text></g><g><rect class="diagram-row" x="576" y="92" width="160" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="598" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="598" dy="0">ff00::/8</tspan></text><text x="598" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="598" dy="0">Multicast; die</tspan><tspan x="598" dy="30">Adresse enthält</tspan><tspan x="598" dy="30">zusätzlich einen</tspan></text></g><g><rect class="diagram-row" x="754" y="92" width="160" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="776" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="776" dy="0">::1/128</tspan></text><text x="776" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="776" dy="0">Loopback;</tspan><tspan x="776" dy="30">ausschließlich der</tspan><tspan x="776" dy="30">eigene Host</tspan></text></g>
</svg>
