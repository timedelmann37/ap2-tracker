<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Zugriffsmodell von DAS, NAS und SAN</title>
  <desc id="desc">Drei Spalten zeigen: Bei DAS verwaltet ein direkt angeschlossener Server das Dateisystem auf dem Blockspeicher. Bei NAS greifen mehrere Clients über SMB oder NFS auf Dateien zu und das NAS verwaltet das Dateisystem. Bei SAN erhalten mehrere Server über iSCSI, Fibre Channel, FCoE oder NVMe over Fabrics Blockspeicher.</desc>
  <defs>
    <style>
      .bg{fill:#f4f4f2}.panel{fill:#fff;stroke:#c9cbc8;stroke-width:2}.head{fill:#183c42}.headText{fill:#fff;font:700 22px system-ui,sans-serif}.sub{fill:#d8f0f2;font:600 12px system-ui,sans-serif;letter-spacing:.08em}.label{fill:#1c1c1b;font:700 15px system-ui,sans-serif}.text{fill:#56554f;font:500 13px system-ui,sans-serif}.mono{fill:#1c1c1b;font:700 13px ui-monospace,monospace}.host{fill:#e4f3f4;stroke:#127a86;stroke-width:2}.store{fill:#f6e6be;stroke:#a06d16;stroke-width:2}.network{fill:#e7ddf4;stroke:#6d4c91;stroke-width:2}.fs{fill:#dce9f8;stroke:#4478a9;stroke-width:2}.arrow{stroke:#127a86;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.fileArrow{stroke:#6d4c91;stroke-width:3;fill:none;stroke-linecap:round}.blockArrow{stroke:#a06d16;stroke-width:3;fill:none;stroke-linecap:round}.badgeFile{fill:#6d4c91}.badgeBlock{fill:#a06d16}.badgeText{fill:#fff;font:700 11px system-ui,sans-serif;letter-spacing:.06em}
      @media (prefers-color-scheme:dark){.bg{fill:#191b1a}.panel{fill:#242726;stroke:#4b504d}.label,.mono{fill:#f4f4f2}.text{fill:#c8cbc8}.host{fill:#17363a}.store{fill:#46391e}.network{fill:#352b41}.fs{fill:#253747}}
    </style>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#127a86"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6d4c91"/></marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a06d16"/></marker>
  </defs>
  <rect class="bg" width="960" height="500" rx="20"/>

  <g transform="translate(24 22)">
    <rect class="panel" width="288" height="438" rx="16"/>
    <path class="head" d="M16 0h256a16 16 0 0 1 16 16v62H0V16A16 16 0 0 1 16 0Z"/>
    <text class="headText" x="24" y="34">DAS</text>
    <text class="sub" x="24" y="58">DIRECT ATTACHED STORAGE</text>
    <rect class="host" x="56" y="105" width="176" height="66" rx="10"/>
    <text class="label" x="144" y="132" text-anchor="middle">ein Host</text>
    <text class="text" x="144" y="153" text-anchor="middle">verwaltet das Dateisystem</text>
    <path class="blockArrow" d="M144 172v52" marker-end="url(#arrowGold)"/>
    <rect class="badgeBlock" x="101" y="188" width="86" height="24" rx="12"/>
    <text class="badgeText" x="144" y="204" text-anchor="middle">BLÖCKE</text>
    <rect class="store" x="47" y="231" width="194" height="82" rx="12"/>
    <text class="label" x="144" y="262" text-anchor="middle">direkter Speicher</text>
    <text class="mono" x="144" y="287" text-anchor="middle">SATA · SAS · NVMe · USB</text>
    <text class="text" x="144" y="350" text-anchor="middle">kurzer Anschlussweg</text>
    <text class="text" x="144" y="373" text-anchor="middle">meist hostgebunden</text>
    <text class="text" x="144" y="396" text-anchor="middle">einfache Bereitstellung</text>
  </g>

  <g transform="translate(336 22)">
    <rect class="panel" width="288" height="438" rx="16"/>
    <path class="head" d="M16 0h256a16 16 0 0 1 16 16v62H0V16A16 16 0 0 1 16 0Z"/>
    <text class="headText" x="24" y="34">NAS</text>
    <text class="sub" x="24" y="58">NETWORK ATTACHED STORAGE</text>
    <g transform="translate(24 103)">
      <rect class="host" width="68" height="48" rx="8"/><rect class="host" x="86" width="68" height="48" rx="8"/><rect class="host" x="172" width="68" height="48" rx="8"/>
      <text class="text" x="34" y="30" text-anchor="middle">Client</text><text class="text" x="120" y="30" text-anchor="middle">Client</text><text class="text" x="206" y="30" text-anchor="middle">Client</text>
    </g>
    <path class="fileArrow" d="M144 153v49" marker-end="url(#arrowPurple)"/>
    <rect class="badgeFile" x="76" y="166" width="136" height="24" rx="12"/>
    <text class="badgeText" x="144" y="182" text-anchor="middle">DATEIEN · SMB / NFS</text>
    <rect class="network" x="56" y="209" width="176" height="43" rx="10"/>
    <text class="label" x="144" y="236" text-anchor="middle">Ethernet + IP</text>
    <path class="fileArrow" d="M144 253v35" marker-end="url(#arrowPurple)"/>
    <rect class="fs" x="47" y="295" width="194" height="72" rx="12"/>
    <text class="label" x="144" y="324" text-anchor="middle">NAS-Appliance</text>
    <text class="text" x="144" y="347" text-anchor="middle">verwaltet das Dateisystem</text>
    <text class="text" x="144" y="396" text-anchor="middle">gemeinsame Freigaben</text>
    <text class="text" x="144" y="419" text-anchor="middle">für viele Clients</text>
  </g>

  <g transform="translate(648 22)">
    <rect class="panel" width="288" height="438" rx="16"/>
    <path class="head" d="M16 0h256a16 16 0 0 1 16 16v62H0V16A16 16 0 0 1 16 0Z"/>
    <text class="headText" x="24" y="34">SAN</text>
    <text class="sub" x="24" y="58">STORAGE AREA NETWORK</text>
    <g transform="translate(36 103)">
      <rect class="host" width="94" height="55" rx="8"/><rect class="host" x="122" width="94" height="55" rx="8"/>
      <text class="label" x="47" y="24" text-anchor="middle">Server</text><text class="text" x="47" y="43" text-anchor="middle">Dateisystem</text>
      <text class="label" x="169" y="24" text-anchor="middle">Server</text><text class="text" x="169" y="43" text-anchor="middle">Dateisystem</text>
    </g>
    <path class="blockArrow" d="M144 159v47" marker-end="url(#arrowGold)"/>
    <rect class="badgeBlock" x="101" y="171" width="86" height="24" rx="12"/>
    <text class="badgeText" x="144" y="187" text-anchor="middle">BLÖCKE</text>
    <rect class="network" x="38" y="213" width="212" height="66" rx="10"/>
    <text class="label" x="144" y="238" text-anchor="middle">Storage-Fabric</text>
    <text class="mono" x="144" y="260" text-anchor="middle">iSCSI · FC · FCoE</text>
    <path class="blockArrow" d="M144 280v35" marker-end="url(#arrowGold)"/>
    <rect class="store" x="47" y="322" width="194" height="62" rx="12"/>
    <text class="label" x="144" y="348" text-anchor="middle">LUN / Namespace</text>
    <text class="mono" x="144" y="370" text-anchor="middle">auch NVMe-oF</text>
    <text class="text" x="144" y="419" text-anchor="middle">zentraler Blockspeicher</text>
  </g>

  <text class="text" x="480" y="486" text-anchor="middle">Einordnung nach Zugriffsweg und Ebene – nicht nach Gehäuseform</text>
</svg>
