<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-zt-dienstwege-title diagram-zt-dienstwege-desc">
  <title id="diagram-zt-dienstwege-title">Gezielte Dienstwege</title>
  <desc id="diagram-zt-dienstwege-desc">Eigene logische Freigaben: Arbeitsplatz zur Auftrags-API, API zur Auftragsdatenbank. Die Lohnabrechnung hat keine Freigabe zu diesen Akteuren. Jeder dargestellte Weg braucht Durchsetzung; Linien bedeuten keine pauschale gegenseitige Berechtigung.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Gezielte Dienstwege</tspan></text>
  <g class="diagram-zone "><rect x="40" y="140" width="880" height="185" rx="18"/><text x="56" y="167">Auftragsdienst: zwei gezielte Wege</text></g><g class="diagram-zone "><rect x="340" y="355" width="280" height="145" rx="18"/><text x="356" y="382">Separater Schutzbereich</text></g><g class="diagram-edge "><path d="M150 260 L480 260"/><text class="diagram-edge-label" x="315" y="252" text-anchor="middle">Lesen</text></g><g class="diagram-edge "><path d="M480 260 L810 260"/><text class="diagram-edge-label" x="645" y="252" text-anchor="middle">Abfragen</text></g><g class="diagram-node device" transform="translate(150 260)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="255" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Arbeitsplatz</tspan></text><text class="diagram-node-detail" x="150" y="279" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">Miras Sitzung</tspan></text><g class="diagram-node device" transform="translate(480 260)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="255" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Auftrags-API</tspan></text><text class="diagram-node-detail" x="480" y="279" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">Dienstidentität</tspan></text><g class="diagram-node device" transform="translate(810 260)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="810" y="255" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="810" dy="0">Auftrags-DB</tspan></text><text class="diagram-node-detail" x="810" y="279" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="810" dy="0">Datenzugriff</tspan></text><g class="diagram-node device" transform="translate(480 440)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="435" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Lohnabrechnung</tspan></text><text class="diagram-node-detail" x="480" y="459" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">Keine Freigabe</tspan></text>
</svg>
