<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Struktogramm: kopfgesteuerte Schleife</title><desc id="desc">Eigene Lernzeichnung. Der Ablauf und die Zahlen werden im benachbarten Lerntext vollständig erklärt.</desc><style>text{font:16px Arial,sans-serif;fill:#241e2e} .title{font-weight:bold;font-size:19px} .shape{fill:#f3effa;stroke:#65547f;stroke-width:1.8} .line{fill:none;stroke:#65547f;stroke-width:1.8} .small{font-size:14px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#65547f" stroke-width="1.5"/></marker></defs><rect width="360" height="320" fill="#fff"/><text x="180" y="32" text-anchor="middle" class="title">Vorher prüfen</text><rect class="shape" x="20" y="60" width="320" height="230"/><path class="line" d="M20 105H340M60 155H340M60 155V245M20 245H340M60 200H340" /><text x="180" y="88" text-anchor="middle" class="">n einlesen</text><text x="180" y="136" text-anchor="middle" class="">SOLANGE n &gt; 0</text><text x="200" y="184" text-anchor="middle" class="">n ausgeben</text><text x="200" y="229" text-anchor="middle" class="">n um 1 verringern</text><text x="180" y="275" text-anchor="middle" class="">„Fertig“ ausgeben</text></svg>
