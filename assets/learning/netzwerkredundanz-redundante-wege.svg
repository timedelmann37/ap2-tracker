<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="diagram-redundante-wege-title diagram-redundante-wege-desc">
  <title id="diagram-redundante-wege-title">Zwei Wege – gemeinsame Endpunkte</title>
  <desc id="diagram-redundante-wege-desc">Der Zugang erreicht zwei Core-Switches über unterschiedliche Wege. Zugang und Ziel bleiben in diesem vereinfachten Ausschnitt gemeinsame Punkte.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Wege – gemeinsame Endpunkte</tspan></text>
  <g class="diagram-edge allowed"><path d="M130 250 L460 150"/><text class="diagram-edge-label" x="295" y="192" text-anchor="middle">Weg A</text></g><g class="diagram-edge allowed"><path d="M130 250 L460 350"/><text class="diagram-edge-label" x="295" y="292" text-anchor="middle">Weg B</text></g><g class="diagram-edge allowed"><path d="M460 150 L790 250"/><text class="diagram-edge-label" x="625" y="192" text-anchor="middle">Pfad A</text></g><g class="diagram-edge allowed"><path d="M460 350 L790 250"/><text class="diagram-edge-label" x="625" y="292" text-anchor="middle">Pfad B</text></g><g class="diagram-node switch" transform="translate(130 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="130" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="130" dy="0">Zugang</tspan></text><text class="diagram-node-detail" x="130" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="130" dy="0">gemeinsamer Punkt</tspan></text><g class="diagram-node switch" transform="translate(460 150)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="460" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="460" dy="0">Core A</tspan></text><text class="diagram-node-detail" x="460" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="460" dy="0">Pfad A</tspan></text><g class="diagram-node switch" transform="translate(460 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="460" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="460" dy="0">Core B</tspan></text><text class="diagram-node-detail" x="460" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="460" dy="0">Pfad B</tspan></text><g class="diagram-node server" transform="translate(790 250)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="790" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="790" dy="0">Dienstziel</tspan></text><text class="diagram-node-detail" x="790" y="269" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="790" dy="0">gemeinsamer Punkt</tspan></text>
</svg>
