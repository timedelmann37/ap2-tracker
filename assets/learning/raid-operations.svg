<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Hardware- und Software-RAID im Vergleich</title>
  <desc id="desc">Zwei Datenpfade führen von Anwendungen über Betriebssystem oder RAID-Controller zu Laufwerken. Darunter zeigt ein Wiederherstellungsablauf Ausfall, Hot Spare, Rebuild und wiederhergestellte Redundanz.</desc>
  <defs>
    <style>
      .bg{fill:#f5f1e8}.panel{fill:#fffdf8;stroke:#252421;stroke-width:3}.head{fill:#252421}.accent{fill:#d95d39}.safe{fill:#237a65}.muted{fill:#ded8ca}.line{stroke:#252421;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8b877d;stroke-width:3;stroke-dasharray:9 10;fill:none}.t{font:700 27px system-ui,sans-serif;fill:#252421}.w{font:700 25px system-ui,sans-serif;fill:#fff}.s{font:500 20px system-ui,sans-serif;fill:#45423c}.tiny{font:600 17px system-ui,sans-serif;fill:#45423c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#252421"/></marker>
  </defs>
  <rect class="bg" width="1200" height="660" rx="28"/>
  <rect class="panel" x="45" y="42" width="525" height="340" rx="20"/>
  <rect class="panel" x="630" y="42" width="525" height="340" rx="20"/>
  <rect class="head" x="45" y="42" width="525" height="66" rx="20"/><rect class="head" x="630" y="42" width="525" height="66" rx="20"/>
  <text class="w" x="75" y="84">Software-RAID</text><text class="w" x="660" y="84">Hardware-RAID</text>
  <rect class="muted" x="88" y="142" width="185" height="58" rx="12"/><text class="t" x="122" y="180">Anwendung</text>
  <rect class="accent" x="342" y="142" width="185" height="58" rx="12"/><text class="w" x="367" y="180">Betriebssystem</text>
  <path class="line" d="M273 171h60" marker-end="url(#arrow)"/>
  <rect class="muted" x="675" y="142" width="185" height="58" rx="12"/><text class="t" x="710" y="180">Anwendung</text>
  <rect class="accent" x="928" y="142" width="185" height="58" rx="12"/><text class="w" x="960" y="180">Controller</text>
  <path class="line" d="M860 171h59" marker-end="url(#arrow)"/>
  <path class="line" d="M435 200v58" marker-end="url(#arrow)"/><path class="line" d="M1020 200v58" marker-end="url(#arrow)"/>
  <g><rect class="panel" x="105" y="276" width="92" height="67" rx="9"/><rect class="panel" x="231" y="276" width="92" height="67" rx="9"/><rect class="panel" x="357" y="276" width="92" height="67" rx="9"/><rect class="panel" x="483" y="276" width="48" height="67" rx="9"/></g>
  <g><rect class="panel" x="690" y="276" width="92" height="67" rx="9"/><rect class="panel" x="816" y="276" width="92" height="67" rx="9"/><rect class="panel" x="942" y="276" width="92" height="67" rx="9"/><rect class="panel" x="1068" y="276" width="48" height="67" rx="9"/></g>
  <text class="tiny" x="93" y="370">RAID-Logik benötigt CPU, Treiber und Metadaten</text><text class="tiny" x="673" y="370">Controller, Cache und Batterie/Flash mitplanen</text>
  <text class="t" x="47" y="442">Wiederherstellungskette</text>
  <rect class="panel" x="47" y="478" width="205" height="105" rx="16"/><text class="t" x="91" y="522">1 · Ausfall</text><text class="s" x="73" y="554">Array degradiert</text>
  <rect class="panel" x="344" y="478" width="205" height="105" rx="16"/><text class="t" x="373" y="522">2 · Ersatz</text><text class="s" x="369" y="554">Hot Spare/Tausch</text>
  <rect class="panel" x="641" y="478" width="205" height="105" rx="16"/><text class="t" x="674" y="522">3 · Rebuild</text><text class="s" x="670" y="554">Last überwachen</text>
  <rect x="938" y="478" width="215" height="105" rx="16" fill="#237a65"/><text class="w" x="963" y="522">4 · Redundanz</text><text class="w" x="980" y="554">Status prüfen</text>
  <path class="line" d="M252 531h82" marker-end="url(#arrow)"/><path class="line" d="M549 531h82" marker-end="url(#arrow)"/><path class="line" d="M846 531h82" marker-end="url(#arrow)"/>
  <path class="dash" d="M1038 594C840 645 312 645 146 594" marker-end="url(#arrow)"/><text class="tiny" x="469" y="638">Ursache, Alarmierung und Restore-Test dokumentieren</text>
</svg>
