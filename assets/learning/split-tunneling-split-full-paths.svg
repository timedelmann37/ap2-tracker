<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-split-full-paths-title diagram-split-full-paths-desc">
  <title id="diagram-split-full-paths-title">Full und Split Tunnel</title>
