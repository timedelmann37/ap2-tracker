<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-cron-fuenf-felder-title diagram-cron-fuenf-felder-desc">
  <title id="diagram-cron-fuenf-felder-title">Cron-Ausdruck: 15 7 * * *</title>
  <desc id="diagram-cron-fuenf-felder-desc">Fünf eigene Feldkarten zeigen den Ausdruck 15 7 * * * von links nach rechts; danach folgt der Befehl.</desc>
