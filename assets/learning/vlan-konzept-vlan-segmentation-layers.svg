<svg class="learning-diagram diagram-layers" xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="diagram-vlan-segmentation-layers-title diagram-vlan-segmentation-layers-desc">
  <title id="diagram-vlan-segmentation-layers-title">Segmentierung nach Aufgabe und Schutzbedarf</title>
