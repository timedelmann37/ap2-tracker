<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-drei-budgets-title diagram-drei-budgets-desc">
  <title id="diagram-drei-budgets-title">Drei Budgets, drei Engpässe</title>
  <desc id="diagram-drei-budgets-desc">Konfigurierte Kapazität ist nicht dasselbe wie gleichzeitig verfügbare physische Kapazität.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Drei Budgets, drei Engpässe</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">CPU: 16 vCPUs / 8 Kerne</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Der Scheduler verteilt</tspan><tspan x="64" dy="30">Rechenzeit. Brauchen alle</tspan><tspan x="64" dy="30">Gäste zugleich volle CPU,</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">RAM: 48 GB möglich / 32</tspan><tspan x="362" dy="25">GB physisch</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Dynamische Zuteilung und</tspan><tspan x="362" dy="30">Rückgewinnung helfen nur,</tspan><tspan x="362" dy="30">wenn der tatsächliche Bedarf</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Disk: 300 GB logisch /</tspan><tspan x="660" dy="25">200 GB physisch</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Thin Disks können anfangs</tspan><tspan x="660" dy="30">wenig belegen. Schreiben</tspan><tspan x="660" dy="30">alle Gäste mehr, als real</tspan></text></g>
</svg>
