<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-survey-method-map-title diagram-survey-method-map-desc">
  <title id="diagram-survey-method-map-title">Survey-Arten im Vergleich</title>
  <desc id="diagram-survey-method-map-desc">Jede Methode beantwortet eine andere Frage.</desc>
