<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="diagram-web-schutzpfad-title diagram-web-schutzpfad-desc">
  <title id="diagram-web-schutzpfad-title">Ein Einstieg, zwei mögliche Ziele</title>
  <desc id="diagram-web-schutzpfad-desc">Client-TLS endet am Einstieg mit WAF und Lastverteilung. Zum gewählten Backend besteht ein neuer TLS-Abschnitt.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Ein Einstieg, zwei mögliche Ziele</tspan></text>
  <g class="diagram-edge allowed"><path d="M120 230 L430 230"/><text class="diagram-edge-label" x="275" y="222" text-anchor="middle">TLS 1</text></g><g class="diagram-edge allowed"><path d="M430 230 L750 150"/><text class="diagram-edge-label" x="590" y="182" text-anchor="middle">TLS 2</text></g><g class="diagram-edge allowed"><path d="M430 230 L750 350"/><text class="diagram-edge-label" x="590" y="282" text-anchor="middle">TLS 2</text></g><g class="diagram-node client" transform="translate(120 230)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="120" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="120" dy="0">Browser</tspan></text><text class="diagram-node-detail" x="120" y="249" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="120" dy="0">Portalname prüfen</tspan></text><g class="diagram-node router" transform="translate(430 230)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="430" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="430" dy="0">Einstieg</tspan></text><text class="diagram-node-detail" x="430" y="249" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="430" dy="0">Proxy / WAF / LB</tspan></text><g class="diagram-node server" transform="translate(750 150)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="750" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="750" dy="0">Backend A</tspan></text><text class="diagram-node-detail" x="750" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="750" dy="0">TLS validieren</tspan></text><g class="diagram-node server" transform="translate(750 350)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="750" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="750" dy="0">Backend B</tspan></text><text class="diagram-node-detail" x="750" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="750" dy="0">TLS validieren</tspan></text>
</svg>
