<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="diagram-standorte-title diagram-standorte-desc">
  <title id="diagram-standorte-title">Zwei Standorte, ein nutzbarer Dienst?</title>
  <desc id="diagram-standorte-desc">Ein zweiter Standort schützt nur, wenn Zugang, Anwendung und benötigte Daten dort im Ausfallfall verfügbar sind.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Standorte, ein nutzbarer Dienst?</tspan></text>
  <g class="diagram-edge "><path d="M115 220 L340 220"/></g><g class="diagram-edge "><path d="M340 220 L675 130"/><text class="diagram-edge-label" x="507.5" y="167" text-anchor="middle">normal</text></g><g class="diagram-edge "><path d="M340 220 L675 335"/><text class="diagram-edge-label" x="507.5" y="269.5" text-anchor="middle">Failover</text></g><g class="diagram-edge "><path d="M675 130 L675 335"/><text class="diagram-edge-label" x="675" y="224.5" text-anchor="middle">Daten</text></g><g class="diagram-node client" transform="translate(115 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="115" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="115" dy="0">Nutzende</tspan></text><text class="diagram-node-detail" x="115" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="115" dy="0">neue Sitzungen</tspan></text><g class="diagram-node router" transform="translate(340 220)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="340" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="340" dy="0">Zugangssteuerung</tspan></text><text class="diagram-node-detail" x="340" y="239" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="340" dy="0">DNS oder Routing</tspan></text><g class="diagram-node server" transform="translate(675 130)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="675" y="125" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="675" dy="0">Standort A</tspan></text><text class="diagram-node-detail" x="675" y="149" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="675" dy="0">Primärdienst</tspan></text><g class="diagram-node server" transform="translate(675 335)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="675" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="675" dy="0">Standort B</tspan></text><text class="diagram-node-detail" x="675" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="675" dy="0">Wiederanlauf</tspan></text>
</svg>
