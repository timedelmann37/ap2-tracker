<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-mail-auth-boundaries-title diagram-mail-auth-boundaries-desc">
  <title id="diagram-mail-auth-boundaries-title">SPF, DKIM und DMARC beantworten verschiedene Fragen</title>
  <desc id="diagram-mail-auth-boundaries-desc">SPF autorisiert einen sendenden Host für eine SMTP-Domäne. DKIM prüft eine Domänensignatur über Nachrichtenteile. DMARC verlangt Alignment zur sichtbaren From-Domäne und veröffentlicht Behandlung sowie Reporting.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">SPF, DKIM und DMARC beantworten verschiedene Fragen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">SPF</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Darf diese Client-IP die</tspan><tspan x="64" dy="30">MAIL-FROM- oder HELO-Domäne</tspan><tspan x="64" dy="30">verwenden?</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">DKIM</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Verifiziert eine</tspan><tspan x="362" dy="30">DNS-gestützte</tspan><tspan x="362" dy="30">Domänensignatur über</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">DMARC</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Ist SPF oder DKIM</tspan><tspan x="660" dy="30">erfolgreich zur sichtbaren</tspan><tspan x="660" dy="30">From-Domäne ausgerichtet,</tspan></text></g>
</svg>
