<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-stimmenbild-title diagram-stimmenbild-desc">
  <title id="diagram-stimmenbild-title">Netz geteilt: 2 Stimmen gegen 1</title>
  <desc id="diagram-stimmenbild-desc">Im vereinfachten Modell haben A, B und W je eine feste Stimme. Mehr als die Hälfte von drei Stimmen sind zwei.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Netz geteilt: 2 Stimmen gegen 1</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">A + Witness</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">A erreicht W und besitzt 2</tspan><tspan x="64" dy="30">von 3 Stimmen. Diese Seite</tspan><tspan x="64" dy="30">darf die Clusterrolle</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">B allein</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">B hat nur 1 von 3 Stimmen. B</tspan><tspan x="362" dy="30">darf den Dienst nicht</tspan><tspan x="362" dy="30">eigenständig als neue aktive</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Kein Knoten erreicht W</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Nach der Trennung hat jede</tspan><tspan x="660" dy="30">Seite nur 1 von 3 Stimmen.</tspan><tspan x="660" dy="30">Im statischen Modell stoppt</tspan></text></g>
</svg>
