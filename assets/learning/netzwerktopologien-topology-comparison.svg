  <title id="diagram-topology-comparison-title">Vier Verbindungsmuster mit vergleichbaren Knoten</title>
  <desc id="diagram-topology-comparison-desc">Stern, Baum, Ring und Teilvermaschung unterscheiden sich durch die Kanten zwischen ihren Knoten, nicht durch die gezeichnete Geräteform.</desc>
