<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-schutz-title diagram-schutz-desc">
  <title id="diagram-schutz-title">Zwei unterschiedliche Schutzaufgaben</title>
  <desc id="diagram-schutz-desc">Versionierung: Frühere Datenstände behalten. Object Lock: Bestimmte Version vor Löschen schützen</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei unterschiedliche Schutzaufgaben</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="429" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Versionierung</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Frühere Datenstände behalten</tspan></text></g><g><rect class="diagram-row" x="489" y="92" width="429" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="511" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="511" dy="0">Object Lock</tspan></text><text x="511" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="511" dy="0">Bestimmte Version vor Löschen schützen</tspan></text></g>
</svg>
