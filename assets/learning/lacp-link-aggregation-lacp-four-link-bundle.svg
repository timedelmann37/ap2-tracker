  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Vier Leitungen, eine logische Verbindung</tspan></text>
  <g class="diagram-edge active"><path d="M180 280 L780 280"/><text class="diagram-edge-label" x="480" y="272" text-anchor="middle">Mitglied 1 · 1 Gbit/s</text></g><g class="diagram-edge active"><path d="M180 280 L780 280"/><text class="diagram-edge-label" x="480" y="272" text-anchor="middle">Mitglied 2 · 1 Gbit/s</text></g><g class="diagram-edge active"><path d="M180 280 L780 280"/><text class="diagram-edge-label" x="480" y="272" text-anchor="middle">Mitglied 3 · 1 Gbit/s</text></g><g class="diagram-edge active"><path d="M180 280 L780 280"/><text class="diagram-edge-label" x="480" y="272" text-anchor="middle">Mitglied 4 · 1 Gbit/s</text></g><g class="diagram-node switch" transform="translate(180 280)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="180" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="180" dy="0">Switch A</tspan></text><text class="diagram-node-detail" x="180" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="180" dy="0">LACP aktiv</tspan></text><g class="diagram-node switch" transform="translate(780 280)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="780" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="780" dy="0">Switch B</tspan></text><text class="diagram-node-detail" x="780" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="780" dy="0">LACP passiv</tspan></text>
