<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Die Datenrate gilt für den vollständigen Übertragungskanal</title>
  <desc id="desc">Das schwächste ungeeignete Glied kann die erreichbare Klasse des Kanals begrenzen.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Die Datenrate gilt für den vollständigen Übertragungskanal</tspan></text>
  <g><rect x="150" y="80" width="660" height="72" rx="14" fill="#dce8df" stroke="#c3cec5"/><text x="178" y="109" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Switch-Port</tspan></text><text x="178" y="136" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">muss den gewünschten Ethernet-Standard unterstützen</tspan></text><path d="M480 148v30" stroke="#7f9183" stroke-width="3"/><path d="m470 170 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="188" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="217" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Patchkabel A</tspan></text><text x="178" y="244" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Kategorie, Länge, Stecker und Qualität zählen zum Kanal</tspan></text><path d="M480 256v30" stroke="#7f9183" stroke-width="3"/><path d="m470 278 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="296" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="325" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Permanent Link</tspan></text><text x="178" y="352" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Installationskabel plus Anschlusskomponenten; typischer</tspan><tspan x="178" dy="25">Planungswert bis 90 m</tspan></text><path d="M480 364v30" stroke="#7f9183" stroke-width="3"/><path d="m470 386 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="404" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="433" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Patchkabel B</tspan></text><text x="178" y="460" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">zusammen mit Patchkabel A typischerweise höchstens 10 m im</tspan><tspan x="178" dy="25">100-m-Kanal</tspan></text><path d="M480 472v30" stroke="#7f9183" stroke-width="3"/><path d="m470 494 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="512" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="541" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">Endgerät</tspan></text><text x="178" y="568" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Netzwerkschnittstelle und Aushandlung müssen die Zielrate</tspan><tspan x="178" dy="25">unterstützen</tspan></text></g>
</svg>
