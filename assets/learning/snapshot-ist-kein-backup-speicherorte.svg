<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-speicherorte-title diagram-speicherorte-desc">
  <title id="diagram-speicherorte-title">Zwei Rückwege – zwei Ausfallgrenzen</title>
  <desc id="diagram-speicherorte-desc">Dasselbe Updateproblem kann mit beiden Verfahren behebbar sein. Beim Verlust des Quellspeichers trennt sich ihr Nutzen.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Zwei Rückwege – zwei Ausfallgrenzen</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Snapshot auf demselben</tspan><tspan x="64" dy="25">Datastore</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Schneller Rücksprung vor dem</tspan><tspan x="64" dy="30">Patch. Basisdaten und</tspan><tspan x="64" dy="30">Delta-Kette hängen jedoch am</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">Separat gespeichertes</tspan><tspan x="362" dy="25">Backup</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Eine unabhängige, geschützte</tspan><tspan x="362" dy="30">Sicherung der benötigten</tspan><tspan x="362" dy="30">Daten oder VM kann auch nach</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Snapshot-gestütztes</tspan><tspan x="660" dy="25">Backup</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Ein Backup-Tool kann einen</tspan><tspan x="660" dy="30">Snapshot als kurzen</tspan><tspan x="660" dy="30">Erfassungspunkt verwenden</tspan></text></g>
</svg>
