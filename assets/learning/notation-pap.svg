<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 630" role="img" aria-labelledby="title desc"><title id="title">Programmablaufplan: Temperatur prüfen</title><desc id="desc">Eigene Lernzeichnung. Der Ablauf und die Zahlen werden im benachbarten Lerntext vollständig erklärt.</desc><style>text{font:16px Arial,sans-serif;fill:#241e2e} .title{font-weight:bold;font-size:19px} .shape{fill:#f3effa;stroke:#65547f;stroke-width:1.8} .line{fill:none;stroke:#65547f;stroke-width:1.8} .small{font-size:14px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#65547f" stroke-width="1.5"/></marker></defs><rect width="360" height="630" fill="#fff"/><text x="180" y="30" text-anchor="middle" class="title">Programmablaufplan</text><rect class="shape" x="125" y="50" width="110" height="40" rx="20"/><text x="180" y="76" text-anchor="middle" class="">Start</text><path class="line" d="M180 90V120" marker-end="url(#arrow)"/><path class="shape" d="M75 120H305L285 165H55Z"/><text x="180" y="148" text-anchor="middle" class="">Temperatur einlesen</text><path class="line" d="M180 165V200" marker-end="url(#arrow)"/><path class="shape" d="M180 200L290 265L180 330L70 265Z"/><text x="180" y="260" text-anchor="middle" class="">Temperatur</text><text x="180" y="282" text-anchor="middle" class="">≥ 30?</text><path class="line" d="M70 265H40V375" marker-end="url(#arrow)"/><path class="line" d="M290 265H320V375" marker-end="url(#arrow)"/><text x="48" y="252" text-anchor="middle" class="">ja</text><text x="315" y="252" text-anchor="middle" class="">nein</text><path class="shape" d="M22 375H164L150 425H8Z"/><path class="shape" d="M212 375H350L336 425H198Z"/><text x="86" y="397" text-anchor="middle" class="">Ausgabe</text><text x="86" y="417" text-anchor="middle" class="">„Warnung“</text><text x="275" y="397" text-anchor="middle" class="">Ausgabe</text><text x="275" y="417" text-anchor="middle" class="">„OK“</text><path class="line" d="M86 425V452H180M275 425V452H180V480" marker-end="url(#arrow)"/><path class="shape" d="M85 480H295L275 525H65Z"/><text x="180" y="508" text-anchor="middle" class="">Ausgabe „Ende“</text><path class="line" d="M180 525V560" marker-end="url(#arrow)"/><rect class="shape" x="125" y="560" width="110" height="40" rx="20"/><text x="180" y="586" text-anchor="middle" class="">Ende</text></svg>
