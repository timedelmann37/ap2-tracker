<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Singlemode und Multimode sind keine Reichweitenangaben allein</title>
  <desc id="desc">Singlemode führt im vorgesehenen Betrieb einen Modus und vermeidet modale Dispersion. Multimode führt mehrere Moden und wird häufig für kürzere Gebäudestrecken eingesetzt. In beiden Fällen entscheidet erst die gesamte Link-Spezifikation.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Singlemode und Multimode sind keine Reichweitenangaben</tspan><tspan x="42" dy="25">allein</tspan></text>
  <g><rect x="42" y="92" width="429" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="64" dy="0">Singlemode</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="64" dy="0">Ein geführter Modus, keine modale</tspan><tspan x="64" dy="30">Dispersion; häufige Wahl für lange</tspan><tspan x="64" dy="30">Strecken. Passende SMF-Optik, Wellenlänge,</tspan></text></g><g><rect x="489" y="92" width="429" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="511" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="511" dy="0">Multimode</tspan></text><text x="511" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="511" dy="0">Mehrere Lichtwege beziehungsweise Moden;</tspan><tspan x="511" dy="30">modale Dispersion begrenzt den Link je</tspan><tspan x="511" dy="30">nach PHY. Häufig für kurze Verbindungen im</tspan></text></g>
</svg>
