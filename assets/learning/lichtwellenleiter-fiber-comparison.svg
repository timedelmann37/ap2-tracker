<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-fiber-comparison-title diagram-fiber-comparison-desc">
  <title id="diagram-fiber-comparison-title">Singlemode und Multimode sind keine Reichweitenangaben allein</title>
  <desc id="diagram-fiber-comparison-desc">Singlemode führt im vorgesehenen Betrieb einen Modus und vermeidet modale Dispersion. Multimode führt mehrere Moden und wird häufig für kürzere Gebäudestrecken eingesetzt. In beiden Fällen entscheidet erst die gesamte Link-Spezifikation.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Singlemode und Multimode sind keine Reichweitenangaben</tspan><tspan x="42" dy="25">allein</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="429" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Singlemode</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Ein geführter Modus, keine modale</tspan><tspan x="64" dy="30">Dispersion; häufige Wahl für lange</tspan><tspan x="64" dy="30">Strecken. Passende SMF-Optik, Wellenlänge,</tspan></text></g><g><rect class="diagram-row" x="489" y="92" width="429" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="511" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="511" dy="0">Multimode</tspan></text><text x="511" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="511" dy="0">Mehrere Lichtwege beziehungsweise Moden;</tspan><tspan x="511" dy="30">modale Dispersion begrenzt den Link je</tspan><tspan x="511" dy="30">nach PHY. Häufig für kurze Verbindungen im</tspan></text></g>
</svg>
