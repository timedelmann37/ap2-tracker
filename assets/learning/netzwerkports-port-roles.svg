<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Portrollen im Vergleich</title>
  <desc id="desc">Serverport, dynamischer Clientport und vollständiger Kommunikationsfluss erfüllen unterschiedliche Aufgaben.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Portrollen im Vergleich</tspan></text>
  <g><rect x="42" y="92" width="280" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="64" dy="0">Serverport</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="64" dy="0">meist stabil konfiguriert;</tspan><tspan x="64" dy="30">macht einen Dienst unter</tspan><tspan x="64" dy="30">einem erwarteten Endpunkt</tspan></text></g><g><rect x="340" y="92" width="280" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="362" dy="0">Clientport</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="362" dy="0">meist dynamisch gewählt;</tspan><tspan x="362" dy="30">ordnet Antworten genau dem</tspan><tspan x="362" dy="30">anfragenden Socket zu</tspan></text></g><g><rect x="638" y="92" width="280" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="660" dy="0">5-Tupel</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="660" dy="0">Transportprotokoll,</tspan><tspan x="660" dy="30">Quell-IP, Quellport, Ziel-IP</tspan><tspan x="660" dy="30">und Zielport beschreiben</tspan></text></g>
</svg>
