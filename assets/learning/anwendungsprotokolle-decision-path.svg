<svg xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="title desc">
  <title id="title">Vom Bedarf zur belastbaren Protokollentscheidung</title>
  <desc id="desc">Eine prüfbare Auswahl trennt Dienstrolle, Kommunikationsrichtung, Transport und Schutz.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Vom Bedarf zur belastbaren Protokollentscheidung</tspan></text>
  <g><rect x="150" y="80" width="660" height="72" rx="14" fill="#dce8df" stroke="#c3cec5"/><text x="178" y="109" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">1 · Dienstrolle</tspan></text><text x="178" y="136" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Soll die Anwendung Webseiten liefern, Dateien übertragen,</tspan><tspan x="178" dy="25">Nachrichten senden, ein Postfach lesen oder Systeme verwalten?</tspan></text><path d="M480 148v30" stroke="#7f9183" stroke-width="3"/><path d="m470 170 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="188" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="217" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">2 · Kommunikationsweg</tspan></text><text x="178" y="244" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">Client und Server, Quelle und Ziel sowie Initiator der</tspan><tspan x="178" dy="25">Verbindung festlegen</tspan></text><path d="M480 256v30" stroke="#7f9183" stroke-width="3"/><path d="m470 278 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="296" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="325" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">3 · Transport und Port</tspan></text><text x="178" y="352" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">TCP, UDP oder QUIC sowie den tatsächlich konfigurierten Port</tspan><tspan x="178" dy="25">getrennt betrachten</tspan></text><path d="M480 364v30" stroke="#7f9183" stroke-width="3"/><path d="m470 386 10 10 10-10" fill="none" stroke="#7f9183" stroke-width="3"/></g><g><rect x="150" y="404" width="660" height="72" rx="14" fill="#f8faf6" stroke="#c3cec5"/><text x="178" y="433" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#17211b"><tspan x="178" dy="0">4 · Schutzprofil</tspan></text><text x="178" y="460" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#48564c"><tspan x="178" dy="0">TLS, SSH, Authentisierung und sichere Protokollversion passend</tspan><tspan x="178" dy="25">zum Risiko festlegen</tspan></text></g>
</svg>
