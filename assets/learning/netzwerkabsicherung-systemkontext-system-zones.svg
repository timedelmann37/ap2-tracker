<svg class="learning-diagram diagram-topology" xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="diagram-system-zones-title diagram-system-zones-desc">
  <title id="diagram-system-zones-title">Nur benötigte Dienstwege</title>
  <desc id="diagram-system-zones-desc">Eigene logische Dienstarchitektur: Internet initiiert HTTPS zum DMZ-Portal; Portal initiiert TCP 8443 zur internen API; API initiiert TCP 5432 zur Datenbank. Zonenübergänge sind firewallkontrolliert. Keine Direktfreigabe Internet zur API oder Datenbank.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Nur benötigte Dienstwege</tspan></text>
  <g class="diagram-zone "><rect x="40" y="170" width="220" height="190" rx="18"/><text x="56" y="197">Extern</text></g><g class="diagram-zone "><rect x="375" y="170" width="210" height="190" rx="18"/><text x="391" y="197">DMZ</text></g><g class="diagram-zone "><rect x="685" y="170" width="240" height="340" rx="18"/><text x="701" y="197">Intern</text></g><g class="diagram-edge "><path d="M150 280 L480 280"/><text class="diagram-edge-label" x="315" y="272" text-anchor="middle">TCP 443</text></g><g class="diagram-edge "><path d="M480 280 L800 280"/><text class="diagram-edge-label" x="640" y="272" text-anchor="middle">TCP 8443</text></g><g class="diagram-edge "><path d="M800 280 L800 440"/><text class="diagram-edge-label" x="800" y="352" text-anchor="middle">TCP 5432</text></g><g class="diagram-node device" transform="translate(150 280)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="150" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="150" dy="0">Internet</tspan></text><text class="diagram-node-detail" x="150" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="150" dy="0">Externe Clients</tspan></text><g class="diagram-node device" transform="translate(480 280)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="480" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="480" dy="0">Portal</tspan></text><text class="diagram-node-detail" x="480" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="480" dy="0">DMZ-Dienst</tspan></text><g class="diagram-node device" transform="translate(800 280)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="800" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="800" dy="0">API</tspan></text><text class="diagram-node-detail" x="800" y="299" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="800" dy="0">Interner Dienst</tspan></text><g class="diagram-node device" transform="translate(800 440)"><rect x="-76" y="-34" width="152" height="68" rx="14"/></g><text class="diagram-node-label" x="800" y="435" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="800" dy="0">Datenbank</tspan></text><text class="diagram-node-detail" x="800" y="459" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="var(--diagram-muted, #c8c1d2)"><tspan x="800" dy="0">Nur API-Zugriff</tspan></text>
</svg>
