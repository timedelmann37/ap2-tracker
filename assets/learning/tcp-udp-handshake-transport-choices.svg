<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">TCP und UDP verteilen Verantwortung unterschiedlich</title>
  <desc id="desc">TCP pflegt einen Verbindungszustand und liefert einen geordneten Bytestrom. UDP erhält Datagrammgrenzen, baut selbst keine Verbindung auf und überlässt Wiederholung sowie Reihenfolge der Anwendung.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">TCP und UDP verteilen Verantwortung unterschiedlich</tspan></text>
  <g><rect x="42" y="92" width="429" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="64" dy="0">TCP</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="64" dy="0">Verbindungszustand, Reihenfolge,</tspan><tspan x="64" dy="30">Bestätigungen, Wiederholung, Fluss- und</tspan><tspan x="64" dy="30">Überlastungssteuerung</tspan></text></g><g><rect x="489" y="92" width="429" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="511" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="511" dy="0">UDP</tspan></text><text x="511" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="511" dy="0">Datagramme ohne TCP-Handshake; keine</tspan><tspan x="511" dy="30">eingebaute Reihenfolge oder Wiederholung</tspan><tspan x="511" dy="30">verlorener Datagramme</tspan></text></g>
</svg>
