<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-edge-port-decisions-title diagram-edge-port-decisions-desc">
  <title id="diagram-edge-port-decisions-title">Portrolle entscheidet über Edge-Schutz</title>
  <desc id="diagram-edge-port-decisions-desc">Die Konfiguration folgt der physisch und organisatorisch garantierten Rolle, nicht dem Portnamen.</desc>
