<svg class="learning-diagram diagram-flow" xmlns="http://www.w3.org/2000/svg" width="960" height="542" viewBox="0 0 960 542" role="img" aria-labelledby="diagram-fallakten-title diagram-fallakten-desc">
  <title id="diagram-fallakten-title">Verknüpfte Fallakten</title>
  <desc id="diagram-fallakten-desc">Eigene Fallfolge, keine allgemeine Pflichtkette.</desc>
