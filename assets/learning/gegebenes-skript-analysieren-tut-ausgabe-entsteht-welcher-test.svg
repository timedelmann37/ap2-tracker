<svg class="learning-diagram diagram-flow" xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" aria-labelledby="diagram-test-title diagram-test-desc">
  <title id="diagram-test-title">Korrektur überprüfen</title>
