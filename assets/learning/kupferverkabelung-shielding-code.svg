<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Der Schirmungscode hat zwei Positionen</title>
  <desc id="desc">Vor dem Schrägstrich steht der Gesamtschirm, danach die Schirmung der einzelnen verdrillten Paare.</desc>
  <rect width="100%" height="100%" rx="20" fill="#f7f8f4"/>
  <text x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#17211b"><tspan x="42" dy="0">Der Schirmungscode hat zwei Positionen</tspan></text>
  <g><rect x="42" y="92" width="205" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="64" dy="0">U/UTP</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="64" dy="0">kein Gesamtschirm;</tspan><tspan x="64" dy="30">einzelne Paare</tspan><tspan x="64" dy="30">ungeschirmt, ihre</tspan></text></g><g><rect x="265" y="92" width="205" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="287" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="287" dy="0">F/UTP</tspan></text><text x="287" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="287" dy="0">Folienschirm um das</tspan><tspan x="287" dy="30">Gesamtkabel;</tspan><tspan x="287" dy="30">einzelne Paare ohne</tspan></text></g><g><rect x="488" y="92" width="205" height="252" rx="16" fill="#e7efe8" stroke="#c3cec5"/><text x="510" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="510" dy="0">U/FTP</tspan></text><text x="510" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="510" dy="0">kein Gesamtschirm;</tspan><tspan x="510" dy="30">jedes Adernpaar</tspan><tspan x="510" dy="30">besitzt einen</tspan></text></g><g><rect x="711" y="92" width="205" height="252" rx="16" fill="#f3f6f1" stroke="#c3cec5"/><text x="733" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#17211b"><tspan x="733" dy="0">S/FTP</tspan></text><text x="733" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="#344239"><tspan x="733" dy="0">Geflechtschirm um</tspan><tspan x="733" dy="30">das Gesamtkabel und</tspan><tspan x="733" dy="30">Folienschirm um</tspan></text></g>
</svg>
