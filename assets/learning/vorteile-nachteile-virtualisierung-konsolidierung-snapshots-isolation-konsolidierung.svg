<svg class="learning-diagram diagram-comparison" xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="diagram-konsolidierung-title diagram-konsolidierung-desc">
  <title id="diagram-konsolidierung-title">Weniger Hardware, gemeinsamer Ausfallort</title>
  <desc id="diagram-konsolidierung-desc">Vier Dienste werden auf vier VMs eines Hosts konsolidiert; die Dienste bleiben logisch getrennt, teilen aber physische Abhängigkeiten.</desc>
  <rect class="diagram-canvas" width="100%" height="100%" rx="20" fill="var(--diagram-canvas, #17121f)"/>
  <text class="diagram-title" x="42" y="48" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="42" dy="0">Weniger Hardware, gemeinsamer Ausfallort</tspan></text>
  <g><rect class="diagram-row" x="42" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="64" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="64" dy="0">Vorher: vier Server</tspan></text><text x="64" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="64" dy="0">Jeder Dienst hat einen</tspan><tspan x="64" dy="30">eigenen physischen Rechner.</tspan><tspan x="64" dy="30">Das ist kein automatisches</tspan></text></g><g><rect class="diagram-row" x="340" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface-alt, #2c2438)" stroke="var(--diagram-border, #5f526e)"/><text x="362" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="362" dy="0">Nachher: ein Host, vier</tspan><tspan x="362" dy="25">VMs</tspan></text><text x="362" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="362" dy="0">Weniger physische Systeme zu</tspan><tspan x="362" dy="30">betreiben; jede VM hat ein</tspan><tspan x="362" dy="30">Gast-OS und ihre eigene</tspan></text></g><g><rect class="diagram-row" x="638" y="92" width="280" height="252" rx="16" fill="var(--diagram-surface, #241e2e)" stroke="var(--diagram-border, #5f526e)"/><text x="660" y="132" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="var(--diagram-text, #f1f0ec)"><tspan x="660" dy="0">Gemeinsame Basis</tspan></text><text x="660" y="180" font-family="Inter, Arial, sans-serif" font-size="20" fill="var(--diagram-muted, #c8c1d2)"><tspan x="660" dy="0">Host, Hypervisor, lokale</tspan><tspan x="660" dy="30">Stromversorgung und</tspan><tspan x="660" dy="30">gemeinsam genutzter Speicher</tspan></text></g>
</svg>
