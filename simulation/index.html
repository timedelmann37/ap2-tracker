<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prüfungssimulation – AP2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    /* Flächen */
    --page:           #000000;
    --surface-1:      #131417;
    --surface-2:      #1e2024;
    --panel-glass:    rgba(16, 17, 20, 0.88);
    --grid:           #26282d;
    --baseline:       #3c4046;
    --border:         rgba(255, 255, 255, 0.09);
    --border-strong:  #3a3d43;

    /* Text */
    --text-primary:   #dfe1e5;
    --text-secondary: #a9aeb6;
    --text-muted:     #7a7e85;

    /* Akzente = Syntaxfarben */
    --accent:         #3574f0;
    --cat-ga1:        #56a8f5;
    --cat-ga2:        #cf8e6d;
    --cat-wiso:       #6aab73;
    --marker:         #c77dbb;
    --success:        #6aab73;
    --status-good:    #6aab73;
    --status-warning: #d9a343;
    --status-critical:#e05561;
    
    --r-xs: 3px;
    --r-sm: 5px;
    --r-md: 8px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.24);
  }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme: light;
      --page:           #f7f8fa;
      --surface-1:      #ffffff;
      --surface-2:      #f0f1f4;
      --panel-glass:    rgba(255, 255, 255, 0.88);
      --grid:           #ebecf0;
      --baseline:       #c4c7d0;
      --border:         rgba(30, 31, 34, 0.12);
      --border-strong:  #c9ccd4;
      --text-primary:   #1e1f22;
      --text-secondary: #4d5158;
      --text-muted:     #818594;
    }
  }

  :root[data-theme="light"]{
      color-scheme: light;
      --page:           #f7f8fa;
      --surface-1:      #ffffff;
      --surface-2:      #f0f1f4;
      --panel-glass:    rgba(255, 255, 255, 0.88);
      --grid:           #ebecf0;
      --baseline:       #c4c7d0;
      --border:         rgba(30, 31, 34, 0.12);
      --border-strong:  #c9ccd4;
      --text-primary:   #1e1f22;
      --text-secondary: #4d5158;
      --text-muted:     #818594;
  }
  :root[data-theme="dark"]{
      color-scheme: dark;
      --page:           #000000;
      --surface-1:      #131417;
      --surface-2:      #1e2024;
      --panel-glass:    rgba(16, 17, 20, 0.88);
      --grid:           #26282d;
      --baseline:       #3c4046;
      --border:         rgba(255, 255, 255, 0.09);
      --border-strong:  #3a3d43;
      --text-primary:   #dfe1e5;
      --text-secondary: #a9aeb6;
      --text-muted:     #7a7e85;
  }

  * { box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--page);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding: 34px 20px 90px;
  }
  .page{ max-width: 1120px; margin: 0 auto; }

  /* Header */
  .header{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:16px; margin-bottom: 22px; flex-wrap: wrap;
  }
  .crumb{
    font-family: var(--font-mono); font-size:11px; color: var(--text-muted);
    letter-spacing:.02em; margin-bottom:7px;
  }
  .crumb .sep{ opacity:.5; padding:0 2px; }
  .crumb b{ color: var(--cat-ga1); font-weight:500; }
  .crumb a{ color: inherit; text-decoration: none; }
  .crumb a:hover{ color: var(--text-primary); }
  .header h1{ font-size: 27px; font-weight: 700; margin: 0 0 5px; }
  .header p{ margin:0; color: var(--text-secondary); font-size: 13.5px; line-height:1.55; }
  
  .btn{
    border: 1px solid var(--border); background: var(--panel-glass); color: var(--text-secondary);
    border-radius: var(--r-sm); padding: 8px 13px; font-size: 12.5px; cursor:pointer;
    font-family: inherit; font-weight:500; display: inline-block;
  }
  .btn:hover{ color: var(--text-primary); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 80%, black); }

  /* Panels */
  .panel{
    background: var(--panel-glass);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-sm);
    padding: 22px 24px; margin-bottom: 20px;
  }
  
  .panel-head{ display:flex; justify-content:space-between; align-items:baseline; gap: 12px; margin-bottom: 12px;}
  .panel-head h2{ font-size: 15px; margin:0; font-weight:600; }
  .panel-head .timer{ font-family: var(--font-mono); font-size: 24px; font-weight: 600; color: var(--status-good); }

  /* Cards */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .sim-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 16px; cursor: pointer; transition: border-color .15s ease;
  }
  .sim-card:hover { border-color: var(--accent); }
  .sim-card h3 { margin: 0 0 8px 0; font-size: 15px; }
  .sim-card p { margin: 0 0 12px 0; font-size: 13px; color: var(--text-secondary); }
  
  /* Exam View */
  #exam-view { display: none; }
  .exam-content {
     min-height: 400px;
     border-radius: var(--r-md);
     margin-bottom: 20px;
  }

  /* Rich Exam Elements */
  .ausgangssituation-box {
      background: var(--surface-2);
      border-left: 4px solid var(--cat-ga1);
      padding: 16px;
      margin-bottom: 24px;
      border-radius: 0 var(--r-md) var(--r-md) 0;
  }
  .ausgangssituation-box h3 { margin: 0 0 8px; font-size: 16px; color: var(--cat-ga1); }
  .ausgangssituation-box p { margin: 0; font-size: 14px; line-height: 1.6; }
  
  /* Modal / Drawer für Anlage */
  .modal-overlay {
      position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-content {
      background: var(--surface-1); width: 95%; max-width: 1000px; max-height: 90vh;
      border-radius: var(--r-md); border: 1px solid var(--border-strong);
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { margin: 0; font-size: 18px; }
  .modal-body {
      padding: 24px; overflow-y: auto; background: var(--page);
  }

  .task-context {
      background: var(--surface-2); padding: 16px; margin: 24px 0 16px;
      border-radius: var(--r-md); font-style: italic; border: 1px solid var(--border);
  }
  .subtask-container {
      margin-bottom: 24px; padding: 16px; background: var(--surface-1);
      border: 1px solid var(--border); border-radius: var(--r-md);
  }
  .subtask-section-title {
      font-weight: 600; color: var(--accent); margin: 0 0 12px; font-size: 15px;
  }
  .subtask-intro {
      margin-bottom: 12px; line-height: 1.5; color: var(--text-secondary);
  }
  .subtask-question {
      font-weight: 600; margin: 0 0 16px; line-height: 1.5; font-size: 15px;
  }
  
  /* Inputs */
  .exam-textarea {
      width: 100%; min-height: 100px; background: var(--surface-1); color: var(--text-primary);
      border: 1px solid var(--border-strong); border-radius: var(--r-sm);
      padding: 12px; font-family: inherit; font-size: 14px; line-height: 1.5; resize: vertical;
  }
  .exam-textarea:focus { border-color: var(--accent); outline: none; }
  
  /* Table Inputs */
  .exam-table {
      width: 100%; border-collapse: collapse; margin-bottom: 16px;
      background: var(--surface-1);
  }
  .exam-table th, .exam-table td {
      border: 1px solid var(--border-strong); padding: 8px 12px; text-align: left;
      font-size: 13.5px;
  }
  .exam-table th { background: var(--surface-2); font-weight: 600; }
  .exam-table input, .exam-table textarea {
      width: 100%; background: transparent; color: var(--text-primary);
      border: 1px solid transparent; padding: 4px; font-family: inherit; font-size: 13.5px;
  }
  .exam-table input:focus, .exam-table textarea:focus {
      border-bottom: 1px solid var(--accent); outline: none;
  }
  .exam-table textarea { resize: vertical; min-height: 40px; }
  .readonly-cell { color: var(--text-secondary); }
  
  /* Diagram & SVGs */
  .diagram-box {
      margin: 16px 0; border: 1px solid var(--border-strong); border-radius: var(--r-sm);
      background: var(--surface-1); padding: 16px; overflow-x: auto; text-align: center;
  }
  .network-diagram-svg, .exam-diagram-svg {
      max-width: 100%; height: auto;
  }

  /* Visual Radio Options */
  .radio-visual-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;
  }
  .radio-visual-card {
      border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 12px;
      cursor: pointer; background: var(--surface-2); transition: border .2s;
  }
  .radio-visual-card:hover { border-color: var(--text-secondary); }
  .radio-visual-card input { margin-right: 8px; }
  .radio-visual-card label { cursor: pointer; display: flex; align-items: center; margin-bottom: 8px; font-weight: 500;}
  
  /* Terminal / Code blocks */
  .terminal-block {
      background: #0d1117; color: #c9d1d9; padding: 16px; border-radius: var(--r-md);
      font-family: var(--font-mono); font-size: 13px; line-height: 1.5; overflow-x: auto;
      margin: 16px 0; border: 1px solid #30363d; white-space: pre-wrap;
  }
  .quote-block {
      border-left: 3px solid var(--text-secondary); padding-left: 16px; margin: 16px 0;
      color: var(--text-secondary); font-style: italic; background: var(--surface-2); padding: 12px 16px; border-radius: 0 var(--r-md) var(--r-md) 0;
  }

  /* Result Grid & Elements */
  .result-compare-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px;
      background: var(--surface-1); padding: 16px; border-radius: var(--r-sm); border: 1px solid var(--border);
  }
  @media (max-width: 860px) {
      .result-compare-grid { grid-template-columns: 1fr; }
  }
  .result-column { display: flex; flex-direction: column; min-width: 0; }
  .result-header { margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .badge-user {
      display: inline-block; padding: 3px 8px; border-radius: var(--r-xs);
      background: rgba(255,255,255,0.08); color: var(--text-secondary); font-size: 11.5px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge-sol {
      display: inline-block; padding: 3px 8px; border-radius: var(--r-xs);
      background: rgba(106, 171, 115, 0.16); color: var(--status-good); font-size: 11.5px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      border: 1px solid rgba(106, 171, 115, 0.35);
  }
  .badge-correct {
      display: inline-block; padding: 2px 7px; border-radius: var(--r-xs);
      background: rgba(106, 171, 115, 0.2); color: var(--status-good); font-size: 11px;
      font-weight: 600; margin-left: 6px;
  }
  .badge-incorrect {
      display: inline-block; padding: 2px 7px; border-radius: var(--r-xs);
      background: rgba(224, 85, 97, 0.2); color: var(--status-critical); font-size: 11px;
      font-weight: 600; margin-left: 6px;
  }
  .sol-highlight {
      background: rgba(106, 171, 115, 0.18) !important;
      color: var(--status-good) !important;
      font-weight: 700;
      border-radius: var(--r-xs);
      padding: 2px 6px;
      display: inline-block;
  }
  .user-highlight-ok {
      color: var(--status-good) !important;
      font-weight: 600;
  }
  .user-highlight-empty {
      color: var(--text-muted) !important;
      font-style: italic;
  }
  .solution-diagram-box {
      margin: 10px 0 14px; border: 1px solid rgba(106, 171, 115, 0.35);
      border-radius: var(--r-sm); background: var(--surface-1); padding: 12px;
      text-align: center;
  }
  .diagram-header-tag {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--cat-ga1); margin-bottom: 8px; text-align: left;
  }
  .result-user { color: var(--text-secondary); }
  .result-sol { color: var(--status-good); }
  .result-content { line-height: 1.6; color: var(--text-primary); font-size: 13.5px; white-space: pre-wrap; }
  .result-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  .result-table th, .result-table td { border: 1px solid var(--border-strong); padding: 6px 10px; text-align: left; }
  .result-table th { background: var(--surface-2); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <div class="crumb"><a href="../index.html">AP2</a> <span class="sep">/</span> <b>Simulation</b></div>
      <h1 id="page-title">Prüfungssimulation</h1>
      <p id="page-desc">Wähle eine Prüfung aus, um die Simulation zu starten.</p>
    </div>
    <button class="btn" onclick="toggleTheme()">Theme umschalten</button>
  </div>

   <!-- AUSWAHL ANSICHT -->
  <div id="selection-view">
    <div class="panel">
      <div class="panel-head">
        <h2>Verfügbare Prüfungen</h2>
      </div>
      <div class="cards-grid">
         <div class="sim-card" onclick="startExam('Sommer 2023 - GA2', 'exam_2023_1_GA2')">
            <h3>Sommer 2023 - GA2</h3>
            <p>Dauer: 90 Minuten</p>
            <span class="btn">Starten</span>
         </div>
      </div>
    </div>
  </div>

  <!-- PRÜFUNGS ANSICHT -->
  <div id="exam-view">
     <div class="panel">
        <div class="panel-head">
           <div>
               <h2 id="current-exam-title">Prüfungstitel</h2>
               <div id="current-exam-subtitle" style="font-size:12px; color:var(--text-muted); margin-top:4px;"></div>
           </div>
           <div class="timer" id="exam-timer">90:00</div>
        </div>
        
        <div class="exam-content" id="exam-container">
           <!-- Hier werden die Prüfungsinhalte reingerendert -->
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:20px; padding-top: 20px; border-top: 1px solid var(--border);">
           <button class="btn" onclick="cancelExam()">Abbrechen</button>
           <button class="btn primary" onclick="submitExam()">Prüfung abgeben</button>
        </div>
     </div>
  </div>

   <!-- VERGLEICHS ANSICHT -->
   <div id="result-view" style="display:none;">
      <div class="panel">
         <div class="panel-head" style="flex-wrap:wrap; gap:16px;">
            <div>
               <h2>Auswertung: <span id="result-exam-title"></span></h2>
               <div style="font-size:12.5px; color:var(--text-muted); margin-top:4px;">Vergleiche deine Antworten mit den offiziellen IHK-Lösungshinweisen.</div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
               <button class="btn primary" onclick="openAnlageModal()">🗺️ Anlage 1: Netzwerkplan öffnen</button>
               <button class="btn" onclick="closeResults()">Zurück zur Übersicht</button>
            </div>
         </div>
         <div id="result-container" style="display:flex; flex-direction:column; gap:24px;">
            <!-- Hier kommen die Vergleiche hin -->
         </div>
         <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap:wrap; gap:12px;">
            <button class="btn" onclick="openAnlageModal()">🗺️ Anlage 1: Netzwerkplan öffnen</button>
            <button class="btn primary" onclick="closeResults()">Zurück zur Übersicht</button>
         </div>
      </div>
   </div>
   
   <!-- ANLAGE MODAL -->
   <div class="modal-overlay" id="anlage-modal">
       <div class="modal-content">
           <div class="modal-header">
               <h2 id="modal-title">Anlage 1</h2>
               <button class="btn" onclick="closeModal()">Schließen</button>
           </div>
           <div class="modal-body" id="modal-body">
           </div>
       </div>
   </div>

</div>

<!-- Daten laden -->
<script src="exam_2023_1_GA2.js"></script>
<script>
  let currentExamData = null;
  let examTimerInterval = null;
  let timeRemaining = 0;

  function updateTimerDisplay() {
      if(timeRemaining < 0) timeRemaining = 0;
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      document.getElementById('exam-timer').innerText = 
          `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
  }

  function toggleTheme(){
    const root = document.documentElement;
    if (root.getAttribute('data-theme') === 'light'){
      root.setAttribute('data-theme', 'dark');
    } else {
      root.setAttribute('data-theme', 'light');
    }
  }

  function openModal(title, contentHTML) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = contentHTML;
      document.getElementById('anlage-modal').style.display = 'flex';
  }
  function closeModal() {
      document.getElementById('anlage-modal').style.display = 'none';
  }
  function openAnlageModal() {
      if (currentExamData && currentExamData.ausgangssituation) {
          const as = currentExamData.ausgangssituation;
          openModal(as.anlageTitle, `<div style="font-size:13.5px; line-height:1.5; color:var(--text-secondary); margin-bottom:16px;">${as.anlageDescription}</div>${as.anlageSvg}`);
      }
  }

  function startExam(title, dataObjName) {
     if (dataObjName && window[dataObjName]) {
         currentExamData = window[dataObjName];
     } else if (dataObjName && !window[dataObjName]) {
         alert("Die Prüfungsdaten (" + dataObjName + ".js) konnten nicht geladen werden.\n\nWenn du die Seite lokal als Datei öffnest, blockieren manche Browser das Laden externer Scripts.\n\nLösung: Öffne die Seite über einen lokalen Webserver, z.B.:\n  python -m http.server 8000\noder deploye auf Netlify.");
         return;
     } else {
         alert("Für diese Prüfung sind noch keine Daten hinterlegt.");
         return;
     }

     document.getElementById('selection-view').style.display = 'none';
     document.getElementById('result-view').style.display = 'none';
     document.getElementById('exam-view').style.display = 'block';
     
     document.getElementById('page-title').innerText = 'Simulationsmodus';
     document.getElementById('page-desc').innerText = 'Viel Erfolg! Die Prüfung wird nun simuliert.';
     document.getElementById('current-exam-title').innerText = currentExamData.title;
     document.getElementById('current-exam-subtitle').innerText = currentExamData.subtitle || '';
     
     if (examTimerInterval) clearInterval(examTimerInterval);
     timeRemaining = (currentExamData.duration || 90) * 60;
     updateTimerDisplay();
     examTimerInterval = setInterval(() => {
         timeRemaining--;
         updateTimerDisplay();
         if(timeRemaining <= 0) {
             clearInterval(examTimerInterval);
             alert("Die Zeit ist abgelaufen! Die Prüfung wird nun automatisch abgegeben.");
             showResults();
         }
     }, 1000);

     const container = document.getElementById('exam-container');
     container.innerHTML = ''; 

     // 1. Ausgangssituation
     if (currentExamData.ausgangssituation) {
         const as = currentExamData.ausgangssituation;
         const box = document.createElement('div');
         box.className = 'ausgangssituation-box';
         box.innerHTML = `
            <h3>${as.title}</h3>
            <p>${as.text}</p>
         `;
         
         if (as.anlageSvg) {
             const btn = document.createElement('button');
             btn.className = 'btn primary';
             btn.style.marginTop = '12px';
             btn.innerText = '🗺️ ' + as.anlageTitle + ' öffnen';
             btn.onclick = () => openAnlageModal();
             box.appendChild(btn);
         }
         container.appendChild(box);
     }

     // 2. Aufgaben rendern
     currentExamData.tasks.forEach(task => {
         const taskWrap = document.createElement('div');
         
         const taskHeader = document.createElement('h3');
         taskHeader.innerText = `${task.title} (${task.points} Punkte)`;
         taskHeader.style.marginTop = '32px';
         taskHeader.style.borderBottom = '2px solid var(--border-strong)';
         taskHeader.style.paddingBottom = '8px';
         taskWrap.appendChild(taskHeader);
         
         if (task.context) {
             const tContext = document.createElement('div');
             tContext.className = 'task-context';
             tContext.innerText = task.context;
             taskWrap.appendChild(tContext);
         }

         task.subtasks.forEach(sub => {
             const subContainer = document.createElement('div');
             subContainer.className = 'subtask-container';

             if (sub.sectionTitle) {
                 const sTitle = document.createElement('h4');
                 sTitle.className = 'subtask-section-title';
                 sTitle.innerText = sub.sectionTitle;
                 subContainer.appendChild(sTitle);
             }
             if (sub.intro) {
                 const sIntro = document.createElement('div');
                 sIntro.className = 'subtask-intro';
                 sIntro.innerText = sub.intro;
                 subContainer.appendChild(sIntro);
             }
             if (sub.intro2) {
                 const sIntro2 = document.createElement('div');
                 sIntro2.className = 'subtask-intro';
                 sIntro2.innerText = sub.intro2;
                 subContainer.appendChild(sIntro2);
             }
             if (sub.terminalOutput) {
                 const term = document.createElement('pre');
                 term.className = 'terminal-block';
                 term.innerText = sub.terminalOutput;
                 subContainer.appendChild(term);
             }
             if (sub.quoteText) {
                 const quote = document.createElement('div');
                 quote.className = 'quote-block';
                 quote.innerText = sub.quoteText;
                 subContainer.appendChild(quote);
             }
             if (sub.diagramSvg) {
                 const diag = document.createElement('div');
                 diag.className = 'diagram-box';
                 diag.innerHTML = sub.diagramSvg;
                 subContainer.appendChild(diag);
             }
             if (sub.tableData) {
                 const tblBox = document.createElement('div');
                 tblBox.style.overflowX = 'auto';
                 tblBox.style.marginBottom = '16px';
                 let tblHtml = `<table class="exam-table" style="min-width:600px;">
                    <thead><tr>${sub.tableData.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                    <tbody>`;
                 sub.tableData.rows.forEach(r => {
                     tblHtml += `<tr>${r.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
                 });
                 tblHtml += `</tbody></table>`;
                 tblBox.innerHTML = `<div style="font-weight:600; font-size:13px; margin-bottom:6px;">${sub.tableData.title}</div>` + tblHtml;
                 subContainer.appendChild(tblBox);
             }

             const qText = document.createElement('div');
             qText.className = 'subtask-question';
             qText.innerText = `${sub.text} (${sub.points} Punkte)`;
             subContainer.appendChild(qText);

             // Input rendering based on type
             if (sub.type === 'textarea') {
                 const textarea = document.createElement('textarea');
                 textarea.id = `input-${sub.id}`;
                 textarea.className = 'exam-textarea';
                 subContainer.appendChild(textarea);
             } else if (sub.type === 'split_textarea') {
                 const grid = document.createElement('div');
                 grid.style.display = 'grid'; grid.style.gap = '16px';
                 sub.fields.forEach(f => {
                     const wrap = document.createElement('div');
                     wrap.innerHTML = `<div style="font-weight:500; margin-bottom:6px;">${f.label}</div>`;
                     const t = document.createElement('textarea');
                     t.id = `input-${f.id}`;
                     t.className = 'exam-textarea';
                     t.placeholder = f.placeholder || '';
                     if(f.rows) t.rows = f.rows;
                     wrap.appendChild(t);
                     grid.appendChild(wrap);
                 });
                 subContainer.appendChild(grid);
             } else if (sub.type === 'radio_visual') {
                 const rgrid = document.createElement('div');
                 rgrid.className = 'radio-visual-grid';
                 sub.options.forEach(opt => {
                     const card = document.createElement('label');
                     card.className = 'radio-visual-card';
                     card.innerHTML = `
                        <div style="display:flex; align-items:center; margin-bottom:12px;">
                           <input type="radio" name="input-${sub.id}" value="${opt.id}">
                           <span>${opt.label}</span>
                        </div>
                        <div class="diagram-box" style="margin:0;">${opt.svg}</div>
                     `;
                     rgrid.appendChild(card);
                 });
                 subContainer.appendChild(rgrid);
             } else if (sub.type === 'table_input' || sub.type === 'routing_table') {
                 const tBox = document.createElement('div');
                 tBox.style.overflowX = 'auto';
                 let tHtml = `<table class="exam-table">`;
                 if(sub.tableConfig.title) {
                     tHtml += `<caption>${sub.tableConfig.title}</caption>`;
                 }
                 tHtml += `<thead><tr>`;
                 sub.tableConfig.columns.forEach(col => {
                     tHtml += `<th style="width:${col.width || 'auto'}">${col.title}</th>`;
                 });
                 tHtml += `</tr></thead><tbody>`;
                 sub.tableConfig.rows.forEach((r, rIndex) => {
                     tHtml += `<tr>`;
                     // Handle simple array of fields (routing_table style)
                     const fieldsToRender = r.fields ? r.fields : (r.columns ? r.columns : []);
                     if(r.name) {
                         tHtml += `<td><b>${r.name}</b></td>`;
                     }
                     fieldsToRender.forEach(f => {
                         tHtml += `<td>`;
                         if (f.readonly) {
                             tHtml += `<span class="readonly-cell">${f.value}</span>`;
                         } else {
                             if(f.rows) {
                                tHtml += `<textarea id="input-${f.id}" rows="${f.rows}" placeholder="${f.placeholder||''}"></textarea>`;
                             } else {
                                tHtml += `<input type="text" id="input-${f.id}" placeholder="${f.placeholder||''}">`;
                             }
                         }
                         tHtml += `</td>`;
                     });
                     tHtml += `</tr>`;
                 });
                 tHtml += `</tbody></table>`;
                 tBox.innerHTML = tHtml;
                 subContainer.appendChild(tBox);
             }

             taskWrap.appendChild(subContainer);
         });
         
         container.appendChild(taskWrap);
     });
  }

  function cancelExam() {
     if(confirm('Möchtest du die Simulation wirklich abbrechen?')) {
         if (examTimerInterval) clearInterval(examTimerInterval);
         document.getElementById('selection-view').style.display = 'block';
         document.getElementById('exam-view').style.display = 'none';
         document.getElementById('page-title').innerText = 'Prüfungssimulation';
         document.getElementById('page-desc').innerText = 'Wähle eine Prüfung aus, um die Simulation zu starten.';
         currentExamData = null;
     }
  }

  function submitExam() {
     if(confirm('Prüfung wirklich abgeben?')) {
         showResults();
     }
  }

  function showResults() {
      if (examTimerInterval) clearInterval(examTimerInterval);
      document.getElementById('exam-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      
      document.getElementById('page-title').innerText = 'Auswertung';
      document.getElementById('page-desc').innerText = 'Vergleiche deine Antworten mit den offiziellen IHK-Musterlösungen.';
      document.getElementById('result-exam-title').innerText = currentExamData.title;

      // Scroll nach oben
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const resultContainer = document.getElementById('result-container');
      resultContainer.innerHTML = '';

      currentExamData.tasks.forEach(task => {
          const taskWrap = document.createElement('div');
          
          const taskHeader = document.createElement('h3');
          taskHeader.innerText = `${task.title} (${task.points} Punkte)`;
          taskHeader.style.marginTop = '28px';
          taskHeader.style.borderBottom = '2px solid var(--border-strong)';
          taskHeader.style.paddingBottom = '8px';
          taskWrap.appendChild(taskHeader);

          if (task.context) {
              const tContext = document.createElement('div');
              tContext.className = 'task-context';
              tContext.innerText = task.context;
              taskWrap.appendChild(tContext);
          }

          task.subtasks.forEach(sub => {
              const subContainer = document.createElement('div');
              subContainer.className = 'subtask-container';
              subContainer.style.background = 'var(--surface-2)';

              if (sub.sectionTitle) {
                  const sTitle = document.createElement('h4');
                  sTitle.className = 'subtask-section-title';
                  sTitle.innerText = sub.sectionTitle;
                  subContainer.appendChild(sTitle);
              }
              if (sub.intro) {
                  const sIntro = document.createElement('div');
                  sIntro.className = 'subtask-intro';
                  sIntro.innerText = sub.intro;
                  subContainer.appendChild(sIntro);
              }
              if (sub.intro2) {
                  const sIntro2 = document.createElement('div');
                  sIntro2.className = 'subtask-intro';
                  sIntro2.innerText = sub.intro2;
                  subContainer.appendChild(sIntro2);
              }
              if (sub.terminalOutput) {
                  const term = document.createElement('pre');
                  term.className = 'terminal-block';
                  term.innerText = sub.terminalOutput;
                  subContainer.appendChild(term);
              }
              if (sub.quoteText) {
                  const quote = document.createElement('div');
                  quote.className = 'quote-block';
                  quote.innerText = sub.quoteText;
                  subContainer.appendChild(quote);
              }
              if (sub.diagramSvg) {
                  const diag = document.createElement('div');
                  diag.className = 'diagram-box';
                  diag.innerHTML = `<div class="diagram-header-tag">📐 Aufgaben-Grafik:</div>` + sub.diagramSvg;
                  subContainer.appendChild(diag);
              }
              if (sub.tableData) {
                  const tblBox = document.createElement('div');
                  tblBox.style.overflowX = 'auto';
                  tblBox.style.marginBottom = '16px';
                  let tblHtml = `<table class="exam-table" style="min-width:600px;">
                     <thead><tr>${sub.tableData.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>`;
                  sub.tableData.rows.forEach(r => {
                      tblHtml += `<tr>${r.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
                  });
                  tblHtml += `</tbody></table>`;
                  tblBox.innerHTML = `<div style="font-weight:600; font-size:13px; margin-bottom:6px;">${sub.tableData.title}</div>` + tblHtml;
                  subContainer.appendChild(tblBox);
              }

              const qText = document.createElement('div');
              qText.className = 'subtask-question';
              qText.innerText = `${sub.text} (${sub.points} Punkte)`;
              subContainer.appendChild(qText);

              // Vergleichsgitter
              const compareGrid = document.createElement('div');
              compareGrid.className = 'result-compare-grid';

              const userCol = document.createElement('div');
              userCol.className = 'result-column';
              userCol.innerHTML = `<div class="result-header"><span class="badge-user">Deine Antwort</span></div>`;

              const solCol = document.createElement('div');
              solCol.className = 'result-column';
              solCol.innerHTML = `<div class="result-header"><span class="badge-sol">Musterlösung (IHK)</span></div>`;

              // Rendering je nach Aufgabentyp
              if (sub.type === 'radio_visual') {
                  const checked = document.querySelector(`input[name="input-${sub.id}"]:checked`);
                  const selectedId = checked ? checked.value : null;
                  const selectedOpt = sub.options.find(o => o.id === selectedId);
                  const correctOpt = sub.options.find(o => o.isCorrect);

                  const userBox = document.createElement('div');
                  if (selectedOpt) {
                      userBox.innerHTML = `
                         <div style="font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:8px;">
                            <span>${selectedOpt.label}</span>
                            <span class="${selectedOpt.isCorrect ? 'badge-correct' : 'badge-incorrect'}">${selectedOpt.isCorrect ? '✓ Korrekt (+1 Pkt)' : '✗ Falsch'}</span>
                         </div>
                         <div class="diagram-box" style="margin:0; padding:10px; max-width:280px; border-color:${selectedOpt.isCorrect ? 'var(--status-good)' : 'var(--status-critical)'};">${selectedOpt.svg}</div>
                      `;
                  } else {
                      userBox.innerHTML = `<div style="color:var(--text-muted); font-style:italic;">Keine Auswahl getroffen</div>`;
                  }
                  userCol.appendChild(userBox);

                  const solBox = document.createElement('div');
                  if (sub.solutionDiagramSvg) {
                      solBox.innerHTML = `
                         <div class="solution-diagram-box">
                            <div class="diagram-header-tag" style="color:var(--status-good);">✓ Lösungsgrafik (IHK):</div>
                            ${sub.solutionDiagramSvg}
                         </div>
                         <div class="result-content" style="margin-top:10px;">${sub.solution}</div>
                      `;
                  } else {
                      solBox.innerHTML = `
                         <div style="font-weight:600; margin-bottom:8px; color:var(--status-good);">
                            ${correctOpt ? correctOpt.label : sub.solution} <span class="badge-correct">✓ Richtige Lösung</span>
                         </div>
                         ${correctOpt ? `<div class="diagram-box" style="margin:0; padding:10px; max-width:280px; border-color:var(--status-good);">${correctOpt.svg}</div>` : ''}
                         <div class="result-content" style="margin-top:10px;">${sub.solution}</div>
                      `;
                  }
                  solCol.appendChild(solBox);

              } else if (sub.id === '2aa' && sub.solutionTable) {
                  // Spezifische Tabellenauswertung für 2aa (IPv4-Routentabelle)
                  const st = sub.solutionTable;
                  
                  const uVals = {
                      r2_gw: document.getElementById('input-2aa_r2_gw')?.value.trim() || '',
                      r3_gw: document.getElementById('input-2aa_r3_gw')?.value.trim() || '',
                      r4_gw: document.getElementById('input-2aa_r4_gw')?.value.trim() || '',
                      r5_net: document.getElementById('input-2aa_r5_net')?.value.trim() || '',
                      r5_mask: document.getElementById('input-2aa_r5_mask')?.value.trim() || '',
                      r6_net: document.getElementById('input-2aa_r6_net')?.value.trim() || '',
                      r6_mask: document.getElementById('input-2aa_r6_mask')?.value.trim() || '',
                      r7_net: document.getElementById('input-2aa_r7_net')?.value.trim() || '',
                      r7_mask: document.getElementById('input-2aa_r7_mask')?.value.trim() || ''
                  };

                  // Nutzertabelle
                  const userTblWrap = document.createElement('div');
                  userTblWrap.style.overflowX = 'auto';
                  let userTblHtml = `<table class="result-table">
                     <thead><tr>${st.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>
                     <tr><td>10.1.0.0</td><td>255.255.0.0</td><td>direct</td><td>IF1</td></tr>
                     <tr><td>10.2.0.0</td><td>255.255.0.0</td><td class="${uVals.r2_gw === '192.168.0.2' ? 'user-highlight-ok' : (uVals.r2_gw ? '' : 'user-highlight-empty')}">${uVals.r2_gw || '(leer)'}</td><td>-</td></tr>
                     <tr><td>10.3.0.0</td><td>255.255.0.0</td><td class="${uVals.r3_gw === '192.168.0.6' ? 'user-highlight-ok' : (uVals.r3_gw ? '' : 'user-highlight-empty')}">${uVals.r3_gw || '(leer)'}</td><td>-</td></tr>
                     <tr><td>10.4.0.0</td><td>255.255.0.0</td><td class="${uVals.r4_gw === '192.168.0.10' ? 'user-highlight-ok' : (uVals.r4_gw ? '' : 'user-highlight-empty')}">${uVals.r4_gw || '(leer)'}</td><td>-</td></tr>
                     <tr><td class="${uVals.r5_net === '192.168.0.0' ? 'user-highlight-ok' : (uVals.r5_net ? '' : 'user-highlight-empty')}">${uVals.r5_net || '(leer)'}</td><td class="${uVals.r5_mask === '255.255.255.252' ? 'user-highlight-ok' : (uVals.r5_mask ? '' : 'user-highlight-empty')}">${uVals.r5_mask || '(leer)'}</td><td>direct</td><td>IF2</td></tr>
                     <tr><td class="${uVals.r6_net === '192.168.0.4' ? 'user-highlight-ok' : (uVals.r6_net ? '' : 'user-highlight-empty')}">${uVals.r6_net || '(leer)'}</td><td class="${uVals.r6_mask === '255.255.255.252' ? 'user-highlight-ok' : (uVals.r6_mask ? '' : 'user-highlight-empty')}">${uVals.r6_mask || '(leer)'}</td><td>direct</td><td>IF3</td></tr>
                     <tr><td class="${uVals.r7_net === '192.168.0.8' ? 'user-highlight-ok' : (uVals.r7_net ? '' : 'user-highlight-empty')}">${uVals.r7_net || '(leer)'}</td><td class="${uVals.r7_mask === '255.255.255.252' ? 'user-highlight-ok' : (uVals.r7_mask ? '' : 'user-highlight-empty')}">${uVals.r7_mask || '(leer)'}</td><td>direct</td><td>IF4</td></tr>
                     <tr><td>0.0.0.0</td><td>0.0.0.0</td><td>210.10.10.1</td><td>-</td></tr>
                     <tr><td>210.10.10.1</td><td>255.255.255.255</td><td>direct</td><td>dsl</td></tr>
                     </tbody></table>`;
                  userTblWrap.innerHTML = userTblHtml;
                  userCol.appendChild(userTblWrap);

                  // Lösungstabelle
                  const solTblWrap = document.createElement('div');
                  solTblWrap.style.overflowX = 'auto';
                  let solTblHtml = `<table class="result-table">
                     <thead><tr>${st.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                     <tbody>`;
                  st.rows.forEach(r => {
                      solTblHtml += `<tr>
                         <td>${r.filled.includes('target') ? `<span class="sol-highlight">${r.target}</span>` : r.target}</td>
                         <td>${r.filled.includes('mask') ? `<span class="sol-highlight">${r.mask}</span>` : r.mask}</td>
                         <td>${r.filled.includes('gw') ? `<span class="sol-highlight">${r.gw}</span>` : r.gw}</td>
                         <td>${r.iface}</td>
                      </tr>`;
                  });
                  solTblHtml += `</tbody></table>`;
                  solTblWrap.innerHTML = solTblHtml;
                  solCol.appendChild(solTblWrap);

              } else if (sub.id === '1cc' && sub.solutionTable) {
                  // Spezifische Tabellenauswertung für 1cc (STP vs Link-Aggregation)
                  const st = sub.solutionTable;
                  
                  const uStpFkt = document.getElementById('input-1cc_stp_fkt')?.value.trim() || '';
                  const uStpReakt = document.getElementById('input-1cc_stp_reakt')?.value.trim() || '';
                  const uLacpFkt = document.getElementById('input-1cc_lacp_fkt')?.value.trim() || '';
                  const uLacpReakt = document.getElementById('input-1cc_lacp_reakt')?.value.trim() || '';

                  // Nutzertabelle
                  const userTblWrap = document.createElement('div');
                  userTblWrap.style.overflowX = 'auto';
                  userTblWrap.innerHTML = `
                     <table class="result-table">
                        <thead><tr><th>Protokoll</th><th>Funktionsweise (Normal)</th><th>Reaktion bei Ausfall</th></tr></thead>
                        <tbody>
                           <tr>
                              <td><b>Spanning-Tree</b></td>
                              <td>${uStpFkt ? uStpFkt.replace(/\n/g, '<br>') : '<span class="user-highlight-empty">(Keine Eingabe)</span>'}</td>
                              <td>${uStpReakt ? uStpReakt.replace(/\n/g, '<br>') : '<span class="user-highlight-empty">(Keine Eingabe)</span>'}</td>
                           </tr>
                           <tr>
                              <td><b>Link-Aggregation</b></td>
                              <td>${uLacpFkt ? uLacpFkt.replace(/\n/g, '<br>') : '<span class="user-highlight-empty">(Keine Eingabe)</span>'}</td>
                              <td>${uLacpReakt ? uLacpReakt.replace(/\n/g, '<br>') : '<span class="user-highlight-empty">(Keine Eingabe)</span>'}</td>
                           </tr>
                        </tbody>
                     </table>
                  `;
                  userCol.appendChild(userTblWrap);

                  // Lösungstabelle
                  const solTblWrap = document.createElement('div');
                  solTblWrap.style.overflowX = 'auto';
                  solTblWrap.innerHTML = `
                     <table class="result-table">
                        <thead><tr><th>Protokoll</th><th>Funktionsweise, solange beide Leitungen störungsfrei sind</th><th>Reaktion der Verbindung, wenn eine Leitung ausfällt</th></tr></thead>
                        <tbody>
                           <tr>
                              <td><b>Spanning-Tree-Protocol</b></td>
                              <td><span class="sol-highlight" style="display:block; padding:4px 8px; font-weight:normal;">${st.rows[0].normal}</span></td>
                              <td><span class="sol-highlight" style="display:block; padding:4px 8px; font-weight:normal;">${st.rows[0].failover}</span></td>
                           </tr>
                           <tr>
                              <td><b>Link-Aggregation</b></td>
                              <td><span class="sol-highlight" style="display:block; padding:4px 8px; font-weight:normal;">${st.rows[1].normal}</span></td>
                              <td><span class="sol-highlight" style="display:block; padding:4px 8px; font-weight:normal;">${st.rows[1].failover}</span></td>
                           </tr>
                        </tbody>
                     </table>
                  `;
                  solCol.appendChild(solTblWrap);

              } else if (sub.type === 'split_textarea') {
                  const userBox = document.createElement('div');
                  sub.fields.forEach(f => {
                      const val = document.getElementById(`input-${f.id}`)?.value.trim() || '';
                      const item = document.createElement('div');
                      item.style.marginBottom = '12px';
                      item.innerHTML = `
                         <div style="font-weight:600; font-size:12.5px; color:var(--text-secondary); margin-bottom:4px;">${f.label}</div>
                         <div class="result-content">${val ? val : '<span class="user-highlight-empty">(Keine Eingabe)</span>'}</div>
                      `;
                      userBox.appendChild(item);
                  });
                  userCol.appendChild(userBox);

                  const solBox = document.createElement('div');
                  solBox.innerHTML = `<div class="result-content">${sub.solution}</div>`;
                  solCol.appendChild(solBox);

              } else {
                  // Standard textarea
                  const userVal = document.getElementById(`input-${sub.id}`)?.value.trim() || '';
                  const userBox = document.createElement('div');
                  userBox.innerHTML = `<div class="result-content">${userVal ? userVal : '<span class="user-highlight-empty">(Keine Antwort eingegeben)</span>'}</div>`;
                  userCol.appendChild(userBox);

                  const solBox = document.createElement('div');
                  if (sub.solutionDiagramSvg) {
                      solBox.innerHTML = `
                         <div class="solution-diagram-box">
                            <div class="diagram-header-tag" style="color:var(--status-good);">✓ Lösungsgrafik (IHK):</div>
                            ${sub.solutionDiagramSvg}
                         </div>
                         <div class="result-content" style="margin-top:10px;">${sub.solution}</div>
                      `;
                  } else {
                      solBox.innerHTML = `<div class="result-content">${sub.solution}</div>`;
                  }
                  solCol.appendChild(solBox);
              }

              compareGrid.appendChild(userCol);
              compareGrid.appendChild(solCol);
              subContainer.appendChild(compareGrid);

              taskWrap.appendChild(subContainer);
          });

          resultContainer.appendChild(taskWrap);
      });
  }

  function closeResults() {
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('selection-view').style.display = 'block';
      document.getElementById('page-title').innerText = 'Prüfungssimulation';
      document.getElementById('page-desc').innerText = 'Wähle eine Prüfung aus, um die Simulation zu starten.';
      currentExamData = null;
  }
</script>
