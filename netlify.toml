[build]
  publish = "."
  command = ""

# /tracker/ gab es bis zur Aufteilung in Übersicht/SoWi/Konzeption &
# Administration/Netzwerke — alte Lesezeichen/Links landen jetzt auf dem Hub,
# statt ins Leere zu laufen.
[[redirects]]
  from = "/tracker"
  to = "/"
  status = 301
[[redirects]]
  from = "/tracker/*"
  to = "/"
  status = 301

# Kein Catch-all-Rewrite mehr: für jeden Pfad (/, /uebersicht/, /sowi/,
# /konzeption-administration/, /netzwerke/, /simulation/) gibt es eine echte
# Datei, Netlify liefert sie direkt aus. Nur echte 404s fallen auf die
# Root-Startseite zurück, statt Nutzer:innen einen nackten "Page not found"
# zu zeigen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
