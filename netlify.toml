[build]
  publish = "."
  command = ""

# Kein Catch-all-Rewrite mehr: seit der Aufteilung in /, /tracker/ und
# /simulation/ gibt es für jeden Pfad eine echte Datei, Netlify liefert
# sie direkt aus. Nur echte 404s fallen auf die Root-Startseite zurück,
# statt Nutzer:innen einen nackten "Page not found" zu zeigen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
